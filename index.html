<meta charset="utf-8">
<title>Tier One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#E6EAEE; --surface:#FBFCFD; --surface2:#EEF2F6; --ink:#131A21; --muted:#56616C; --line:#D2DAE2;
  --p:#2156C9; --p-ink:#FFFFFF; --p-soft:#DCE6F8;
  --good:#23804A; --bad:#C0392B; --warn:#A96400;
  --p1:#C62F2F; --p2:#D9771C; --p3:#2F7FC4; --p4:#7C8893;
  --r-founder:#2156C9; --r-desk:#2F8E7B; --r-eng:#7A4FB5; --r-am:#C98314; --r-sdm:#C24E7A; --r-hdm:#B0452A; --r-sm:#3F7F2A;
  --fl-ground:#D7E1EA; --fl-grid:#C6D3DF; --fl-sea1:#DCE9F2; --fl-sea2:#C7DCEC; --fl-r1:#EDF1F5; --fl-r2:#E2E8EF; --fl-r3:#D3DBE4; --fl-coast:#AEBCC9; --carpet:#C9CFD6; --carpet2:#C0C7CF; --wall:#38424C; --glass:#9CC7E6;
  --desk:#CDA57C; --desk-edge:#A7805A; --monitor:#232A31; --screen:#86BBEA; --chair:#4A545E;
  --kitchen:#ECE5D5; --meeting:#DCC7A8; --noc:#2B3440; --training:#DCE2E8; --plant:#4F8F5B; --bubble:#FFFFFF; --rug:#B9695A;
  --shadow:0 1px 0 rgba(19,26,33,.05),0 12px 32px -14px rgba(19,26,33,.4);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F151B; --surface:#161E26; --surface2:#1D2731; --ink:#E4EAF0; --muted:#98A5B2; --line:#2A3642;
    --p:#6D9BF2; --p-ink:#0A1630; --p-soft:#1B2A45;
    --good:#5DC282; --bad:#EF7B6C; --warn:#E3A74A;
    --p1:#EF6B6B; --p2:#F0A04B; --p3:#62A8E8; --p4:#9AA6B1;
    --r-founder:#6D9BF2; --r-desk:#5DB8A6; --r-eng:#A585DD; --r-am:#E9B04F; --r-sdm:#E07FA5; --r-hdm:#E98A6E; --r-sm:#86C46A;
    --fl-ground:#0C1319; --fl-grid:#16222D; --fl-sea1:#14232F; --fl-sea2:#0D1922; --fl-r1:#232F38; --fl-r2:#2B3742; --fl-r3:#354350; --fl-coast:#3C4C5A; --carpet:#29323B; --carpet2:#252D36; --wall:#8A98A6; --glass:#3F6D8F;
    --desk:#6E5641; --desk-edge:#54402F; --monitor:#0B0F13; --screen:#5E9AD6; --chair:#5A6570;
    --kitchen:#3A3630; --meeting:#4A3E30; --noc:#11171D; --training:#2E3844; --plant:#5FA36C; --bubble:#F4F6F8; --rug:#7C4439;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 32px -12px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151B; --surface:#161E26; --surface2:#1D2731; --ink:#E4EAF0; --muted:#98A5B2; --line:#2A3642;
  --p:#6D9BF2; --p-ink:#0A1630; --p-soft:#1B2A45;
  --good:#5DC282; --bad:#EF7B6C; --warn:#E3A74A;
  --p1:#EF6B6B; --p2:#F0A04B; --p3:#62A8E8; --p4:#9AA6B1;
  --r-founder:#6D9BF2; --r-desk:#5DB8A6; --r-eng:#A585DD; --r-am:#E9B04F; --r-sdm:#E07FA5; --r-hdm:#E98A6E; --r-sm:#86C46A;
  --fl-ground:#0C1319; --fl-grid:#16222D; --fl-sea1:#14232F; --fl-sea2:#0D1922; --fl-r1:#232F38; --fl-r2:#2B3742; --fl-r3:#354350; --fl-coast:#3C4C5A; --carpet:#29323B; --carpet2:#252D36; --wall:#8A98A6; --glass:#3F6D8F;
  --desk:#6E5641; --desk-edge:#54402F; --monitor:#0B0F13; --screen:#5E9AD6; --chair:#5A6570;
  --kitchen:#3A3630; --meeting:#4A3E30; --noc:#11171D; --training:#2E3844; --plant:#5FA36C; --bubble:#F4F6F8; --rug:#7C4439;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 32px -12px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
html{scrollbar-gutter:stable}
body{color:var(--ink);font:15px/1.45 var(--body);padding-inline:16px;padding-block:0 28px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--p);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.neg{color:var(--bad)} .pos{color:var(--good)} .wrn{color:var(--warn)} .mut{color:var(--muted)}
.app{max-width:1440px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-inline:-16px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.logo{font-family:var(--display);font-weight:800;font-size:1.4rem;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:7px}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.logo i.paused{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.co{color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14em}
.when{display:flex;flex-direction:column;line-height:1.15;min-width:7.5em}
.when b{font-family:var(--display);font-size:1rem}
.when span{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.speed button{border:0;background:none;padding:7px 9px;font-weight:600;font-size:.85rem;font-family:var(--mono);min-width:44px}
.speed button+button{border-left:1px solid var(--line)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stats{display:flex;gap:4px 18px;flex-wrap:wrap;margin-left:auto}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat .v{font-family:var(--mono);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums}
.stat .k{font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.ticker{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface);padding:6px 16px;font-size:.86rem}
.ticker .mast{font-family:var(--mono);font-weight:600;font-size:.72rem;letter-spacing:.06em;color:var(--p);white-space:nowrap}
.ticker .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(460px,1fr);gap:16px;margin-top:14px;align-items:start}
@media (max-width:1100px){.main{grid-template-columns:minmax(0,1fr)}}
.floor-head{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;padding:0 2px 6px}
.floor-head h2{font-size:1.1rem;font-weight:800}
.floor-head span{font-size:.8rem;color:var(--muted)}
.floor-head .grow{flex:1}
.stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--fl-ground)}
.rgn{cursor:pointer;transition:opacity .12s}
.rgn:hover{opacity:.82}
.stage canvas{display:block;width:100%;touch-action:manipulation}
.hint{font-size:.8rem;color:var(--muted);margin:6px 2px 0}
.mktdock{margin:8px 2px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.mkt-head{display:flex;align-items:center;gap:10px;padding:6px 10px}
.mkt-toggle{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink);cursor:pointer;font-size:.9rem;padding:2px;font-weight:600}
.mkt-caret{color:var(--muted);font-size:.8rem}
.mkt-tick{font-size:.8rem;margin-left:auto;white-space:nowrap}
.mkt-list .mkt-row{padding:6px 2px}
.spark{display:block;flex:0 0 auto}
.mkt-chart{margin:2px 0 12px}
.mkt-body{display:flex;min-height:260px;border-top:1px solid var(--line)}
.mkt-menu{flex:0 0 146px;width:146px;overflow:auto;border-right:1px solid var(--line);padding:4px;scrollbar-width:thin}
.mkt-mi{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);cursor:pointer;padding:5px 6px;border-radius:8px;line-height:1.25}
.mkt-mi+.mkt-mi{margin-top:1px}
.mkt-mi:hover{background:var(--surface2)}
.mkt-mi.sel{background:var(--p-soft)}
.mkt-mi.held b{color:var(--p)}
.mkt-tabs{display:flex;gap:3px;padding:6px 6px 0;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--surface2)}
.mkt-tabs button{border:1px solid var(--line);border-bottom:0;background:var(--surface);color:var(--muted);cursor:pointer;padding:5px 11px;border-radius:8px 8px 0 0;font-size:.82rem;font-weight:600}
.mkt-tabs button[aria-pressed="true"]{background:var(--p-soft);color:var(--ink);border-color:var(--p)}
.mkt-pane{padding:10px 12px;overflow:auto;max-height:58vh}
.mkt-pane .sec{margin:0 0 10px} .mkt-pane .sec:last-child{margin-bottom:0}
.inv-hub{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.inv-rail{flex:0 0 172px;display:flex;flex-direction:column;gap:3px}
.inv-nav{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:8px 10px;border-radius:9px;line-height:1.3}
.inv-nav:hover{background:var(--surface2)}
.inv-nav.sel{border-color:var(--p);background:var(--p-soft)}
.inv-nav .mut{font-size:.78rem}
.inv-main{flex:1 1 320px;min-width:0}
.inv-alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin:6px 0}
.inv-alloc span{display:block;height:100%}
@media(max-width:640px){.inv-rail{flex-basis:100%;flex-direction:row;flex-wrap:wrap}.inv-nav{flex:1 1 44%}}
.mkt-mi b{display:block;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkt-mi-l{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:.74rem;font-family:var(--mono)}
.mkt-main{flex:1;display:flex;flex-direction:column;min-width:0;padding:8px 10px}
.mkt-cap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.mkt-seg{margin-left:auto}
.mkt-seg button{font-size:.72rem;padding:2px 9px}
.mkt-def{font-size:.75rem;padding:4px 8px;border-radius:7px;margin:0 0 5px;line-height:1.3}
.mkt-def.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.mkt-def.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.mkt-tf{display:flex;gap:3px;margin:0 0 4px}
.mkt-tf button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:1px 8px;font-size:.72rem;cursor:pointer;font-family:var(--mono)}
.mkt-tf button[aria-pressed="true"]{background:var(--p);border-color:var(--p);color:var(--p-ink)}
.mkt-cv{width:100%;height:210px;display:block}
.mkt-own{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.78rem}
.mkt-own .mkt-bar{position:relative;flex:1;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;min-width:60px}
.mkt-own .mkt-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--p);border-radius:4px}
.mkt-own .mkt-bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted);opacity:.7}
@media (min-width:1101px){
  .main>section{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:540px}
  .main>section>.stage{flex:1 1 auto;min-height:130px}
  .mktdock.open{flex:0 0 auto;height:clamp(300px,52vh,560px);display:flex;flex-direction:column;min-height:0}
  .mktdock.open .mkt-body{flex:1;min-height:0}
  .mktdock.open .mkt-pane{flex:1;min-height:0;max-height:none}
  .mktdock.open .mkt-cv{height:auto;flex:1;min-height:120px}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:540px;position:sticky;top:130px;overflow:hidden}
@media (max-width:1100px){.panel{height:78vh;min-height:480px;position:static}}
.tabs{display:block;padding:4px 6px 0;border-bottom:1px solid var(--line);flex:none}
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.subtabs{display:flex;gap:2px;overflow-x:auto;padding-top:3px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 8px 9px;font-weight:600;font-size:.86rem;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}
.tab.grp{font-weight:700;font-size:.82rem;padding:7px 6px;border-radius:8px 8px 0 0}
.tab.grp[aria-selected="true"]{background:var(--surface2)}
.tab.sub{flex:0 0 auto;font-size:.82rem;padding:7px 10px 8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--p)}
.tab .b.dot{padding:0;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.tab .b{font-family:var(--mono);font-size:.68rem;background:var(--surface2);border-radius:6px;padding:0 5px;color:var(--ink)}
.tab .b.hot{background:var(--bad);color:#fff}
.tab .b.due{background:var(--warn);color:#fff}
button.chip.due{background:color-mix(in srgb,var(--warn) 18%,var(--surface));border-color:var(--warn);color:var(--ink);cursor:pointer}
button.chip.due:hover{background:var(--warn);color:#fff}
.pane{padding:16px 18px;overflow-y:auto;flex:1;min-height:0;scrollbar-gutter:stable}
.pane h3{font-size:1.02rem;font-weight:800;margin:0 0 6px}
.pane .sec+.sec{margin-top:18px}
.lede{font-size:.86rem;color:var(--muted);margin:0 0 10px;max-width:62ch}

/* bits */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:600;font-size:.86rem}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--p);color:var(--p-ink);border-color:var(--p)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.tile{background:var(--surface2);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:1px}
.tile .v{font-family:var(--mono);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.tile .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tile small{font-size:.74rem;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item.click{cursor:pointer;border-radius:8px;padding-inline:6px;margin-inline:-6px}
.item.click:hover{background:var(--surface2)}
.item b{font-weight:700}
.item .sub{font-size:.8rem;color:var(--muted);grid-column:1/-1}
.item .r{text-align:right;font-family:var(--mono);font-size:.88rem}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:.7rem;font-weight:600;border-radius:5px;padding:1px 6px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip.p{background:var(--p-soft);border-color:transparent;color:var(--ink)}
.pri{font-family:var(--mono);font-size:.7rem;font-weight:600;color:#fff;border-radius:4px;padding:1px 5px}
.pri1{background:var(--p1)}.pri2{background:var(--p2)}.pri3{background:var(--p3)}.pri4{background:var(--p4)}
.meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--good)}
.meter.w i{background:var(--warn)} .meter.b i{background:var(--bad)} .meter.p i{background:var(--p)}
.dots{display:inline-flex;gap:2px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.role{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 6px;font-weight:600;font-size:.82rem;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button small{font-weight:400;font-size:.7rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--p);color:var(--p-ink);border-color:var(--p)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.85}
.seg button:disabled{opacity:.4;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:.86rem}
td,th{padding:5px 0;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-bottom:0}
tr.head td{font-weight:700;padding-top:10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
canvas.chart{display:block;width:100%;height:150px;margin-top:6px}
.key{display:flex;gap:14px;font-size:.75rem;color:var(--muted)}
.key i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.news{list-style:none;margin:0;padding:0}
.news li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem;display:grid;grid-template-columns:5.2em 1fr;gap:8px}
.news time{font-family:var(--mono);font-size:.72rem;color:var(--muted);padding-top:2px}
.news li.good span{color:var(--good)} .news li.bad span{color:var(--bad)} .news li.event span{color:var(--warn)} .news li.month span{font-weight:700}
.miles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
@media (max-width:480px){.miles{grid-template-columns:1fr}}
.miles li{display:flex;gap:8px;align-items:flex-start;font-size:.84rem}
.miles li span{color:var(--muted);display:block;font-size:.76rem}
.tick{flex:none;width:15px;height:15px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.miles li.done .tick{background:var(--p);border-color:var(--p)}
.empty{font-size:.86rem;color:var(--muted);padding:10px 0}
.note{font-size:.84rem;background:var(--surface2);border-radius:9px;padding:9px 11px;margin:8px 0}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.note.bad{background:color-mix(in srgb,var(--bad) 13%,var(--surface))}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,12,16,.55);display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;padding:20px;box-shadow:var(--shadow);max-height:calc(100% - 24px);overflow:auto}
.dialog.wide{max-width:680px}
.kick{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:0}
.dialog h2{font-size:1.45rem;margin:4px 0 8px;line-height:1.15}
.dialog p{margin:0 0 10px;color:var(--muted);max-width:60ch}
.dialog .x{float:right;border:0;background:var(--surface2);width:32px;height:32px;border-radius:50%;font-size:1.1rem;line-height:1}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px}
.choice:hover:not(:disabled){border-color:var(--p)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.choice b{display:block}
.choice span{font-size:.83rem;color:var(--muted)}
.field{display:grid;gap:4px;margin:10px 0}
.field label{font-weight:600;font-size:.85rem}
.field input{font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.foot2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);align-items:center}
.foot2 .grow{flex:1}
.big{font-family:var(--mono);font-size:1.5rem;font-weight:600}
.cands{display:grid;gap:8px;margin-top:10px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;align-items:center}
.cand .sub{font-size:.8rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:.8rem;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:.8rem}
.scrollx{overflow-x:auto;margin-inline:-2px}
table.matrix{font-size:.8rem;white-space:nowrap}
table.matrix th,table.matrix td{padding:4px 6px}
table.matrix tr.click{cursor:pointer}
table.matrix tr.click:hover td{background:var(--surface2)}
td.fam{text-align:center;font-family:var(--mono);font-size:.74rem;border-radius:4px}
td.fam.hi{background:color-mix(in srgb,var(--good) 26%,var(--surface));}
td.fam.mid{background:color-mix(in srgb,var(--warn) 22%,var(--surface));}
td.fam.lo{background:color-mix(in srgb,var(--bad) 16%,var(--surface));}
td.fam.no{color:var(--muted)}
.plan{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.traits{display:grid;gap:6px;margin-top:10px}
.trait{background:var(--surface2);border-radius:9px;padding:8px 10px;font-size:.84rem}
.trait b{display:block}
.trait span{color:var(--muted)}
.trait.unk{background:none;border:1px dashed var(--line)}
.inotes{display:block;font-style:italic;color:var(--ink);margin:4px 0}
.kbd{font-family:var(--mono);font-size:.74rem;border:1px solid var(--line);border-radius:4px;padding:0 4px}
abbr[title]{text-decoration:underline dotted;text-underline-offset:2px;cursor:help}

function payroll(){return staffOn().filter(started).reduce((a,s)=>a+s.salary,0)*(1+ONCOST);}
function toolsCost(){return VEND_ORDER.reduce((a,k)=>a+vendMonthly(k),0);}
function burn(){return costOfSales()+payroll()+toolsCost()+TIERS[S.office.tier].rent+S.co.loan*LOAN_APR/12;}
function loanLimit(){return Math.floor((15000+groupMRR()*4)/5000)*5000;}
function speedOf(st){
  const ramp=st.id!=="you"&&S.day-st.start<15?0.6+0.4*(S.day-st.start)/15:1;
  const psaM=(typeof psaMult==='function')?psaMult():(vendOn('psa')?1.12:1);
  const docM=(typeof docsMult==='function')?docsMult():(vendOn('docs')?1.08:1);
  return (0.62+0.12*st.skill)*(0.7+0.3*st.morale/100)*ramp*psaM*docM*traitSpeed(st)*mgrSpeed(st);
}
function hoursOf(st){
  const sp=speedOf(st);
  if(st.role==='founder'){const H=9*sp,f=MODES[S.co.mode];return {total:H,tix:H*f.tix,proj:0,sales:H*f.sales,mgmt:H*f.mgmt};}
  const H=7.5*sp;
  if(st.role==='desk')return {total:H,tix:H,proj:0,sales:0,mgmt:0};
  if(st.role==='eng'){const f=FOCUS[st.focus||'balanced'].f;return {total:H,tix:H*f,proj:H*(1-f),sales:0,mgmt:0};}
  if(st.role==='am')return {total:H,tix:0,proj:0,sales:H,mgmt:0};

  if(st.role==='sm'){const team=ams().filter(a=>present(a)).length;return {total:H,tix:0,proj:0,sales:H*(team>=3?0.35:team>=1?0.5:0.7),mgmt:0};}
  return {total:H,tix:0,proj:0,sales:0,mgmt:H};
}

/* ============ tickets ============ */
const HD=7.5,SLA_H={1:4,2:8,3:22.5,4:37.5},RESP_H={1:0.5,2:1,3:4,4:7.5};
const bornAt=t=>t.born*HD+(t.bh||0);
const tAge=t=>(S.day+1)*HD-bornAt(t);
function mkTicket(c,k){
  const d=SVC[k];const lvl=Math.random()<d.l2?2:1;
  const pri=k==='security'?wpick([[1,.15],[2,.35],[3,.4],[4,.1]]):wpick([[1,.04],[2,.2],[3,.56],[4,.2]]);
  const hrs=lvl===1?rnd(.15,0.9):rnd(.6,1.8);
  let prod=null;const kp=cat=>{const x=c.kit&&c.kit[cat];return x&&x.state!=='aligned'&&x.state!=='new'?x.p:(catLive(cat)?stdProd(cat):null);};
  if(k==='telecoms'||k==='connect')prod=kp('voice');else if(k==='backup')prod=kp('backup');else if(k==='security')prod=kp('edr');
  else if(k==='support'){const r=Math.random();if(r<0.2)prod=kp('rmm');else if(r<0.3)prod=kp('fw');}
  const subj=pick(SUBJ[k]);let P=pri,H=hrs,Lv=lvl;
  if(/dodgy|abroad|Isolate|infected|EDR alert|Internet down|Leased line flapping/.test(subj))P=Math.min(P,2);
  if(/Internet down|Isolate infected/.test(subj))P=1;
  if(/Password reset|Leaver|New starter|licence|Static IP|hunt group|Divert|Monitor|printer|Scanner|Shared mailbox/i.test(subj))P=Math.max(P,3);
  if(/Password reset|MFA|Shared mailbox|licence|Leaver/i.test(subj)){Lv=1;H=Math.min(H,rnd(0.15,0.4));}
  return {id:uid(),cid:c.id,svc:k,lvl:Lv,pri:P,hrs:H,left:H,born:S.day,br:false,subj,prod};
}
function genTickets(){
  const made=[];
  for(const c of active()){
    for(const k in c.svc){
      let rate=SVC[k].tix*units(c,k)*SECTORS[c.sector].tix/DPM;
      if(k==='support'){if(vendOn('rmm')&&c.rmmDone&&!(c.kit&&c.kit.rmm&&c.kit.rmm.state!=='aligned'))rate*=1-rmmCut();rate*=onbEffects(c);}
      if(k==='backup')rate*=PRODS[stdProd('backup')].tix||1;if(k==='security')rate*=PRODS[stdProd('edr')].tix||1;if(k==='telecoms'||k==='connect')rate*=PRODS[stdProd('voice')].tix||1;
      let n=Math.floor(rate)+(Math.random()<rate%1?1:0);
      while(n-->0){const t=mkTicket(c,k);S.tickets.push(t);made.push(t);}
    }
    kitTickets(c,made);
  }
  return made;
}
function backlogHours(){return S.tickets.reduce((a,t)=>a+t.left,0);}
function deskCapacity(){let h=0;for(const s of S.staff)if(present(s)){const x=hoursOf(s);h+=x.tix+(s.role==='eng'?x.proj*0.5:0);}return h;}

/* ============ the day ============ */
function step(){
  const today={ok:0,br:0,made:0};
  const made=genTickets();for(const t of made)if(t.bh==null)t.bh=rnd(0,HD);today.made=made.length;today.mh=0;today.l1in=0;today.l2in=0;today.bySvc={};for(const t of made){today.mh+=t.hrs;today[t.lvl===2?'l2in':'l1in']+=t.hrs;const k=t.prod&&PRODS[t.prod]&&PRODS[t.prod].foreign?'kit':t.svc;today.bySvc[k]=(today.bySvc[k]||0)+t.hrs;}
  // staff returning / leaving
  for(const s of S.staff){if(s.leaveOn!=null&&S.day>=s.leaveOn&&!s.left){s.left=true;S.qs.leavers++;log(s.name+' has left '+S.co.name+'.','bad');unassign(s.id);}}
  S.staff=S.staff.filter(s=>!s.left||s.id==='you');
  const W=S.staff.filter(present).map(st=>{const h=hoursOf(st);return {st,rate:hourRate(st,h.total),tix:h.tix,proj:h.proj,sales:h.sales,mgmt:h.mgmt,total:h.total,used:0,l2:st.role==='eng'||st.role==='founder',done:0,projDone:0};});
  // time already committed: account reviews, meetings
  for(const w of W){if(w.st.busyH>0&&w.st.role!=='founder'){const a=Math.min(w.sales+w.mgmt,w.st.busyH);const fromS=Math.min(w.sales,a);w.sales-=fromS;w.mgmt-=a-fromS;w.used+=a;w.st.busyH-=a;}if(w.st.qcH>0){const q=Math.min(w.tix,w.st.qcH);w.tix-=q;w.used+=q;w.st.qcH-=q;}}
  // stack admin
  let admin=toolsOn()*0.3+Object.keys(kitInUse()).length*0.15;
  const sdmW=W.filter(w=>w.st.role==='sdm'),fW=W.find(w=>w.st.role==='founder');
  for(const w of sdmW){const a=Math.min(admin,w.mgmt);w.mgmt-=a;w.used+=a;admin-=a;}
  if(fW&&admin>0){let a=Math.min(admin,fW.mgmt);fW.mgmt-=a;fW.used+=a;admin-=a;a=Math.min(admin,fW.tix);fW.tix-=a;fW.used+=a;}
  if(fW&&S.co.busy){let b=Math.min(3.5,S.co.busy);for(const f of ['sales','mgmt','tix']){const a=Math.min(b,fW[f]);fW[f]-=a;fW.used+=a;b-=a;}}
  // tickets pass 1
  S.tickets.sort((a,b)=>a.pri-b.pri||a.born-b.born);
  const desk=W.filter(w=>w.st.role==='desk'||w.st.role==='hdm'),eng=W.filter(w=>w.st.role==='eng'),fo=W.filter(w=>w.st.role==='founder');
  const lab={},learned={};
  // acknowledging new tickets: easy when there's slack, slips when the desk is saturated
  {let cap=0;for(const w of W)cap+=w.tix;const load=S.tickets.reduce((a,t)=>a+t.left,0)||1;const r=cap/load;for(const t of made){if(t.oneoff||t.first!=null)continue;if(Math.random()<Math.min(1,r*(t.pri===1?3:t.pri===2?2:1.2))){t.first=0.2;today.rOk=(today.rOk||0)+1;}}}
  const sen=desk.filter(w=>w.st.role==='desk'&&(w.st.skill||0)>=4);
  const byFam=(arr,p)=>arr.slice().sort((x,y)=>(p?fam(y.st,p)-fam(x.st,p):0)||(x.used/(x.total||1)-y.used/(y.total||1)));
  const work=(field)=>{
    for(const t of S.tickets){
      if(t.left<=0)continue;
      const order=t.lvl===2?byFam(eng,t.prod).concat(byFam(sen,t.prod),fo):byFam(desk,t.prod).concat(byFam(eng,t.prod),fo);
      for(const w of order){if(t.left<=0)break;if(w[field]<=0.01)continue;const sp=speedOn(w.st,t.prod)*(t.lvl===2&&w.st.role==='desk'?SENIOR_L2:1);const a=Math.min(w[field],t.left/sp);const st0=Math.max(S.day*HD+Math.min(w.used,HD),bornAt(t));if(t.first==null){t.first=st0-bornAt(t);if(!t.oneoff){if(t.first<=RESP_H[t.pri])today.rOk=(today.rOk||0)+1;else today.rBr=(today.rBr||0)+1;}}w[field]-=a;t.left-=a*sp;w.used+=a;t.res=st0+a-bornAt(t);if(!t.oneoff&&t.cid){const lb=lab[t.cid]||(lab[t.cid]={h:0,c:0});lb.h+=a;lb.c+=a*w.rate;}
        if(t.prod){const L=learned[w.st.id]||(learned[w.st.id]={});L[t.prod]=(L[t.prod]||0)+a;}
        if(t.left<=0.001){w.done++;w.last=t;onClose(w.st,t,null);}}
    }
  };
  work('tix');
  // urgent work comes before project time
  if(S.tickets.some(t=>t.left>0.001&&t.pri<=2&&!t.oneoff)){for(const w of eng.concat(fo)){w.tix+=w.proj;w.proj=0;}work('tix');}
  // projects
  for(const w of eng.concat(fo)){w.proj+=w.tix;w.tix=0;}
  onbWork(eng.concat(fo),learned,lab);
  S.projects.sort(typeof projOrder==='function'?projOrder:(a,b)=>a.due-b.due);
  for(const p of S.projects){
    for(const w of eng.concat(fo)){const need=p.actual-p.done;if(need<=0)break;if(w.proj<=0.01)continue;const a=Math.min(w.proj,need);w.proj-=a;const pm_=projMult(w.st);p.done+=a*pm_;if(hasT(w.st,'goldplater'))p.gold=true;if(pm_<1){w.st.slip=(w.st.slip||0)+a*(1-pm_);}w.used+=a;w.projDone+=a;p.cost=(p.cost||0)+a*w.rate;}
  }
  onbWork(eng.concat(fo),learned,lab,true);
  // leftover project hours back to tickets
  work('proj');
  // close tickets
  const keep=[];
  const slaHit=t=>{t.br=true;if(t.oneoff)return;today.br++;const c=C(t.cid);if(c){let hit={1:6,2:3,3:1.4,4:0.7}[t.pri];if(t.pri===1&&S.office.rooms.noc)hit/=2;if(S.staff.some(s=>s.role==='sdm'&&present(s)&&hasT(s,'process')))hit*=0.7;c.sat=Math.max(0,c.sat-hit);}};
  for(const t of S.tickets){if(t.left<=0.001){if(t.br||t.oneoff){}else if((t.res||0)>SLA_H[t.pri])slaHit(t);else{today.ok++;const c=C(t.cid);if(c)c.sat=Math.min(100,c.sat+0.12);}}else keep.push(t);}
  S.tickets=keep;
  // breaches
  for(const t of S.tickets){
    if(!t.br&&tAge(t)>SLA_H[t.pri])slaHit(t);
    if(t.first==null&&!t.rb&&!t.oneoff&&tAge(t)>RESP_H[t.pri]){t.rb=true;today.rBr=(today.rBr||0)+1;}
  }
  S.sla.push(today);if(S.sla.length>DPM*2)S.sla.shift();
  // tickets left rotting keep annoying the client every day, not just once
  for(const t of S.tickets){if(t.br&&t.cid&&!t.oneoff&&tAge(t)>SLA_H[t.pri]*2){const c=C(t.cid);if(c)c.sat=Math.max(0,c.sat-0.04);}}
  S.qs.ok+=today.ok;S.qs.br+=today.br;
  today.cap={};for(const w of W){const r=w.st.role;const c=today.cap[r]||(today.cap[r]={n:0,tot:0,used:0,tix:0,proj:0});c.n++;c.tot+=w.total;c.used+=w.used;c.tix+=w.tix;c.proj+=w.proj;}today.backlog=backlogHours();today.pj=W.filter(w=>w.st.role==='desk'||w.st.role==='eng').reduce((a,w)=>a+(w.projDone||0),0);today.tu=W.filter(w=>w.st.role==='desk'||w.st.role==='eng').reduce((a,w)=>a+w.used,0);
  knowLearn(learned);renewals();peopleDaily(W);mgrDaily();
  // rolling monthly labour per client (exponential average of the last month or so)
  for(const c of active()){const x=lab[c.id]||{h:0,c:0};c.lc=(c.lc||0)*(1-1/DPM)+x.c;c.lh=(c.lh||0)*(1-1/DPM)+x.h;}
  // utilisation and morale
  for(const w of W){
    const u=w.total>0?w.used/w.total:0;const s=w.st;
    const effU=(s.role==='am'||s.role==='sdm'||s.role==='hdm'||s.role==='sm'||s.role==='pm'||s.role==='tm'||s.role==='bill'||s.role==='bm')?0.85:u;
    s.util=s.util*0.85+effU*0.15;
    s.hotDays=s.util>0.97?(s.hotDays||0)+1:Math.max(0,(s.hotDays||0)-2);
    if(S.office.rooms.training&&s.role!=='founder'){s.xp=(s.xp||0)+(hasT(s,'quick')?0.02:0.01);if(s.xp>=1&&s.skill<5){s.xp=0;s.skill++;s.skillAt=S.day;log(s.name+' has grown into a level '+s.skill+' '+ROLES[s.role].short.toLowerCase()+'.','good');}}
    if(s.role!=='founder'&&s.morale<30&&s.leaveOn==null&&!s.resignQ&&Math.random()<0.01){s.resignQ=true;S.hq.push({id:'resign',ctx:{sid:s.id}});}
  }
  // management cover
  const mgmtH=W.reduce((a,w)=>a+w.mgmt,0);
  const cover=active().length?clamp(mgmtH*DPM/(active().length*3),0,1):1;
  S.cover=cover;
  // client drift
  for(const c of active()){
    const pm=Object.values(c.svc).reduce((a,x)=>Math.max(a,x.pm),0);
    const pr=priceRatio(c);const target=60+12*cover+(S.office.rooms.noc?2:0)-Math.max(0,pr-1.05)*45+Math.max(0,1-pr)*20;
    const ob=onbFor(c.id);const drag=ob&&!ob.live&&ob.kind==='full'&&S.day-ob.created>((typeof pmOn==='function'&&pmOn())?32:15)?8:0;

    c.sat=clamp(c.sat,0,100);
  }
  const cs=csat();
  // reputation drifts towards what clients actually experience: satisfaction, dragged down hard by missed SLAs
  {const slaNow=slaPct();const tgt=clamp(cs*0.95-Math.max(0,0.9-slaNow)*150,5,95);S.co.rep=clamp(S.co.rep+(tgt-S.co.rep)*0.003*(S.office.rooms.noc?1.3:1),5,100);}

    if(!p.late&&S.day>p.due){p.late=true;const c=C(p.cid);if(c){c.sat=Math.max(0,c.sat-8);c.trust=Math.max(0,c.trust-5);}log(p.name+' for '+(c?c.name:'a client')+' has missed its deadline.','bad');}
  }
  // sales: account managers spend what their book leaves them on new business
  const salesH=W.reduce((a,w)=>{let h=w.sales*(hasT(w.st,'hunter')?1.3:1)*(hasT(w.st,'farmer')?0.7:1)*(w.st.role==='am'?smSales():1)*(w.st.role==='founder'&&active().length<10?1.6:1);if(w.st.role==='am'){const cap=amCap(w.st);h*=1-0.6*Math.min(1,amLoad(w.st)/cap);}return a+h*(0.7+0.1*w.st.skill);},0);
  S.salesH=salesH;
  const room=marketRoom();
  let lead=salesH*LEAD_K*(0.6+S.co.rep/100);
  for(const c of active())if(c.sat>80)lead+=0.003;   // referrals from happy clients
  lead*=room;   // saturation gates both your selling and word-of-mouth: a full region has few businesses left to refer
  // a young firm still gets the odd inbound enquiry through word of mouth, even with nobody actively selling — so a new player left on Hands-on isn't stuck with a dead pipeline

function finishProject(p){

/* ============ sales ============ */
function addProspect(o){
  o=o||{};
  const sector=o.sector||pick(Object.keys(SECTORS));
  // the big local businesses go first, so as the home patch saturates the prospects left are smaller
  const sat=(typeof homeSaturation==='function')?homeSaturation():0;
  const maxSeats=(14+Math.min(S.co.rep,60)*0.6+Math.min(S.office.tier,2)*12)*(1-0.4*sat);
  const seats=o.seats||Math.max(3,Math.round(rnd(4,maxSeats)*rnd(0.55,1)));
  const wants=o.wants||wpick(WANTS);
  const d={id:uid(),kind:'new',name:o.name||genName(sector),sector,seats,svc:wants.slice(),created:S.day,exp:S.day+(o.exp||18),stage:'open',note:o.note||'',kit:genKit(wants)};
  S.deals.push(d);S.m.leads++;
  if(!o.silent)log('New lead: '+d.name+' ('+seats+' users) wants '+wants.map(k=>SVC[k].short.toLowerCase()).join(' and ')+'.','info');
  return d;
}
function nextFor(c){
  const has=k=>!!c.svc[k];const w=[];
  if(!has('support'))w.push(['support',has('telecoms')?4:2]);
  if(has('support')&&!has('m365'))w.push(['m365',3]);
  if(has('m365')&&!has('backup'))w.push(['backup',3]);
  if(has('support')&&!has('security'))w.push(['security',2]);
  if(!has('telecoms'))w.push(['telecoms',1.5]);
  if(!has('connect'))w.push(['connect',1]);
  return w.length?wpick(w):null;
}
function addCross(c,k,note){
  if(c.notice!=null)return null;
  k=k||nextFor(c);if(!k)return null;
  const d={id:uid(),kind:'cross',cid:c.id,svc:[k],created:S.day,exp:S.day+25,stage:'open',note:note||'',kit:k==='support'?genKit(['support'].concat(Object.keys(c.svc))):null};
  S.deals.push(d);S.m.leads++;
  const am=amOf(c);
  log((am?am.name+' spotted that '+c.name+' could use ':c.name+' is interested in ')+SVC[k].short.toLowerCase()+'.','info');
  return d;
}
/* account manager drafts */
function amPick(d,am){

function hitTest(mx,my){

function drawChart(){

  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const H=S.hist.slice(-24);const vals=H.flatMap(x=>[x.mrr,x.cash]);let lo=Math.min(0,...vals),hi=Math.max(1000,...vals);
  const pad={l:48,r:8,t:8,b:18};const sx=i=>pad.l+i*(w-pad.l-pad.r)/Math.max(1,H.length-1),sy=v=>pad.t+(hi-v)/(hi-lo)*(h-pad.t-pad.b);
  c.font='10px '+K.mono;c.fillStyle=K.muted;c.strokeStyle=K.line;c.lineWidth=1;
  for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;const y=sy(v);c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();c.fillText(gbp(v),2,y+3);}
  if(lo<0){c.strokeStyle=K.muted;c.beginPath();c.moveTo(pad.l,sy(0));c.lineTo(w-pad.r,sy(0));c.stroke();}
  c.fillText(mShort(H[0].mi),pad.l,h-4);c.textAlign='right';c.fillText(mShort(H[H.length-1].mi),w-pad.r,h-4);c.textAlign='left';
  [['mrr',K.p],['cash',K.good]].forEach(([k,col])=>{c.strokeStyle=col;c.lineWidth=2;c.beginPath();H.forEach((x,i)=>{const X_=sx(i),Y_=sy(x[k]);i?c.lineTo(X_,Y_):c.moveTo(X_,Y_);});c.stroke();
    const l=H[H.length-1];c.fillStyle=col;c.beginPath();c.arc(sx(H.length-1),sy(l[k]),3,0,7);c.fill();});
}

/* ============ scaling: first line vs second line, and what the workload actually needs ============ */
const ENG_PREMIUM=900;
function tixSplit(){let l1=0,l2=0;for(const t of S.tickets){if(t.lvl===2)l2+=t.left;else l1+=t.left;}return {l1,l2};}
function l1Capacity(){let h=0;for(const s of S.staff)if(present(s)&&(s.role==='desk'||s.role==='hdm'))h+=hoursOf(s).tix;return h;}
function l2Capacity(){let h=0;for(const s of S.staff)if(present(s)){const x=hoursOf(s);if(s.role==='eng')h+=x.tix+x.proj*0.5;else if(s.role==='founder')h+=x.tix*0.5;else if(s.role==='desk'&&(s.skill||0)>=4)h+=x.tix*0.25*SENIOR_L2;}return h;}
function l1Days(){const c=l1Capacity(),q=tixSplit().l1;return c>0?q/c:q>0?99:0;}
function l2Days(){const c=l2Capacity(),q=tixSplit().l2;return c>0?q/c:q>0?99:0;}
function projHoursLeft(){let h=0;for(const p of S.projects)h+=Math.max(0,p.est-p.done);for(const o of S.onb)if(o.stage!=='plan')for(const t of o.tasks)h+=Math.max(0,t.hrs-t.done);return h;}
function inflow(){const d=S.sla.slice(-DPM).filter(x=>x.l1in!=null);if(d.length<5)return null;return {l1:d.reduce((a,x)=>a+x.l1in,0)/d.length,l2:d.reduce((a,x)=>a+x.l2in,0)/d.length,n:d.length};}
/* headcount the workload needs, at 85% utilisation, clearing the current queue over a month and projects over two */
function teamNeed(){
  const f=inflow();if(!f)return null;const q=tixSplit(),pj=projHoursLeft();
  const per=r=>{const a=S.staff.filter(s=>s.role===r&&!s.left);return a.length?a.reduce((x,s)=>x+hoursOf(s).total,0)/a.length:7.5*0.85;};
  const fo=S.staff.find(s=>s.role==='founder');const foT=fo&&present(fo)?hoursOf(fo).tix:0;
  const hdmT=S.staff.filter(s=>s.role==='hdm'&&present(s)).reduce((a,s)=>a+hoursOf(s).tix,0);
  const desk=Math.max(0,f.l1+q.l1/DPM-hdmT)/(per('desk')*0.72);
  const engWork=f.l2+q.l2/DPM+pj/(DPM*2);
  const eng=Math.max(0,engWork-foT*0.5)/(per('eng')*0.72);
  return {desk,eng,l1in:f.l1,l2in:f.l2,pj,engWork};
}
/* how long before a newly signed project gets engineer time */
function projQueueDays(){
  const f=inflow();const pj=projHoursLeft();if(!pj)return 0;
  let engH=0;for(const s of S.staff)if(s.role==='eng'&&present(s))engH+=hoursOf(s).total;
  const fo=S.staff.find(s=>s.id==='you');if(fo&&present(fo)&&(S.co.mode==='hands'||S.co.mode==='mixed'))engH+=hoursOf(fo).tix*0.5;
  const spare=engH-(f?f.l2:0)-tixSplit().l2/DPM;
  return spare>0.3?pj/spare:999;
}

/* ============ build 17: contracts, pay and morale drivers ============ */

/* ---- market pay and what drives morale ---- */
function marketPay(s){const R=ROLES[s.role];if(!R||!R.sal)return s.salary||1;if(s.appr)return s.salary;const [lo,hi]=R.sal;return (lo+(hi-lo)*((s.skill||1)-1)/4)*(S.infl||1);}
const techRole=s=>s.role==='desk'||s.role==='eng';
function moraleTarget(s){
  const P=S.perks||{},parts=[];const add=(l,v)=>{if(Math.abs(v)>=0.5)parts.push([l,v]);};
  const soft=v=>v<0&&hasT(s,'steady')?v*0.5:v;
  const ratio=s.salary/marketPay(s);
  add(ratio<0.97?'Paid below the going rate':ratio>1.06?'Paid well for the role':'Paid about the going rate',soft(ratio<0.97?-(0.97-ratio)*180:ratio>1.06?Math.min(8,(ratio-1.06)*100):0));
  if(techRole(s)){const u=s.util||0;add(u>0.97?(s.hotDays>20?'Flat out for weeks':'Flat out'):u<0.5?'Not enough to do':'Workload is manageable',soft(u>0.97?(s.hotDays>20?-20:-10):u<0.5?-6:3));}
  if(s.role==='am'){const cap=amCap(s),ld=amLoad(s);if(ld>cap)add('Book is overloaded',soft(-8));if(s.perf!=null)add(s.perf>=1?'Hitting their sales target':'Behind on their sales target',soft(clamp((s.perf-0.8)*15,-10,8)));}
  const m=techRole(s)?mgrOn('hdm'):s.role==='am'?mgrOn('sm'):null;
  if(m){const e=effort(m);let v=[0,-4,-10][e]*(hasT(m,'driver')?1.5:1)*(hasT(m,'protective')?0.4:1);add(e?'Pressure from '+m.name.split(' ')[0]+'’s targets':'Steady management',soft(v||2));}
  if(P.social)add('Socials and perks',4);if(P.health)add('Private healthcare',2);if(P.pension&&S.day-s.start>YEAR)add('Enhanced pension',3);if(P.cars&&carRole(s))add('Car allowance',5);
  if(P.bonus)add('Profit share',S.last&&S.last.profit>0?4:-2);
  if(S.office.rooms.kitchen)add('A decent kitchen',4);else if(TIERS[S.office.tier].shared)add('Shared office facilities',1);
  if(S.office.rooms.training)add('Room to learn',2);
  if(s.role!=='founder'&&S.day-(s.skillAt||s.start)>YEAR*2&&(s.skill||1)<5)add('No progression in two years',soft(-6));
  const ex=(S.exits||[]).filter(d=>S.day-d<60).length;if(ex)add('Colleagues leaving',soft(-Math.min(8,ex*3)));
  const t=clamp(70+parts.reduce((a,p)=>a+p[1],0),5,100);
  return {t,parts:parts.sort((a,b)=>a[1]-b[1])};
}
function moraleDaily(){
  for(const s of S.staff){if(s.id==='you'||s.left||!started(s))continue;const M=moraleTarget(s);s.morale=clamp(s.morale+(M.t-s.morale)*0.03+rnd(-0.4,0.4),0,100);}
}

const PERS={honourable:{t:'Honourable',d:'Keeps its word. A good ally, slow to anger.'},opportunist:{t:'Opportunist',d:'Friendly while it pays. Watch it when you’re weak.'},predatory:{t:'Predatory',d:'Will go for your clients and staff the moment it sees a chance.'}};
function relInit(r){if(r.stance!=null)return;r.stance=r.tier===3?-5:rnd(-10,15);r.trust=rnd(40,60);r.pers=wpick([['honourable',35],['opportunist',45],['predatory',20]]);r.intel=r.tier>=2?1:0;r.mem=[];r.deals={};}
function remember(r,t){(r.mem=r.mem||[]).unshift({d:S.day,t});if(r.mem.length>8)r.mem.pop();}
function shift(r,st,tr){r.stance=clamp((r.stance||0)+(st||0),-100,100);r.trust=clamp((r.trust||50)+(tr||0),0,100);}
function stanceWord(v){return v<=-50?'Hostile':v<=-15?'Wary':v<15?'Neutral':v<50?'Friendly':'Allied';}
function trustWord(v){return v<25?'doesn’t trust you':v<45?'unsure of you':v<70?'trusts you':'trusts you completely';}
function intelWord(i){return ['Rough guesses only','Their public accounts','A good picture','Inside knowledge'][i||0];}
function fuzzy(r,v){const i=r.intel||0;if(i>=2)return String(v);const e=i===1?0.15:0.35;const lo=Math.max(0,Math.round(v*(1-e))),hi=Math.round(v*(1+e));return lo+' to '+hi;}
function agreed(r,k){return !!(r.deals&&r.deals[k]);}
function hostility(r){return Math.max(0,-(r.stance||0))/40+(r.target&&S.day<r.target?2:0)+(r.pers==='predatory'?0.3:0);}

function stakePrice(r){return Math.round(rSeats(r)*45*12*0.9*0.2/500)*500;}
function offerFor(r){const my=mrr();const mm=rSeats(r)*S.price.support*0.95;
  const base=r.pers==='honourable'?1.0:r.pers==='opportunist'?1.2:1.45;const warm=1-clamp(r.stance,-50,60)/250;
  if(r.stance<-30||(r.pers==='predatory'&&Math.random()<0.4)){shift(r,-3,0);log(r.name+' won’t discuss selling to you.','bad');return;}
  const n=Math.min(r.clients,160);const cl=[];let m=0;for(let i=0;i<n;i++){const sector=pick(Object.keys(SECTORS));const seats=Math.max(3,Math.round(MKT_TIERS[r.tier].seats*rnd(0.5,1.5)));const svcs=['support','m365'].concat(Math.random()<0.5&&vendOn('backup')?['backup']:[]);cl.push({sector,seats,svcs,name:genName(sector)});for(const k of svcs)m+=S.price[k]*0.9*seats;}
  const staff=[];for(let i=Math.min(r.staff,12);i>0;i--)staff.push(genCand(Math.random()<0.55?'desk':'eng','rec'));
  const price=Math.round(m*12*base*warm*rnd(0.9,1.1)/5000)*5000;
  S.pending={id:'acquire',ctx:{cl,mrr:Math.round(m),gm:rnd(0.3,0.5),churn:ri(6,20),staff,name:r.name,owner:r.pers==='honourable'?'The owners of '+r.name:'The board of '+r.name,price,big:r.tier>=1,rid:r.id,stack:{rmm:pick(['pulsar','meridian','truesight']),backup:pick(['coldvault','arksafe','drivesafe'])}}};
  remember(r,'You made an offer for the company.');shift(r,r.pers==='honourable'?3:-2,0);}
ACT_EXT.rAct=v=>{const [id,k]=v.split(':');const r=rivalById(id),A=RACTS[k];if(!A)return;if(!A.all&&!r)return;const why=A.ok(r);if(why)return;A.go(r);if(k==='buy'&&S.pending){ui.modal=null;}};
ACT_EXT.rEnd=v=>{const [id,k]=v.split(':');const r=rivalById(id),A=RACTS[k];if(r&&A&&A.end)A.end(r);};

/* ---------- running the relationships ---------- */
function relDaily(){
  for(const r of rivals()){relInit(r);
    if(r.deals.overflow){
      if(l2Days()>1.5){const take=Math.min(6,tixSplit().l2);if(take>0.5){let left=take;for(const t of S.tickets){if(left<=0)break;if(t.lvl===2&&t.left>0){const d=Math.min(t.left,left);t.left-=d;left-=d;}}spend((take-left)*60);r.earned=(r.earned||0)+(take-left)*60;}}
      else{const idle=S.staff.filter(s=>s.role==='eng'&&present(s)&&(s.util||1)<0.6);if(idle.length){const h=Math.min(4,idle.length*2);idle[0].busyH=(idle[0].busyH||0)+h;S.co.cash+=h*45;S.m.proj+=h*45;}}}
    if(r.stake&&S.day%DPM===0){const div=Math.round(rSeats(r)*45*0.1*0.2);S.co.cash+=div;S.m.invest=(S.m.invest||0)+div;}
    if(r.war&&S.day<r.war){spend(5000/DPM);if(Math.random()<1.8/DPM&&S.deals.length<18){const d=addProspect({note:'One of '+r.name+'’s clients, answering your campaign.'});if(d){d.from=r.id;d.bidders=(d.bidders||[]).filter(x=>x!==r.id);}}}
  }
  if(S.day%DPM===5)relMonthly();
}
function relMonthly(){const weak=S.co.cash<burn()*1.5||slaPct()<0.85||S.co.rep<40;const agg={easy:0,normal:1,hard:3}[S.diff||'normal'];
  for(const r of rivals()){
    r.stance+=(0-r.stance)*0.012;
    if(r.deals.refer){shift(r,2,1);if(Math.random()<0.45){const d=addProspect({note:'Referred by '+r.name+'.'});if(d)d.bidders=(d.bidders||[]).filter(x=>x!==r.id);}}
    if(r.deals.nopoach)shift(r,1,0.5);
    // their clients you took this month sour the relationship
    const took=(r.iTook||0)-(r.iTookSeen||0);if(took>0){r.iTookSeen=r.iTook;shift(r,-6*took,agreed(r,'refer')?-8*took:0);if(agreed(r,'refer')&&took>=2){RACTS.refer.end(r);log(r.name+' ended your referral partnership: you keep winning their clients.','bad');}}
    // retaliation, or an unprompted attack from a predatory firm when you look weak
    const provoked=r.stance<-35;const unprompted=r.pers==='predatory'&&agg&&(weak?0.03:0.006)*agg>Math.random();
    if(!(r.target>S.day)&&(provoked&&Math.random()<0.25||unprompted)&&!(S.diff==='easy'&&!provoked)){r.target=S.day+DPM*ri(2,4);remember(r,provoked?'They started going after your clients in retaliation.':'They started going after your clients.');
      const ally=rivals().find(a=>a!==r&&a.stance>=50&&a.trust>=60);
      log(ally?ally.name+' tipped you off: '+r.name+' is going after your clients.':'Word is '+r.name+' is going after your clients.','bad');}
  }
}

const _rivalFor23=rivalFor;
rivalFor=function(c){const mine=priceRatio(c);const w=r=>r.aggr*(r.price<mine?1.5:0.6)*(c.seats<=15?[2,1.5,0.6,0.2][r.tier]:[0.3,1,1.5,1.5][r.tier])*(1+hostility(r))*(agreed(r,'refer')?0.3:1);return wpick(rivals().map(r=>[r,w(r)]));};
const _rivalDaily23=rivalDaily;
rivalDaily=function(){_rivalDaily23();if(S.day%DPM===7&&rivals().some(r=>r.target>S.day)){const c=pick(active().filter(c=>c.notice==null&&!c.ending&&canLeave(c)));if(c&&Math.random()<0.5)_rivalDaily23();}};

const _poachCtx23=EVENTS.poach.ctx;
EVENTS.poach.ctx=function(){const x=_poachCtx23();const pool=rivals().filter(r=>!agreed(r,'nopoach')&&r.tier>=Math.max(1,sizeTier()));const r=pool.length?wpick(pool.map(z=>[z,1+hostility(z)+(z.pers==='predatory'?1:0)])):null;if(r)x.rid=r.id;return x;};
const _poachMake23=EVENTS.poach.make;

const _hire23=hire;
hire=function(c){const n=S.staff.length;_hire23(c);if(S.staff.length>n&&c.from){const r=rivalById(c.from);if(r){S.staff[S.staff.length-1].from=r.id;r.staff=Math.max(1,r.staff-1);r.intel=Math.max(r.intel||0,2);remember(r,'You hired '+c.name+' from them.');
  if(agreed(r,'nopoach')){shift(r,-30,-35);delete r.deals.nopoach;log('Hiring '+c.name+' broke your no-poaching agreement with '+r.name+'. They’re furious.','bad');}else shift(r,-4,0);}}};

/* a firm you hold a stake in is bought (you share the upside at its current value) or folds (you lose most of it) */
const _mm23=marketMonthly;
marketMonthly=function(){const before=rivals().filter(r=>r.stake).map(r=>({id:r.id,name:r.name,p:r.stake.p,v:stakePrice(r)}));_mm23();
  for(const b of before)if(!rivalById(b.id)){const g=(S.mkt.gone||[]).find(x=>x.id===b.id);
    if(g&&g.reason==='fold'){const back=Math.round(b.p*0.3);S.co.cash+=back;S.m.setup+=back;S.co.capYr=(S.co.capYr||0)+back;log(b.name+' has gone under. Your 20% stake returned only '+gbp(back)+' of the '+gbp(b.p)+' you put in.','bad');}
    else{const back=Math.max(b.p,Math.round(b.v));S.co.cash+=back;S.m.setup+=back;S.co.capYr=(S.co.capYr||0)+back;const gain=back-b.p;log(b.name+' has been acquired. Your 20% stake paid out '+gbp(back)+(gain>0?', a '+gbp(gain)+' gain on the '+gbp(b.p)+' you invested':'')+'.',gain>0?'good':'info');}}};
/* ---------- investments: your holdings, shown on the Money tab (public shares will slot in here later) ---------- */
function holdings(){const out=[];
  for(const r of rivals())if(r.stake)out.push({kind:'stake',rid:r.id,name:r.name,tier:MKT_TIERS[r.tier].t,paid:r.stake.p,value:stakePrice(r),monthly:Math.round(rSeats(r)*45*0.1*0.2)});
  return out;}
function investPerf(){const h=holdings();const value=h.reduce((a,x)=>a+x.value,0),paid=h.reduce((a,x)=>a+x.paid,0),mo=h.reduce((a,x)=>a+x.monthly,0);return {h,value,paid,mo,gain:value-paid,yield:value?mo*12/value:0};}

    '<div class="tile"><span class="k">Holdings</span><span class="v">'+P.h.length+'</span><small>firm'+(P.h.length===1?'':'s')+'</small></div></div>';
  h+='<h3 style="font-size:.95rem;margin:16px 0 6px">Your holdings</h3><div class="list">';
  for(const x of P.h){const r=rivalById(x.rid);if(!r)continue;const gain=x.value-x.paid,gcx=gain>=0?'pos':'neg';

      '<div class="row mut" style="justify-content:space-between;font-size:.82rem"><span>~'+r.clients+' clients · '+(typeof repWord==='function'?repWord(r.rep):Math.round(r.rep))+' · '+trend+'</span><span>'+gbp(x.monthly)+'/mo dividend · paid '+gbp(x.paid)+'</span></div>'+
      '<div class="row" style="justify-content:flex-end;gap:8px;margin-top:2px"><button class="btn sm" data-act="rivalCard" data-v="'+r.id+'">Their card</button><button class="btn sm danger" data-act="rEnd" data-v="'+r.id+':invest">Sell · '+gbp(x.value)+'</button></div>'+

  const pers=r.intel>=1||r.metAt?PERS[r.pers].t+'. '+PERS[r.pers].d:'You don’t know them well enough to say.';
  let rel='<h3 style="font-size:.95rem;margin:14px 0 4px">Relationship</h3><table><tbody><tr><td>Stance</td><td class="r"><b>'+stanceWord(r.stance)+'</b></td></tr><tr><td>Trust</td><td class="r">'+trustWord(r.trust)+'</td></tr><tr><td>Character</td><td class="r" style="text-align:right">'+pers+'</td></tr><tr><td>What you know</td><td class="r">'+intelWord(r.intel)+'</td></tr>'+(r.stake?'<tr><td>Your stake</td><td class="r">20%, worth about '+gbp(stakePrice(r))+'</td></tr>':'')+(r.target>S.day?'<tr><td class="neg">Going after your clients</td><td class="r neg">until '+dLabel(r.target)+'</td></tr>':'')+'</tbody></table>';
  const deals=Object.keys(r.deals||{}).concat(r.stake?['invest']:[]);

function brResold(b){return BR_RESOLD*(1-brSynergy());}
function brStaffPol(b){return b.staffPol==null?1:b.staffPol;}
function brSeats(b){return Math.round(b.clients*(b.seatsPer||BR_SEATS));}
function brMRR(b){const per=b.perClient||(BR_SEATS*refPrice('support')*1.9);return Math.round(b.clients*per*(b.price/(b.price0||0.98)));}
function brRent(b){return b.staff<=3?900:b.staff<=10?2400:b.staff<=24?5200:9500;}
function brCosts(b){return Math.round(brMRR(b)*brResold(b) + b.staff*BR_SAL*(1+ONCOST) + b.mgr.salary*(1+ONCOST) + brRent(b) + (b.invest?brMRR(b)*0.06:0) + BR_OVERSIGHT_COST[brOversightLvl()]);}
function brProfit(b){return brMRR(b)-brCosts(b);}
function brMargin(b){const m=brMRR(b);return m?brProfit(b)/m:0;}
/* a better manager runs the branch leaner for the same quality */
function brNeed(b){return Math.max(1,Math.round(brSeats(b)/(BR_TECH_PER*(0.85+0.06*((b.mgr&&b.mgr.skill)||3)))));}
function brQuality(b){const cap=clamp(b.staff/brNeed(b),0.3,1.4);return clamp(0.35+cap*0.4+((b.mgr&&b.mgr.skill)||3)*0.05+(b.invest?0.12:0)+brOversightQ()-Math.max(0,b.price-1)*0.35,0.1,1);}
/* one-line health read for the card and the tab alert */
function brHealth(b){const p=brProfit(b),q=brQuality(b),need=brNeed(b);
  if(b.mgr&&b.mgr.salary<marketBrMgr(b)*0.9)return {a:1,t:'Manager underpaid, may leave'};
  if(p<0)return {a:1,t:'Losing money'};
  if(b.staff<need*0.9&&q<0.6)return {a:1,t:'Understaffed, quality slipping'};
  if(b.clients>=(120+S.co.rep)*0.93)return {a:0,t:'Near local capacity'};
  if(p>0&&(b.grow||1)>1&&q>=0.6)return {a:0,t:'Well-run and growing'};
  if(q<0.55)return {a:1,t:'Quality is drifting'};
  return {a:0,t:'Ticking along'};}
function brAlerts(){return branches().filter(b=>brHealth(b).a).length;}
function brValue(b){const p=brProfit(b);return Math.max(0,Math.round(Math.max(brMRR(b)*12*0.7,p*12*4.5)/5000)*5000);}
function brName(rid){const r=rivalById(rid);return r?r.name:'A branch';}

function makeBranch(x,rid){const r=rivalById(rid);const clients=Math.max(1,x.cl.length);const seats=x.cl.reduce((a,c)=>a+c.seats,0)||clients*BR_SEATS;
  const perClient=(x.mrr&&clients)?x.mrr/clients:BR_SEATS*refPrice('support')*1.9;
  const need=Math.max(1,Math.round(seats/BR_TECH_PER*1.05));
  const b={id:uid(),name:x.name,rid,region:'home',clients,price:0.98,price0:0.98,perClient,seatsPer:seats/clients,
    mgr:{name:pick(FIRST)+' '+pick(LAST),skill:ri(2,4),salary:Math.round(rnd(3200,4200)/10)*10},
    staff:need,invest:false,grow:1,sat:60-Math.round((x.churn||10)/3),born:S.day,cash:0,hist:[]};
  branches().push(b);return b;}

/* monthly: the branch runs itself */
function branchesMonthly(){for(const b of branches().slice()){
  const need=brNeed(b),q=brQuality(b);
  b.sat=clamp(b.sat+(q*100-b.sat)*0.18,0,100);
  if(brOversightLvl())spend(BR_OVERSIGHT_COST[brOversightLvl()]);
  // an underpaid manager may leave; group oversight makes that far less likely
  const fair=marketBrMgr(b);if(b.mgr.salary<fair*0.9&&Math.random()<0.08*(1-brOversightRet())){log(b.name+'’s manager, '+b.mgr.name+', has left for a better offer. Appoint a new one on the Branches tab.','bad');b.mgr={name:pick(FIRST)+' '+pick(LAST),skill:ri(1,3),salary:fair,green:S.day};b.sat=Math.max(0,b.sat-8);}
  // clients churn (proportional) and win new business (absolute), so a small
  // branch actually grows into the local market rather than stalling near zero
  const churn=clamp(0.015+(60-b.sat)/60*0.06+Math.max(0,b.price-1)*0.12,0,0.16);
  const room=clamp(1-b.clients/(120+S.co.rep),0.05,1);
  const intake=Math.max(0,(b.invest?1.3:0.5)*(b.grow||1)*(0.4+q*0.6)*room*(0.7+clamp(S.co.rep,0,100)/200));
  let n=Math.max(0,b.clients*(1-churn)+intake);
  const ic=Math.floor(n)+(Math.random()<(n%1)?1:0);b.clients=Math.max(0,ic);
  // staffing follows the policy you set, and converges quickly so it stays responsive
  const want=Math.max(1,Math.round(need*BR_STAFFPOL[brStaffPol(b)]));
  const step=Math.max(1,Math.ceil(Math.abs(want-b.staff)*0.34));
  if(b.staff<want&&brProfit(b)>-b.staff*2500)b.staff=Math.min(want,b.staff+step);
  else if(b.staff>want)b.staff=Math.max(want,b.staff-step);
  // the money flows to you
  const p=brProfit(b);S.co.cash+=p;S.m.branch=(S.m.branch||0)+p;
  b.lastP=p;(b.hist=b.hist||[]).push(Math.round(b.clients));if(b.hist.length>12)b.hist.shift();
  if(b.clients<1){log(b.name+' has withered away to nothing and closed. A branch needs looking after.','bad');branches().splice(branches().indexOf(b),1);x19('branchLost');}
}}
function marketBrMgr(b){return Math.round((3000+brSeats(b)*0.4)/10)*10;}

/* assign rivals to regions: mostly home and neighbours, a spread elsewhere */
function seedRegions(){
  const baseW=k=>(typeof regBase==='function'?regBase(k):reg(k).size*2000);
  for(const r of rivals())if(!r.region){
    r.region=wpick(REG_ORDER.map(k=>[k,baseW(k)*(k==='home'?1.15:1)]));}
  // every region should be contested in proportion to its SME base: redistribute to a base-scaled minimum
  const target=k=>Math.max(1,Math.round(baseW(k)/1000));
  for(let pass=0;pass<60;pass++){
    const under=REG_ORDER.filter(k=>regRivals(k).length<target(k));if(!under.length)break;
    const k=under[0];
    const over=REG_ORDER.filter(x=>x!==k&&regRivals(x).length>target(x)).sort((a,b)=>regRivals(b).length-regRivals(a).length)[0];
    if(!over)break;regRivals(over)[0].region=k;}
  // the biggest markets should have a mid or national of note
  for(const k of ['se','north']){if(!regRivals(k).some(r=>r.tier>=2)){
    const donor=rivals().filter(r=>r.tier>=2&&r.region!==k).sort((a,b)=>regRivals(b.region).length-regRivals(a.region).length)[0];
    if(donor)donor.region=k;}}
}

/* ============ build 30: a business partner ============ */
/* A co-owner who draws what you draw, rides out lean months if morale is high,
   votes on the big calls, gives advice (good or bad), and takes their share of
   the winnings. Great in the valley (cash and shared burn), a cost in control. */
const PCHAR={
  cautious:{t:'Cautious',d:'Hates debt and big bets, likes steady, profitable growth.',adv:'safe'},
  aggressive:{t:'Aggressive',d:'Pushes to expand, acquire and take risks. Restless when you sit still.',adv:'bold'},
  people:{t:'People-first',d:'Cares about the team and clients. Hates firing, underpaying and dirty tricks.',adv:'people'}

const PFIRST=['Sam','Priya','Tom','Nadia','Chris','Aisha','Dan','Lena','Raj','Ellie'];
function partner(){return S.partner;}
function pEquity(){return partner()?partner().equity:0;}
function pDraw(){const f=founderSt();return f?(f.salary||0):0;}
function partnerCands(){if(S.pCands)return S.pCands;const out=[];const chars=['cautious','aggressive','people'].sort(()=>Math.random()-0.5);
  for(let i=0;i<3;i++){const eq=[0.2,0.3,0.35][i];const cash=Math.round((10000+eq*80000)*(0.8+S.co.rep/200)/1000)*1000;
    out.push({name:pick(PFIRST)+' '+pick(LAST),char:chars[i],equity:eq,cashIn:cash});}
  S.pCands=out;return out;}
ACT_EXT.takePartner=i=>{const c=partnerCands()[+i];if(!c||partner())return;
  S.partner={name:c.name,char:c.char,equity:c.equity,morale:75,joined:S.day,pocket:0,forgone:0,voteFails:0};
  S.co.cash+=c.cashIn;S.m.setup=(S.m.setup||0)+c.cashIn;S.pCands=null;
  log(c.name+' has joined as your business partner, putting in '+gbp(c.cashIn)+' for '+pct(c.equity)+' of the company. They draw what you draw and get a say in the big calls.','event');ui.modal=null;};

/* their pay: they match your draw, but forgo it when cash is tight and they still believe */
function partnerDaily(){const p=partner();if(!p)return;
  if(S.day%DPM!==0)return;
  const draw=pDraw();const tight=S.co.cash<burn()*1.5||companyPL().op<0;
  if(draw>0){if(tight&&p.morale>=55){p.forgone=(p.forgone||0)+draw;}else{S.co.cash-=draw*(1+ONCOST);S.m.sal=(S.m.sal||0)+draw*(1+ONCOST);}}
  // morale: fed by being paid and by the business doing well; drained by lean months and being overruled
  const grow=S.hist.length>=4&&mrr()>S.hist[S.hist.length-4].mrr;
  let t=60+(grow?15:-5)+(companyPL().op>0?10:-10)+(draw>0&&!tight?10:0)-(p.forgone>draw*3?15:0);
  if(p.char==='people'&&(founderSt()&&founderSt().morale<50))t-=10;
  p.morale=clamp(p.morale+(t-p.morale)*0.15,0,100);
  if(p.morale<20&&!p.leaving){p.leaving=S.day;S.hq.push({id:'partnerOut',ctx:{}});}
}

/* monthly tool risks */
function toolsMonthly(){
  for(const c in TEAMTOOLS){const p=ttProd(c);if(!p)continue;const insec=1-p.sec;
    if(Math.random()<insec*0.02*(S.diff==='hard'?1.4:1)){toolLeak(c);continue;}
    if(Math.random()<insec*0.012){toolVendorBust(c);continue;}
    if(Math.random()<insec*0.03){toolOutage(c);}
  }
}
function toolLeak(c){const T=TEAMTOOLS[c];
  if(regulated&&regulated()){S.hq.push({id:'toolLeak',ctx:{c}});}
  else{const n=Math.max(1,Math.round(active().length*0.05));for(const cl of active().slice().sort(()=>Math.random()-0.5).slice(0,n))cl.sat=Math.max(0,cl.sat-rnd(4,10));S.co.rep=Math.max(5,S.co.rep-rnd(2,5));
    log('A data leak through your '+T.t.toLowerCase()+' exposed some client details. Cheap software, real cost.','bad');x19('toolLeak');}
}
HUMAN.toolLeak={w:0,ok:()=>false,make:x=>{const T=TEAMTOOLS[x.c];const fine=Math.round(clamp(mrr()*12*0.02,10000,200000)*(insCover&&insCover()?0.3:1)/1000)*1000;const safe=(TT_SHOP[x.c]||[]).slice().sort((a,b)=>b.sec-a.sec)[0];
  return {kicker:'Data protection',title:'Your '+T.t.toLowerCase()+' has leaked client data',body:'The '+T.t.toLowerCase()+' you run was breached and client data is out. As a regulated MSP this is reportable.',
    choices:[{label:'Report it and move to a secure product',note:'Fine of about '+gbp(fine)+', and you switch to '+(safe?safe.name:'a certified tier')+'.',go(){spend(fine);if(safe){S.tt[x.c]=safe.id;S.ttC=S.ttC||{};S.ttC[x.c]={since:S.day,term:safe.term,price:ttPrice(x.c,safe.id)};}S.co.rep=Math.max(5,S.co.rep-4);log('You reported the '+T.t.toLowerCase()+' leak ('+gbp(fine)+') and moved to '+(safe?safe.name:'a secure product')+'.','bad');}},
      {label:'Keep it quiet',note:'Cheaper now. Far worse if it surfaces.',go(){if(typeof addHeat==='function')addHeat(15,'Hid a data leak',1);S.co.rep=Math.max(5,S.co.rep-2);log('You’re keeping the '+T.t.toLowerCase()+' leak quiet.','bad');}}]};}};
function toolVendorBust(c){const T=TEAMTOOLS[c];const cost=Math.round(ttCost(c)*3/100)*100;spend(cost);const gone=ttProd(c);
  log((gone?gone.name:T.t)+' '+pick(['has gone under','was acquired and shut down','folded overnight'])+'. Migrating to a replacement cost '+gbp(cost)+' and some disruption. Pick a new '+T.t.toLowerCase()+'.','event');
  delete S.tt[c];if(S.ttC)delete S.ttC[c];   // you must re-choose from the catalogue
  if(hasRole('eng'))bigTickets(null,3,4,2,'Internal: migrating off '+(gone?gone.name:T.t));x19('toolBust');}
function toolOutage(c){const T=TEAMTOOLS[c];S.tt2=S.tt2||{};S.tt2[c]=S.day+ri(1,4);
  if(c==='portal'||c==='billing'){for(const cl of active().slice().sort(()=>Math.random()-0.5).slice(0,Math.ceil(active().length*0.15)))cl.sat=Math.max(0,cl.sat-rnd(2,5));}
  const nm=(ttProd(c)||{}).name||T.t;log(nm+' went down for a bit'+((c==='portal'||c==='billing')?', and clients noticed':'')+'. Cheaper tools wobble more.','bad');x19('toolOutage');}

    {label:'Do the bare minimum',note:'Faster now, a risk if it’s ever challenged.',go(){if(typeof addHeat==='function')addHeat(4,'Cut corners on a data request');log('You did the minimum on the data request. Hopefully nobody checks.','info');}}]};}};

/* ============ build 41: the C-suite ============ */
/* A strategic leadership layer above the operational managers. Executives are
   expensive senior hires that each take a domain off your plate and steer it.
   Every exec has a personality (an archetype that colours their strengths and
   advice) and a focus you set (their mandate). Effect = quality × how well the
   focus fits their archetype. They're a money sink and a lever at scale. */
const EXEC_ROLE={
  cto:{t:'CTO',full:'Chief Technology Officer',sal:[7000,11000],col:'--r-eng',
    d:'Owns technology strategy above the Technical Manager. Where the stack, security and bespoke builds are heading.',
    focuses:[
      {k:'secure',t:'Security & resilience',d:'Cuts breach risk and audit pain.'},
      {k:'build',t:'Build & innovation',d:'Bespoke DevOps builds are cheaper, faster and far less likely to fail.'},
      {k:'lean',t:'Lean stack',d:'Trims tool spend and keeps the stack tight.'}
    ]},
  cfo:{t:'CFO',full:'Chief Financial Officer',sal:[7000,11000],col:'--r-am',
    d:'Owns the money above the billing function: collections, capital and cost.',
    focuses:[
      {k:'cash',t:'Cash & collections',d:'Better billing coverage and less bad debt.'},
      {k:'cost',t:'Cost control',d:'Trims tool and overhead spend.'},
      {k:'growth',t:'Growth capital',d:'More borrowing headroom and cheaper finance.'}
    ]},
  coo:{t:'COO',full:'Chief Operating Officer',sal:[6500,10500],col:'--r-sdm',
    d:'Owns day-to-day operations across the managers: throughput, quality and scale.',
    focuses:[
      {k:'efficient',t:'Efficiency',d:'More throughput from the same team.'},
      {k:'quality',t:'Service quality',d:'Happier clients and a better reputation.'},
      {k:'scale',t:'Scaling up',d:'Sharper managers and stronger branches.'}
    ]}
};
const EXEC_ORDER=['cto','cfo','coo'];
const ECHAR={
  visionary:{t:'Visionary',d:'Bold and ambitious. Bigger swings, more volatility.',lean:['build','growth','scale']},
  operator:{t:'Operator',d:'Steady and reliable. Consistent, lower-risk gains.',lean:['secure','cash','quality','efficient']},
  maverick:{t:'Maverick',d:'Unconventional. Occasional brilliance, occasional trouble.',lean:['build','growth','efficient']},
  veteran:{t:'Veteran',d:'Seen it all before. Dependable, and knows where the money goes.',lean:['secure','cost','quality']}
};
const EFIRST=['Morgan','Priya','Sundeep','Claire','Marcus','Yuki','Ade','Fiona','Rob','Nadia','Grace','Tomas','Ivy','Deepa','Karl'];
function exec(r){return S.execs&&S.execs[r];}
function execAny(){return S.execs&&Object.keys(S.execs).length>0;}
function execPayroll(){if(!S.execs)return 0;let t=0;for(const r in S.execs)t+=(S.execs[r].sal||0);return t*(1+ONCOST);}
/* how strongly an exec drives a given focus: only if that's their current mandate */
function execFocusPow(r,f){const e=exec(r);if(!e||e.focus!==f)return 0;const fit=(ECHAR[e.char]&&ECHAR[e.char].lean.includes(f))?1.2:0.9;return (e.quality||0.8)*fit;}
function execPow(r){const e=exec(r);if(!e)return 0;return e.quality||0.8;}

/* ---- candidates and hiring ---- */
function execCands(r){S.execCands=S.execCands||{};if(S.execCands[r])return S.execCands[r];
  const chars=Object.keys(ECHAR).sort(()=>Math.random()-0.5);const R=EXEC_ROLE[r];const out=[];
  for(let i=0;i<3;i++){const q=Math.round((0.65+Math.random()*0.33)*100)/100;const sal=Math.round((R.sal[0]+(R.sal[1]-R.sal[0])*q)/500)*500;
    out.push({name:pick(EFIRST)+' '+pick(LAST),char:chars[i%chars.length],quality:q,sal,focus:R.focuses[0].k});}
  S.execCands[r]=out;return out;}
ACT_EXT.execHire=v=>{const [r,i]=v.split(':');const R=EXEC_ROLE[r];if(!R||exec(r))return;const c=execCands(r)[+i];if(!c)return;
  S.execs=S.execs||{};S.execs[r]={name:c.name,char:c.char,quality:c.quality,sal:c.sal,focus:c.focus,joined:S.day};
  if(S.execCands)delete S.execCands[r];
  log(c.name+' has joined as your '+R.full+' ('+ECHAR[c.char].t.toLowerCase()+'), on '+gbp(c.sal)+' a month. Set their focus on the Strategy tab.','event');};
ACT_EXT.execFocus=v=>{const [r,f]=v.split(':');const e=exec(r);const R=EXEC_ROLE[r];if(!e||!R||!R.focuses.some(x=>x.k===f))return;e.focus=f;
  log('Your '+R.t+' is now focused on '+R.focuses.find(x=>x.k===f).t.toLowerCase()+'.','info');};
ACT_EXT.execFire=r=>{const e=exec(r);const R=EXEC_ROLE[r];if(!e)return;delete S.execs[r];log('You let '+e.name+' go as '+R.t+'.','event');};

/* ---- effects, all modest and scaled by focus power ---- */
function buildFailMod(){return 1-0.5*execFocusPow('cto','build');}
/* CTO security: fewer breaches, better audits */
if(typeof breachOdds==='function'){const _bo_x=breachOdds;breachOdds=function(){return _bo_x()*(1-0.30*execFocusPow('cto','secure'));};}
if(typeof procScore==='function'){const _ps_x=procScore;procScore=function(a){return _ps_x(a)+0.30*execFocusPow('cto','secure');};}
/* CTO build: bespoke builds complete faster */
if(ACT_EXT.buildGo){const _bg_x=ACT_EXT.buildGo;ACT_EXT.buildGo=k=>{_bg_x(k);const b=(typeof build==='function')?build(k):null;if(b&&!b.live&&!b.failed){const cut=0.25*execFocusPow('cto','build');if(cut)b.need*=(1-cut);}};}
/* CTO lean + CFO cost: cheaper tools */
if(typeof toolsCost==='function'){const _tc_x=toolsCost;toolsCost=function(){return _tc_x()*(1-0.12*execFocusPow('cto','lean')-0.10*execFocusPow('cfo','cost'));};}
if(typeof ttMonthly==='function'){const _tm_x=ttMonthly;ttMonthly=function(){return _tm_x()*(1-0.12*execFocusPow('cto','lean')-0.10*execFocusPow('cfo','cost'));};}
/* CFO growth: more borrowing headroom */
if(typeof loanLimit==='function'){const _ll_x=loanLimit;loanLimit=function(){return Math.round(_ll_x()*(1+0.25*execFocusPow('cfo','growth'))/5000)*5000;};}
/* COO efficiency: a little more throughput */
if(typeof speedOf==='function'){const _so_x=speedOf;speedOf=function(st){return _so_x(st)*(1+0.06*execFocusPow('coo','efficient'));};}
/* executive pay in the P&L and out of the bank */
if(typeof companyPL==='function'){const _pl_x=companyPL;companyPL=function(){const P=_pl_x();const ex=execPayroll();if(ex){P.people+=ex;P.over+=ex;P.op-=ex;P.opct=P.rev?P.over/P.rev:0;P.oppct=P.rev?P.op/P.rev:0;}
  // CFO growth also shaves finance costs
  const g=execFocusPow('cfo','growth');if(g&&P.fin){const cut=Math.round(P.fin*0.25*g);P.fin-=cut;P.over-=cut;P.op+=cut;P.oppct=P.rev?P.op/P.rev:0;}
  return P;};}

/* daily: pay them, and run the periodic COO quality lift and exec advice */
if(typeof peopleDaily==='function'){const _pd_x=peopleDaily;peopleDaily=function(W){_pd_x(W);
  const ex=execPayroll();if(ex)spend(ex/DPM);
  if(S.day%DPM===13)cooQuality();
  execAdvice();
};}
function cooQuality(){const pow=execFocusPow('coo','quality');if(!pow)return;
  let n=0;for(const c of active())if(c.sat<70){c.sat=Math.min(100,c.sat+rnd(1,4)*pow);n++;}
  if(S.co)S.co.rep=Math.min(100,(S.co.rep||0)+1.2*pow);
}
/* COO scale: stronger branches */
if(typeof branchesMonthly==='function'){const _bm_x=branchesMonthly;branchesMonthly=function(){const before=S.co.cash;_bm_x();const pow=execFocusPow('coo','scale');if(pow&&typeof branches==='function'){/* nudge: a small uplift on branch contribution */const up=Math.round((S.co.cash-before)*0.12*pow);if(up>0){S.co.cash+=up;S.m.rec=(S.m.rec||0)+up;}}};}
function execAdvice(){if(!execAny()||S.day%DPM!==17||Math.random()>0.4)return;
  const r=pick(EXEC_ORDER.filter(x=>exec(x)));const e=exec(r);const R=EXEC_ROLE[r];const good=Math.random()<(0.4+0.4*(e.quality||0.7));
  let m='';
  if(good){
    if(r==='cto'){if(breachOdds()*12>0.2)m='“Our breach exposure is creeping up. We should harden the estate.”';else if(toolCertGap&&toolCertGap()>0)m='“Some of our tooling won’t survive an audit. Worth fixing before a client asks.”';else m='“The stack’s in good shape. Now’s the time to build something of our own.”';}
    if(r==='cfo'){if(companyPL().op<0)m='“We’re running at a loss. I’d tighten spend before we borrow more.”';else if(typeof billCoverage==='function'&&billCoverage()<0.7)m='“We’re leaking revenue on billing. It’ll pay for itself to fix.”';else m='“Balance sheet’s healthy. We could afford a bigger move.”';}
    if(r==='coo'){if(typeof slaPct==='function'&&slaPct()<0.85)m='“SLA’s slipping. The desk needs either hands or better tools.”';else m='“Operations are steady. We can take on more without it wobbling.”';}
  }else{
    m=e.char==='visionary'?'“We should bet big, now, while we can.”':e.char==='maverick'?'“Trust me, let’s do the unconventional thing.”':e.char==='veteran'?'“In my day we’d have sat tight and waited.”':'“Let’s just keep doing what we’re doing.”';
  }
  if(m)log(e.name+' ('+R.t+'): '+m,'info');
}

/* ---- the Leadership section on the Strategy tab ---- */
function execEffectLine(r){const e=exec(r);if(!e)return '';const f=EXEC_ROLE[r].focuses.find(x=>x.k===e.focus);const pow=execFocusPow(r,e.focus);
  const fit=(ECHAR[e.char]&&ECHAR[e.char].lean.includes(e.focus));
  return (f?f.d:'')+' <span class="mut">'+(fit?'Plays to their strengths.':'Not their strong suit.')+' Effectiveness '+pct(Math.min(1,pow))+'.</span>';}
function leadershipSec(){
  let h='<div class="sec"><h3>Leadership</h3><p class="lede">Your C-suite: expensive senior hires who each own a domain and steer it. Every executive has a personality that colours their strengths, and a focus you set. Effect depends on how good they are and whether the focus suits them.</p><ul class="list">';
  for(const r of EXEC_ORDER){const R=EXEC_ROLE[r];const e=exec(r);
    if(e){h+='<li class="item"><span>'+roleDot('founder')+'<b>'+esc(e.name)+'</b> <span class="mut">'+R.t+' · '+ECHAR[e.char].t.toLowerCase()+'</span></span><span class="r">'+gbp(e.sal)+'/mo</span><span class="sub">'+execEffectLine(r)+
      '<span class="row" style="margin-top:6px">'+R.focuses.map(f=>'<button class="btn sm" data-act="execFocus" data-v="'+r+':'+f.k+'" aria-pressed="'+(e.focus===f.k)+'">'+f.t+'</button>').join('')+'</span>'+
      '<span class="row" style="margin-top:4px"><button class="btn sm danger" data-act="execFire" data-v="'+r+'">Let them go</button></span></span></li>';}
    else{const cs=execCands(r);
      h+='<li class="item"><span><b>'+R.full+'</b> <span class="mut">vacant</span></span><span class="r mut">'+gbp(R.sal[0])+'–'+gbp(R.sal[1])+'/mo</span><span class="sub">'+esc(R.d)+'<span class="row" style="margin-top:6px">'+cs.map((c,i)=>'<button class="btn sm" data-act="execHire" data-v="'+r+':'+i+'">'+esc(c.name.split(' ')[0])+' · '+ECHAR[c.char].t.toLowerCase()+' · '+gbp(c.sal)+'</button>').join('')+'</span><span class="mut" style="display:block;font-size:.76rem;margin-top:4px">Better candidates cost more. Set their focus once they start.</span></span></li>';}
  }
  h+='</ul></div>';
