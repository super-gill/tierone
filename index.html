/* ============ build 81: the floor maps to teams ============
   In the bigger offices, staff sit with their team, in tinted labelled zones
   that grow and shrink as you hire and lose people. Same-role people always
   pack together now; the coloured zones only draw once you’ve got room. */

const FLOOR_TEAMS=[
  {k:'lead', t:'Leadership',      roles:['founder'],            col:'--r-founder'},
  {k:'desk', t:'Service desk',    roles:['desk','hdm'],         col:'--r-desk'},
  {k:'eng',  t:'Engineering',     roles:['eng','tm','pm'],      col:'--r-eng'},
  {k:'sales',t:'Sales & accounts',roles:['am','sm','sdm'],      col:'--r-am'},
  {k:'ops',  t:'Back office',     roles:['bill','bm'],          col:'--r-sm'}
];
const ZONE_MIN_TIER=3;   // Office floor and up: enough room for zones to read
function teamRank(role){for(let i=0;i<FLOOR_TEAMS.length;i++)if(FLOOR_TEAMS[i].roles.includes(role))return i;return FLOOR_TEAMS.length;}
function teamOfRole(role){for(const t of FLOOR_TEAMS)if(t.roles.includes(role))return t;return FLOOR_TEAMS[FLOOR_TEAMS.length-1];}

/* seat people with their team: sort by team, then role, then seniority, and pack into desks in that order */
reassignDesks=function(){
  const list=S.staff.filter(s=>!s.left);
  list.sort((a,b)=>{const ta=teamRank(a.role),tb=teamRank(b.role);if(ta!==tb)return ta-tb;
    if(a.role!==b.role)return a.role<b.role?-1:1;return (a.start||0)-(b.start||0);});
  list.forEach((s,i)=>s.desk=i);
};

/* re-pack automatically whenever the roster or role mix changes, so zones shift as staff come and go */
if(typeof syncActors==='function'){const _sync=syncActors;syncActors=function(){
  try{const on=S.staff.filter(s=>!s.left);const sig=on.length+':'+on.map(s=>s.role).sort().join(',');
    if(sig!==V._floorSig){V._floorSig=sig;reassignDesks();}}catch(e){}
  return _sync.apply(this,arguments);};}

function floorZonesOn(){return V.L&&V.L.tier>=ZONE_MIN_TIER;}
function drawZones(c,now){
  if(!floorZonesOn())return;
  const L=V.L,T=V.T,K=V.col;
  const byDesk={};for(const s of S.staff)if(!s.left&&s.desk!=null)byDesk[s.desk]=s;
  // bucket occupied desks by team
  const teams={};
  L.desks.forEach((d,i)=>{const s=byDesk[i];if(!s)return;const tm=teamOfRole(s.role);const e=teams[tm.k]||(teams[tm.k]={team:tm,cells:[]});e.cells.push(d);});
  for(const k in teams){const e=teams[k];if(e.cells.length<2)continue;const col=K[e.team.col.replace('--','')]||K.p;
    // group by row, then split each row into contiguous runs of desks
    const byRow={};for(const d of e.cells){const y=Math.round(d.y*10)/10;(byRow[y]=byRow[y]||[]).push(d);}
    const ys=Object.keys(byRow).map(Number).sort((a,b)=>a-b);let labelled=false;
    for(const y of ys){const ds=byRow[y].sort((a,b)=>a.x-b.x);
      let run=[ds[0]];const runs=[];
      for(let m=1;m<ds.length;m++){if(ds[m].x-run[run.length-1].x<=2.2+0.01)run.push(ds[m]);else{runs.push(run);run=[ds[m]];}}
      runs.push(run);
      for(const rn of runs){const x0=rn[0].x-0.35,x1=rn[rn.length-1].x+rn[0].w+0.35,yy=y-0.4,hh=2.05;
        c.save();c.globalAlpha=0.12;c.fillStyle=col;rr(c,X(x0),Y(yy),(x1-x0)*T,hh*T,0.45*T);c.fill();
        c.globalAlpha=0.45;c.strokeStyle=col;c.lineWidth=1.4;rr(c,X(x0),Y(yy),(x1-x0)*T,hh*T,0.45*T);c.stroke();c.restore();
        if(!labelled){labelled=true;c.save();c.globalAlpha=0.92;c.fillStyle=col;c.font='700 '+Math.max(8,T*0.34)+'px '+K.display;
          c.fillText(e.team.t.toUpperCase()+' · '+e.cells.length,X(x0+0.05),Y(yy-0.12));c.restore();}
      }
    }
  }
}

/* ============ build 82: group MRR + recurring investment income ============
   MRR was head-office client revenue only. Branch (and later subsidiary)
   revenue is operating recurring revenue too, so the valuation, the loan, the
   board's expectation and tender turnover now read "group MRR". Investment
   dividends and savings interest are recurring but non-operating, so they get
   their own line and stay out of the MRR that drives the valuation multiple. */

/* recurring revenue from branches (gross, at their run rate) */
function branchMRR(){let t=0;if(typeof branches==='function')for(const b of branches())t+=(typeof brMRR==='function'?brMRR(b):0);return Math.round(t);}
/* the whole operating company: head office plus branches (subsidiaries slot in here later) */
function groupMRR(){return mrr()+branchMRR();}
/* current monthly run rate of recurring investment income: stake dividends, share dividends, savings interest */
function investIncomeM(){
  let t=0;
  if(typeof rivals==='function')for(const r of rivals())if(r.stake)t+=Math.round(rSeats(r)*45*0.1*0.2);
  const sh=(S.co&&S.co.shares)||{};
  for(const rid in sh){const r=(typeof rivalById==='function')&&rivalById(rid);if(r&&typeof sharePx==='function')t+=Math.round(sh[rid].units*sharePx(r)*0.0022);}
  if(S.co&&S.co.savings>0&&!S.co.savingsCompound&&typeof SAVE_APR!=='undefined')t+=Math.round(S.co.savings*SAVE_APR/12);
  return t;
}

/* ============ build 84: operating stance + people care (delegation foundation) ============
   The first brick of the delegation layer. You set an operating stance (the
   direction your managers and execs run to), and every managed team is actually
   looked after: its people's morale is tended toward a decent floor by their
   manager (or the COO). Unmanaged teams stay your job. Right-sizing, considered
   pay and departmental budgets build on this next. */

const STANCE={
  grow:{t:'Grow',d:'Hire ahead of demand and push for scale. Costs run hotter.',hire:1.12,care:1.0},
  steady:{t:'Steady',d:'Keep pace with demand, balanced on cost and growth.',hire:1.0,care:1.0},
  efficiency:{t:'Efficiency',d:'Run lean and sweat the team. Cheaper, but harder on morale.',hire:0.85,care:0.8}
};
function stance(){return (S.co&&STANCE[S.co.stance])?S.co.stance:'steady';}
ACT_EXT.stanceSet=v=>{if(STANCE[v]&&S.co){S.co.stance=v;log('Operating stance set to '+STANCE[v].t.toLowerCase()+'. Your managers and execs run to it.','event');}};

/* stance biases how eagerly the team hires: grow hires ahead of demand, efficiency waits */
if(typeof teamNeed==='function'){const _tn=teamNeed;teamNeed=function(){const N=_tn.apply(this,arguments);if(!N)return N;const h=STANCE[stance()].hire;if(h!==1){if(N.desk!=null)N.desk*=h;if(N.eng!=null)N.eng*=h;}return N;};}

/* which manager looks after a given team's people, with the COO as a company-wide backstop */
function teamManager(role){
  const map={desk:'hdm',am:'sm',sdm:'sm',bill:'bm'};
  const mk=map[role];
  if(mk&&typeof mgrOn==='function'){const m=mgrOn(mk);if(m)return m;}
  if(typeof exec==='function'&&exec('coo'))return {coo:true,skill:4,name:exec('coo').name};
  return null;
}
/* a managed team's people are looked after: morale held toward a floor set by the manager,
   softened under an Efficiency stance. Unmanaged teams get nothing here — that's the player's job. */
function peopleCareDaily(){
  const care=STANCE[stance()].care;
  for(const s of S.staff){
    if(s.id==='you'||s.left||!present(s)||s.role==='founder')continue;
    if(s.role==='eng')continue;                 // engineers are tended by the Technical Manager
    const m=teamManager(s.role);if(!m)continue;
    const skill=m.skill||3;
    const floor=Math.min(74,54+skill*4)*care;
    // a manager actively holds their people up: a proportional daily pull toward a decent floor
    if(s.morale<floor)s.morale=Math.min(floor,s.morale+(floor-s.morale)*(0.02+0.006*skill)*care);
  }
}
if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);try{peopleCareDaily();}catch(e){}};}

/* the Direction (operating stance) control, at the top of the Strategy tab */
function stanceSec(){
  const cur=stance();const mgrs=(typeof mgrOn==='function')?['hdm','sm','tm','sdm','bm','pm'].filter(k=>mgrOn(k)).length:0;
  const coo=(typeof exec==='function')&&exec('coo');
  let h='<div class="sec"><h3>Direction</h3><p class="lede">Set the operating stance your managers and executives run to. It steers how hard they hire and how they look after the team, and it will drive budgets and right-sizing as we build those out. You can always take any decision back by hand.</p><div class="seg">'+
    Object.keys(STANCE).map(k=>'<button data-act="stanceSet" data-v="'+k+'" aria-pressed="'+(cur===k)+'">'+STANCE[k].t+'</button>').join('')+'</div>'+
    '<p class="mut" style="font-size:.8rem;margin-top:6px">'+esc(STANCE[cur].d)+'</p>'+
    '<p class="mut" style="font-size:.8rem;margin-top:4px">Running it: '+(coo?'your COO, across '+mgrs+' manager'+(mgrs===1?'':'s'):mgrs?mgrs+' manager'+(mgrs===1?'':'s')+' — teams without one are yours to run':'you, hands-on — hire managers to hand teams over')+'.</p></div>';
  return h;
}
if(typeof paneStrategy==='function'){const _ps=paneStrategy;paneStrategy=function(){return stanceSec()+_ps.apply(this,arguments);};}

/* ============ build 85: stance-driven right-sizing (trim & shrinkage) ============
   Teams no longer just grow and go stale. Under the operating stance, a managed
   team that's carrying more people than the work needs gets trimmed: attrition
   first (the hire logic already declines to backfill under a lean stance), then a
   managed redundancy when it's genuinely overstaffed. Grow never trims; Steady
   only when clearly over; Efficiency keeps the team tight. Redundancies cost
   severance and dent morale and reputation, so it's a real decision. */

function teamTargetCount(role){
  if(role==='am'){const a=S.staff.filter(s=>s.role==='am'&&!s.left);const capAvg=a.length?a.reduce((x,s)=>x+((typeof amCap==='function')?amCap(s):14),0)/a.length:14;return active().length/Math.max(1,capAvg);}
  const N=(typeof teamNeed==='function')?teamNeed():null;if(!N)return null;
  if(role==='desk')return N.desk;if(role==='eng')return N.eng;return null;
}
function rightSizeMonthly(){
  if(S.day%DPM!==11)return;                     // once a month
  const st=(typeof stance==='function')?stance():'steady';
  if(st!=='efficiency')return;                  // only an Efficiency stance actively makes redundancies; Grow and Steady rely on attrition
  S.co.rsAt=S.co.rsAt||{};S.noHire=S.noHire||{};
  for(const role of ['desk','eng','am']){
    const mgr=(typeof teamManager==='function')?teamManager(role):null;if(!mgr)continue;   // unmanaged: player's call
    const tgt=teamTargetCount(role);if(tgt==null)continue;
    const team=S.staff.filter(s=>s.role===role&&present(s));const n=team.length;
    if(n<=1)continue;                            // never cut a team to nothing here
    if(S.day-(S.co.rsAt[role]||-999)<DPM*2)continue;   // cooldown, no thrash
    if(S.noHire[role]>S.day)continue;            // already trimmed this role recently, let it settle
    const leaving=team.filter(s=>s.leaveOn!=null).length;
    const trimPool=team.filter(s=>s.leaveOn==null);if(!trimPool.length)continue;
    // attrition first: only make a redundancy if the team is over target even after those already leaving
    const over=(n-leaving)-(tgt+0.4);
    if(over<=0.4)continue;
    // let the weakest go: those on a performance process first, then lowest skill, then least busy
    const cand=trimPool.slice().sort((a,b)=>((a.proc?0:1)-(b.proc?0:1))||((a.skill||0)-(b.skill||0))||((a.util||0)-(b.util||0)))[0];
    if(!cand||cand.id==='you')continue;
    const sev=Math.round(cand.salary);
    cand.leaveOn=S.day+7;cand.why='redundancy';cand.redundant=true;
    S.co.cash-=sev;S.m.other=(S.m.other||0)+sev;S.co.rsAt[role]=S.day;S.noHire[role]=S.day+DPM*3;
    for(const s of team)if(s.id!==cand.id)s.morale=Math.max(0,s.morale-4);   // the team feels it
    S.co.rep=Math.max(0,(S.co.rep||50)-0.5);(S.exits=S.exits||[]).push(S.day);
    const who=mgr.coo?'Your COO':(mgr.name||'Your manager');
    log(who+' made '+cand.name+' redundant — the '+(ROLES[role]?ROLES[role].short.toLowerCase():role)+' team is carrying more than the work needs. '+gbp(sev)+' severance.','event');
  }
}
if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);try{rightSizeMonthly();}catch(e){}};}

/* ============ build 86: considered pay ============
   Managed teams keep their people's pay near the market rate, so it stops
   quietly falling behind and driving resignations. But it's a considered call,
   not a blanket rise: only underpaid people, never above market, capped per
   step, gated by the stance and whether the company can afford it. Grow pays up
   to retain talent; Steady holds pay at market; Efficiency freezes it and only
   fixes pay severe enough to lose someone. Unmanaged teams stay the player's job. */

/* who looks after a person's pay: their line manager, or the COO as backstop */
function payMgr(role){
  const map={desk:'hdm',eng:'tm',am:'sm',sdm:'sm',bill:'bm',pm:'tm'};
  const mk=map[role];
  if(mk&&typeof mgrOn==='function'&&mgrOn(mk))return mgrOn(mk);
  if(typeof exec==='function'&&exec('coo'))return {coo:true,name:exec('coo').name};
  return null;
}
function payManagedMonthly(){
  if(S.day%DPM!==17)return;                       // once a month, its own day
  const st=(typeof stance==='function')?stance():'steady';
  const P=(typeof companyPL==='function')?companyPL():{op:0};
  const profitable=(P.op||0)>0;
  const cfg=({grow:{trig:0.99,to:1.0,needProfit:false},steady:{trig:0.96,to:0.99,needProfit:false},efficiency:{trig:0.9,to:0.95,needProfit:true}})[st];
  for(const s of S.staff){
    if(s.id==='you'||s.left||!present(s)||s.role==='founder')continue;
    const m=payMgr(s.role);if(!m)continue;         // unmanaged: player's call
    if((s.raise||-999)+DPM*6>S.day)continue;       // not too often per person
    const mkt=(typeof marketPay==='function')?marketPay(s):s.salary;if(!mkt||mkt<=0)continue;
    const ratio=s.salary/mkt;
    if(ratio>=cfg.trig)continue;                   // already near or above market
    const atRisk=s.morale<45||ratio<0.85;          // about to walk
    if(cfg.needProfit&&!profitable&&!atRisk)continue;   // Efficiency: only act if we can afford it, unless we're losing them
    if(!profitable&&!atRisk&&st!=='grow')continue;      // don't raise into a loss unless retaining someone
    const target=Math.min(mkt*cfg.to,mkt);         // never above market
    const newSal=Math.round(Math.min(target,s.salary*1.08)/10)*10;   // move toward market, at most +8% a step
    if(newSal<=s.salary)continue;
    // keep the team within its budget, unless we're about to lose someone
    if(typeof budgetOK==='function'&&typeof roleTeam==='function'&&!atRisk){const extra=(newSal-s.salary)*(1+ONCOST);if(!budgetOK(roleTeam(s.role),extra))continue;}
    s.salary=newSal;s.raise=S.day;s.morale=Math.min(100,s.morale+5);
    const who=m.coo?'Your COO':(m.name?m.name.split(' ')[0]:'A manager');
    log(who+' brought '+s.name+'’s pay closer to the market rate, to '+gbp(newSal)+' a month.','info');
  }
}
if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);try{payManagedMonthly();}catch(e){}};}

/* ============ build 87: departmental budgets ============
   Each department runs to a monthly budget covering its payroll. It's the
   concrete guardrail the workforce brain checks against: pay won't push a team
   over its budget, and an over-budget team cools its hiring. Untouched, a budget
   tracks the team's payroll with headroom, so it never strangles normal play.
   Set one deliberately and it sticks and bites; hire a CFO and they allocate
   them all to your stance. */

const DEPTS=[
  {k:'desk',t:'Service desk',roles:['desk','hdm']},
  {k:'eng',t:'Engineering',roles:['eng','tm','pm']},
  {k:'sales',t:'Sales & accounts',roles:['am','sm','sdm']},
  {k:'back',t:'Back office',roles:['bill','bm']}
];
function roleTeam(role){for(const d of DEPTS)if(d.roles.includes(role))return d.k;return null;}
function teamPayroll(k){let t=0;for(const s of S.staff){if(s.left||!present(s)||s.id==='you')continue;if(roleTeam(s.role)===k)t+=s.salary*(1+ONCOST);}return Math.round(t);}
function deptHeadcount(k){return S.staff.filter(s=>!s.left&&present(s)&&roleTeam(s.role)===k).length;}
function stanceBudgetHeadroom(){return ({grow:1.22,steady:1.10,efficiency:1.02})[(typeof stance==='function')?stance():'steady']||1.10;}
function teamBudget(k){S.co.budgets=S.co.budgets||{};if(S.co.budgets[k]==null)S.co.budgets[k]=Math.round(teamPayroll(k)*stanceBudgetHeadroom()/100)*100;return S.co.budgets[k];}
/* does the team stay within budget with this much extra monthly cost? */
function budgetOK(k,extra){if(!k)return true;return teamPayroll(k)+(extra||0)<=teamBudget(k);}
function overBudget(k){return teamPayroll(k)>teamBudget(k)*1.02;}

/* the CFO allocates budgets to the stance; untouched budgets otherwise track payroll so they never block */
function budgetsMonthly(){
  if(S.day%DPM!==3)return;S.co.budgets=S.co.budgets||{};S.co.budgetSet=S.co.budgetSet||{};
  const cfo=(typeof exec==='function')&&exec('cfo');
  for(const d of DEPTS){const want=Math.round(teamPayroll(d.k)*stanceBudgetHeadroom()/100)*100;
    if(cfo){const cur=S.co.budgets[d.k]!=null?S.co.budgets[d.k]:want;S.co.budgets[d.k]=Math.round((cur*0.4+want*0.6)/100)*100;S.co.budgetSet[d.k]=false;}
    else if(!S.co.budgetSet[d.k])S.co.budgets[d.k]=want;
  }
}
if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);try{budgetsMonthly();}catch(e){}};}

/* an over-budget team cools its hiring (on top of the stance bias) */
if(typeof teamNeed==='function'){const _tnb=teamNeed;teamNeed=function(){const N=_tnb.apply(this,arguments);if(!N)return N;
  if(N.desk!=null&&overBudget('desk'))N.desk*=0.7;
  if(N.eng!=null&&overBudget('eng'))N.eng*=0.7;
  return N;};}

ACT_EXT.budgetAdj=v=>{const [k,dd]=(v||'').split(':');if(!DEPTS.some(x=>x.k===k))return;S.co.budgets=S.co.budgets||{};S.co.budgetSet=S.co.budgetSet||{};
  const cur=teamBudget(k);S.co.budgets[k]=Math.max(0,Math.round(cur*(1+(+dd))/100)*100);S.co.budgetSet[k]=true;};

function budgetsSec(){
  const cfo=(typeof exec==='function')&&exec('cfo');
  let h='<div class="sec"><h3>Departmental budgets</h3><p class="lede">Each department runs to a monthly budget covering its payroll, and hiring and pay are checked against it. '+(cfo?'Your CFO allocates them to your stance — you set the direction, they divide the money.':'Set them here. Left alone they track payroll; set one and it holds. Hire a CFO and they take over allocating.')+'</p><ul class="list">';
  for(const d of DEPTS){const spend=teamPayroll(d.k);const bud=teamBudget(d.k);const pen=bud?clamp(spend/bud,0,1.3):0;const over=spend>bud;const setBy=(S.co.budgetSet||{})[d.k];
    h+='<li class="item" style="flex-direction:column;align-items:stretch;gap:4px">'+

      '<div style="height:6px;border-radius:3px;background:var(--line);overflow:hidden"><div style="height:100%;width:'+Math.round(Math.min(1,pen)*100)+'%;background:var('+(over?'--bad':pen>0.9?'--wrn':'--good')+')"></div></div>'+
      (cfo?'<div class="mut" style="font-size:.76rem">Set by the CFO to your stance.</div>':'<div class="row" style="justify-content:space-between;align-items:center"><span class="mut" style="font-size:.76rem">'+(setBy?'You set this':'Tracking payroll')+'</span><span class="row" style="gap:6px"><button class="btn sm" data-act="budgetAdj" data-v="'+d.k+':-0.05">−5%</button><button class="btn sm" data-act="budgetAdj" data-v="'+d.k+':0.05">+5%</button></span></div>')+

/* ============ build 88: meetings — the delegation feedback surface ============
   The layer where you see what your team decided and steer them. With managers
   but no execs, a weekly operations meeting; with a full C-suite, a monthly
   board-style exec meeting; with a mix, both. It reports what changed since you

   and lets you set the direction from the same place. Reopenable on Strategy. */

const MGR_DEPT={hdm:'desk',sm:'sales',sdm:'sales',bm:'back',tm:'eng',pm:'eng'};

function mtgHasMgrs(){return typeof mgrOn==='function'&&ORG_MGR_ROLES.some(r=>mgrOn(r));}
function mtgHasExecs(){return typeof execAny==='function'&&execAny();}
/* board meeting once execs exist; otherwise a weekly ops meeting once you have managers; nothing while solo */
function mtgMode(){if(mtgHasExecs())return 'board';if(mtgHasMgrs())return 'ops';return null;}
function mtgInterval(mode){return mode==='board'?DPM:7;}

function mtgDeptSnapshot(){const o={};if(typeof DEPTS!=='undefined')for(const d of DEPTS)o[d.k]=(typeof deptHeadcount==='function')?deptHeadcount(d.k):0;return o;}
function deptMorale(k){let t=0,n=0;for(const s of S.staff){if(s.left||!present(s)||s.id==='you'||s.role==='founder')continue;if((typeof roleTeam==='function'?roleTeam(s.role):null)===k){t+=s.morale;n++;}}return n?Math.round(t/n):null;}

/* the shared digest: what has moved since you last met */
function mtgDigest(since,refHead){
  const staff=S.staff.filter(s=>!s.left&&present(s)&&s.id!=='you'&&s.role!=='founder');
  const head=staff.length;
  const mor=staff.length?Math.round(staff.reduce((a,s)=>a+s.morale,0)/staff.length):0;
  const atRisk=staff.filter(s=>s.morale<45).length;

  const raised=staff.filter(s=>(s.raise||-999)>=since).length;
  const redund=staff.filter(s=>s.why==='redundancy'&&s.leaveOn!=null).length;
  const leaving=staff.filter(s=>s.leaveOn!=null&&s.why!=='redundancy').length;
  const hires=(S.hireLog||[]).filter(h=>h.d>=since).length;
  const departs=(S.exits||[]).filter(d=>d>=since).length;
  const refTot=refHead?Object.values(refHead).reduce((a,b)=>a+b,0):head;
  const dHead=head-refTot;

  let h='<div class="tiles">'+
    '<div class="tile"><span class="k">People</span><span class="v">'+head+'</span><small>'+(dHead>0?'+'+dHead:dHead<0?dHead:'no change')+' since last meeting</small></div>'+
    '<div class="tile"><span class="k">Average morale</span><span class="v '+(mor>=60?'pos':mor>=45?'wrn':'neg')+'">'+mor+'</span><small>'+(atRisk?atRisk+' at risk of leaving':'nobody at risk')+'</small></div>'+
    '<div class="tile"><span class="k">Pay vs market</span><span class="v '+(underpaid?'wrn':'pos')+'">'+(underpaid?underpaid+' behind':'on the money')+'</span><small>'+(raised?raised+' brought up since':'no rises since')+'</small></div>'+
    '<div class="tile"><span class="k">Recurring profit</span><span class="v '+((typeof companyPL==='function'?companyPL().op:0)>=0?'pos':'neg')+'">'+gbp(Math.round(typeof companyPL==='function'?companyPL().op:0))+'</span><small>a month</small></div>'+
    '</div>';

  // what the managers actually did
  const did=[];
  if(hires)did.push(hires+' '+(hires===1?'person':'people')+' hired');
  if(redund)did.push(redund+' role'+(redund===1?'':'s')+' made redundant');
  if(departs&&departs>redund)did.push((departs-redund)+' left of their own accord');
  if(raised)did.push(raised+' pay'+(raised===1?' rise':' rises')+' toward the market');
  h+='<p style="margin-top:12px">'+(did.length?'Since you last met, your team '+joinList(did)+'.':'A quiet stretch. Your team held the line with no hires, exits or pay changes.')+(leaving?' <b class="wrn">'+leaving+' '+(leaving===1?'person is':'people are')+' currently working their notice.</b>':'')+'</p>';

  // budgets, if built
  if(typeof DEPTS!=='undefined'&&typeof overBudget==='function'){
    const over=DEPTS.filter(d=>overBudget(d.k));
    if(over.length)h+='<p class="note warn"><b>Over budget:</b> '+joinList(over.map(d=>d.t.toLowerCase()))+'. Hiring there is being held back until spend comes back in line, or you lift the budget.</p>';
  }
  return h;
}

function joinList(a){if(!a.length)return '';if(a.length===1)return a[0];return a.slice(0,-1).join(', ')+' and '+a[a.length-1];}

/* the direction control, inline, so you steer from the meeting */

/* ============ build 91: active share market — daily prices, candles, chart box ============
   The national MSPs now trade daily: each firm's price moves a little every day
   around its underlying trend, recorded as a daily series. The market panel under
   the office floor plan is a proper trading view — a compact firm menu down the
   side and a full-size line or candle chart of the selected firm. A small dealing
   spread keeps the daily wobble from being a free money printer. */

const MKT_SPREAD=0.006;   /* dealing spread each way, so churning the daily noise isn't free money */

/* ---- ownership model: finite shares, a tradeable float, and price impact ---- */
const SHARES_OUT=1000000;    /* a national is split into a million shares, like a public float, so its price per share sits at the same scale as your own float; ownership % = units / SHARES_OUT */
const IMPACT_K=0.6;       /* holding the whole float lifts the price ~60% (a real control premium) */
const DEF_FLOAT=0.70;     /* the freely traded fraction; the rest sits with insiders until a takeover */
const DISCLOSE=0.30, CONTROL=0.50, SQUEEZE_PREM=0.15;
function floatOf(r){if(r&&r.float==null)r.float=+(0.62+Math.random()*0.16).toFixed(3);return (r&&r.float)||DEF_FLOAT;}
/* the float actually reachable on the market: the board's buybacks (phase 2) shrink it */
function effFloat(r){const cut=(r&&r.def&&r.def.bought)||0;const f=floatOf(r)-cut;return (typeof clamp==='function')?clamp(f,0.28,1):Math.max(0.28,f);}
/* a triggered poison pill (phase 2) makes the remaining shares punishingly dear */
function pillMult(r){return (r&&r.def&&r.def.pill)?1.5:1;}
function ownUnits(rid){const h=S.co&&S.co.shares&&S.co.shares[rid];return h?h.units:0;}
/* whole-firm value: the undisturbed price (your own scarcity premium stripped out) times all the shares */
function firmCap(r){if(!r)return 0;const imp=shareImpact(r)||1;return Math.round(sharePx(r)/imp*SHARES_OUT);}
function ownFrac(r){return r?ownUnits(r.id)/SHARES_OUT:0;}
/* the more of the float you hold, the scarcer and dearer the shares get */
function shareImpact(r){if(!r)return 1;const f=effFloat(r);const held=(typeof clamp==='function'?clamp(ownUnits(r.id)/(SHARES_OUT*f),0,1):0);return (1+IMPACT_K*held+(r.disclosed?0.06:0))*pillMult(r);}

/* the live price: monthly fundamental (size x mood) x daily tick x your scarcity premium */
if(typeof sharePx==='function'){const _sharePx0=sharePx;sharePx=function(r){return Math.max(0.01,Math.round(_sharePx0(r)*((r&&r.shareTick)||1)*shareImpact(r)*100)/100);};}

/* daily market: each national's price random-walks around its fundamental, recorded day by day */
function marketDaily(){
  if(typeof natFirms!=='function')return;
  for(const r of natFirms()){
    let t=(r.shareTick||1);
    t+=(1-t)*0.04;                              // gentle mean reversion to the fundamental
    t*=1+(typeof rnd==='function'?rnd(-0.03,0.03):(Math.random()*2-1)*0.03);   // ~3% daily noise
    if(Math.random()<0.03)t*=1+(Math.random()*2-1)*0.09;                        // the odd bigger move
    r.shareTick=(typeof clamp==='function')?clamp(t,0.72,1.38):Math.max(0.72,Math.min(1.38,t));
    const px=sharePx(r);
    (r.pxDaily=r.pxDaily||[]).push(px);
    if(r.pxDaily.length>280)r.pxDaily.shift();              // ~1 year of daily detail
    // once a month, roll the month's daily prices into a monthly OHLC candle for the long views
    if(S.day%DPM===0){const month=r.pxDaily.slice(-DPM);if(month.length){(r.pxMonthlyC=r.pxMonthlyC||[]).push({o:month[0],h:Math.max.apply(null,month),l:Math.min.apply(null,month),c:month[month.length-1]});if(r.pxMonthlyC.length>150)r.pxMonthlyC.shift();}}
  }
}
/* the timeframes offered on the chart; short ones read daily detail, long ones the monthly candles */
const TFS=[
  {k:'1M',t:'1M',src:'daily',days:21,per:1},
  {k:'3M',t:'3M',src:'daily',days:63,per:2},
  {k:'6M',t:'6M',src:'daily',days:126,per:3},
  {k:'1Y',t:'1Y',src:'daily',days:280,per:5},
  {k:'5Y',t:'5Y',src:'monthly',months:60},
  {k:'ALL',t:'All',src:'monthly'}
];
function resolveTF(){const k=(S.co&&S.co.mktTF)||'6M';return TFS.find(t=>t.k===k)||TFS[2];}
/* resolve the selected timeframe into line points and candles for a firm */
function chartData(r){

    if(mc.length>=2)return {linePts:mc.map(c=>c.c),candles:mc};}
  const d=(r.pxDaily||[]).slice(tf.days?-tf.days:0);const series=d.length?d:mktSeries(r);

if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);try{marketDaily();}catch(e){}};}

/* a firm's daily price series, guaranteed to hold at least the current price */
function mktSeries(r){const px=sharePx(r);const s=(r&&r.pxDaily&&r.pxDaily.length)?r.pxDaily.slice():[px];if(s[s.length-1]!==px)s.push(px);return s;}
function pxChange(s,back){if(!s||s.length<2)return 0;const base=s.length>back?s[s.length-1-back]:s[0];const last=s[s.length-1];return base?(last-base)/base:0;}

/* ---- dealing: spread, a float cap, and disclosure at 30% ---- */
ACT_EXT.shareBuy=v=>{const [rid,amt]=(v||'').split(':');const r=rivalById(rid);if(!r||r.tier<3)return;
  const maxU=Math.floor(SHARES_OUT*effFloat(r));const cur=ownUnits(rid);
  if(cur>=maxU){if(typeof toast==='function')toast('You already hold all the freely traded shares. Take control to force out the rest.');return;}
  const px=Math.max(0.01,Math.round(sharePx(r)*(1+MKT_SPREAD)*100)/100);const a=+amt;if(!a||a<px)return;
  let u=Math.floor(Math.min(a,S.co.cash)/px);if(u<1)return;u=Math.min(u,maxU-cur);if(u<1)return;const cost=u*px;
  S.co.cash-=cost;S.co.shares=S.co.shares||{};const hd=S.co.shares[rid]||{units:0,paid:0};hd.units+=u;hd.paid+=cost;S.co.shares[rid]=hd;
  log('Bought '+u.toLocaleString()+' shares in '+r.name+' at '+spx(px)+' for '+gbp(cost)+'. You hold '+Math.round(ownFrac(r)*100)+'% now.','info');
  if(!r.disclosed&&ownFrac(r)>=DISCLOSE){r.disclosed=S.day;log('You’ve passed '+Math.round(DISCLOSE*100)+'% of '+r.name+' and had to disclose the holding. The market smells a bid and the price has firmed.','event');}
};
/* selling gets you the fundamental price, never your own scarcity premium — so pumping a stake
   and dumping it always loses (you only make money if the firm has genuinely grown) */
ACT_EXT.shareSell=v=>{const parts=String(v==null?'':v).split(':');const rid=parts[0],nStr=parts[1];const r=rivalById(rid);const hd=S.co.shares&&S.co.shares[rid];if(!r||!hd||!hd.units)return;
  const imp=shareImpact(r)||1;const basePx=Math.max(0.01,Math.round(sharePx(r)/imp*100)/100);   /* price with premiums stripped out */
  const px=Math.max(0.01,Math.round(basePx*(1-MKT_SPREAD)*100)/100);
  let units=(nStr!==undefined&&nStr!=='')?Math.min(hd.units,Math.max(1,Math.floor(+nStr||0))):hd.units;   /* a count sells part; no count sells all */
  if(units<1)return;
  const val=units*px;S.co.cash+=val;S.m.setup=(S.m.setup||0)+val;S.co.capYr=(S.co.capYr||0)+val;
  const paidBack=Math.round(hd.paid*(units/hd.units));hd.units-=units;hd.paid=Math.max(0,hd.paid-paidBack);   /* keep the cost basis on what's left */
  const pctSold=Math.round(units/SHARES_OUT*100);const soldOut=hd.units<=0;if(soldOut)delete S.co.shares[rid];
  log('Sold '+units.toLocaleString()+' share'+(units===1?'':'s')+' ('+pctSold+'%) of '+r.name+' at '+spx(px)+' for '+gbp(val)+'.'+(soldOut?'':' You still hold '+Math.round(hd.units/SHARES_OUT*100)+'%.'),'info');};

/* ---- taking control: buy out the rest and fold the firm into your group ---- */
function takeoverElig(r){return r&&ownFrac(r)>=CONTROL;}
function takeoverCost(r){const hd=S.co.shares&&S.co.shares[r.id];const remaining=SHARES_OUT-((hd&&hd.units)||0);return Math.round(remaining*sharePx(r)*(1+SQUEEZE_PREM));}
function foldNational(r){
  const clients=Math.max(1,Math.round(r.clients||1));
  const seatsPer=(typeof MKT_TIERS!=='undefined'&&MKT_TIERS[r.tier])?MKT_TIERS[r.tier].seats:15;
  const seats=(typeof rSeats==='function')?rSeats(r):clients*seatsPer;
  const monthly=seats*45*0.9;const perClient=monthly/clients;
  const need=Math.max(1,Math.round(seats/(typeof BR_TECH_PER!=='undefined'?BR_TECH_PER:130)*1.05));
  const b={id:uid(),name:r.name,rid:r.id,region:'home',clients,price:1,price0:0.98,perClient,seatsPer,
    mgr:{name:pick(FIRST)+' '+pick(LAST),skill:ri(3,5),salary:Math.round(rnd(4500,6500)/10)*10},
    staff:need,invest:false,grow:1,sat:66,born:S.day,cash:0,hist:[],national:true};
  if(typeof branches==='function')branches().push(b);
  if(S.mkt)S.mkt.r=S.mkt.r.filter(x=>x.id!==r.id);
  return b;
}
ACT_EXT.takeoverGo=v=>{const r=rivalById(v);if(!r||!takeoverElig(r))return;
  const cost=takeoverCost(r);
  if(S.co.cash-cost< -(typeof OD_LIMIT!=='undefined'?OD_LIMIT:10000)){if(typeof toast==='function')toast('You can’t cover the '+gbp(cost)+' to buy out the remaining shareholders.');return;}
  S.co.cash-=cost;S.co.acq=(S.co.acq||0)+cost;delete S.co.shares[r.id];
  foldNational(r);S.co.rep=Math.min(100,(S.co.rep||50)+3);
  log('You’ve taken control of '+r.name+', bought out the last shareholders for '+gbp(cost)+', and folded it into your group as a subsidiary.','event');
  ui.modal=null;};

/* ---- inline SVG sparkline (no text, safe to stretch) ---- */
function sparkSVG(hist,w,h){
  w=w||64;h=h||22;const pts=(hist||[]).slice(-40);
  if(pts.length<2)return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><line x1="1" y1="'+(h/2)+'" x2="'+(w-1)+'" y2="'+(h/2)+'" stroke="var(--line)" stroke-width="1.5"/></svg>';
  let lo=Math.min.apply(null,pts),hi=Math.max.apply(null,pts);if(hi===lo)hi=lo+1;
  const pad=2,X=i=>pad+i*(w-2*pad)/(pts.length-1),Y=v=>pad+(hi-v)/(hi-lo)*(h-2*pad);
  const d=pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const up=pts[pts.length-1]>=pts[0],col=up?'var(--good)':'var(--bad)';
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/* ---- line-chart SVG for the buy window ---- */
function priceChartSVG(series,cost){
  const pts=(series||[]).slice(-90);const w=320,h=120;
  if(pts.length<2)return '<p class="mut" style="font-size:.8rem;margin:4px 0 10px">The price chart fills in as the market trades day by day.</p>';
  let lo=Math.min.apply(null,pts),hi=Math.max.apply(null,pts);
  const hasCost=typeof cost==='number'&&cost>0;
  if(hasCost){lo=Math.min(lo,cost);hi=Math.max(hi,cost);}
  if(hi===lo)hi=lo+1;
  const padL=46,padR=8,padT=8,padB=8,X=i=>padL+i*(w-padL-padR)/(pts.length-1),Y=v=>padT+(hi-v)/(hi-lo)*(h-padT-padB);
  const d=pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const up=pts[pts.length-1]>=pts[0],col=up?'var(--good)':'var(--bad)';
  let grid='';for(let i=0;i<=2;i++){const v=lo+(hi-lo)*i/2,y=Y(v);grid+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="2" y="'+(y+3).toFixed(1)+'" font-size="9" fill="var(--muted)">'+(hi<1000?'£'+v.toFixed(2):gbp(Math.round(v)))+'</text>';}
  let costEl='';

    costEl='<line x1="'+padL+'" y1="'+cy.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+cy.toFixed(1)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/><text x="'+(w-padR)+'" y="'+(cy-3).toFixed(1)+'" font-size="9" text-anchor="end" fill="'+ccol+'">paid '+(cost<1000?'£'+cost.toFixed(2):gbp(Math.round(cost)))+'</text>';}
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="max-width:340px;height:auto;display:block" role="img" aria-label="Share price history">'+grid+costEl+'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/><circle cx="'+X(pts.length-1).toFixed(1)+'" cy="'+Y(pts[pts.length-1]).toFixed(1)+'" r="2.5" fill="'+col+'"/></svg>';
}

/* ---- group a daily series into OHLC candles ---- */
function mktCandles(daily,per,maxC){
  const out=[];for(let end=daily.length;end>0;end-=per){const chunk=daily.slice(Math.max(0,end-per),end);if(!chunk.length)continue;
    out.unshift({o:chunk[0],c:chunk[chunk.length-1],h:Math.max.apply(null,chunk),l:Math.min.apply(null,chunk)});if(out.length>=maxC)break;}
  return out;
}
/* ---- the full-size canvas chart (line or candle), sized to its box ---- */
function drawMktChart(cv,r){
  if(!cv||!r||!V.col)return;const K=V.col;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  const type=(S.co&&S.co.mktChart)==='candle'?'candle':'line';
  const data=chartData(r);const padL=48,padR=10,padT=10,padB=8;
  let lo,hi,candles=null,pts=null;
  if(type==='candle'){candles=data.candles;if(!candles.length)candles=[{o:sharePx(r),h:sharePx(r),l:sharePx(r),c:sharePx(r)}];let a=[];candles.forEach(k=>{a.push(k.h,k.l);});lo=Math.min.apply(null,a);hi=Math.max.apply(null,a);}
  else{pts=data.linePts.length?data.linePts:[sharePx(r)];lo=Math.min.apply(null,pts);hi=Math.max.apply(null,pts);}
  if(!(hi>lo))hi=lo+1;
  const hd=S.co&&S.co.shares&&S.co.shares[r.id];const costPx=(hd&&hd.units>0)?hd.paid/hd.units:0;
  if(costPx>0){lo=Math.min(lo,costPx);hi=Math.max(hi,costPx);}
  const pv=(hi-lo)*0.08;lo-=pv;hi+=pv;
  const Y=v=>padT+(hi-v)/(hi-lo)*(h-padT-padB);
  c.font='10px '+(K.mono||'monospace');c.textAlign='left';c.lineWidth=1;
  for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);c.strokeStyle=K.line;c.beginPath();c.moveTo(padL,y);c.lineTo(w-padR,y);c.stroke();c.fillStyle=K.muted;c.fillText(hi<1000?'£'+v.toFixed(2):gbp(Math.round(v)),2,y+3);}
  if(costPx>0){const cy=Y(costPx);const inProfit=sharePx(r)>=costPx;c.save();c.strokeStyle=K.muted;c.setLineDash([4,3]);c.lineWidth=1;c.beginPath();c.moveTo(padL,cy);c.lineTo(w-padR,cy);c.stroke();c.setLineDash([]);c.fillStyle=inProfit?K.good:K.bad;c.textAlign='right';c.fillText('paid '+(costPx<1000?'£'+costPx.toFixed(2):gbp(Math.round(costPx))),w-padR,cy-3);c.textAlign='left';c.restore();}
  if(type==='candle'){
    const n=candles.length||1,bw=Math.max(2,(w-padL-padR)/n*0.6);
    candles.forEach((k,i)=>{const x=padL+(i+0.5)*(w-padL-padR)/n,up=k.c>=k.o,col=up?K.good:K.bad;
      c.strokeStyle=col;c.fillStyle=col;c.beginPath();c.moveTo(x,Y(k.h));c.lineTo(x,Y(k.l));c.stroke();
      const yo=Y(k.o),yc=Y(k.c),top=Math.min(yo,yc),bh=Math.max(1.5,Math.abs(yc-yo));c.fillRect(x-bw/2,top,bw,bh);});
  }else{
    const X=i=>padL+i*(w-padL-padR)/Math.max(1,pts.length-1),up=pts[pts.length-1]>=pts[0];
    c.strokeStyle=up?K.good:K.bad;c.lineWidth=2;c.beginPath();pts.forEach((v,i)=>{const X_=X(i),Y_=Y(v);i?c.lineTo(X_,Y_):c.moveTo(X_,Y_);});c.stroke();
    c.fillStyle=c.strokeStyle;c.beginPath();c.arc(X(pts.length-1),Y(pts[pts.length-1]),2.5,0,7);c.fill();
  }
}

/* ============ build 94: deferrable acquisition offers ============
   When a firm offers to sell to you, you no longer have to decide on the spot.
   "Think it over" parks the offer on the Market tab with a deadline, so you can
   go and raise the funds — sell shares, stakes or a branch, or borrow — and come
   back to complete it. The seller waits about a month, then moves on. */

/* park a live offer so it can be picked up again later */
function deferAcqOffer(x){
  if(!x)return;if(!x._by)x._by=S.day+ri(25,35);
  S.co.offers=S.co.offers||[];
  if(!S.co.offers.some(o=>o.x===x))S.co.offers.push({x,by:x._by});
  log('You asked '+(x.owner||'the seller')+' for time to think about '+x.name+'. It’s waiting on the Market tab until '+dLabel(x._by)+'.','event');
}

/* add a "Think it over" choice to the acquisition offer, just before "Pass" */
if(typeof EVENTS!=='undefined'&&EVENTS.acquire&&EVENTS.acquire.make){const _am=EVENTS.acquire.make;
  EVENTS.acquire.make=function(x){const e=_am.call(this,x);
    if(e&&e.choices&&e.choices.length&&!e.choices.some(c=>c._defer)){
      const c={label:'Think it over',note:'Park it on the Market tab, raise the funds, and come back. They’ll wait about a month.',_defer:true,go(){deferAcqOffer(x);}};
      e.choices.splice(Math.max(0,e.choices.length-1),0,c);
    }
    return e;};}

/* offers expire if you leave them too long */
function offersDaily(){
  if(!S.co||!S.co.offers||!S.co.offers.length)return;
  const keep=[];for(const o of S.co.offers){if(o.by<=S.day)log((o.x.owner||'The seller')+' got tired of waiting and sold '+o.x.name+' to someone else.','info');else keep.push(o);}
  S.co.offers=keep;
}
if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);try{offersDaily();}catch(e){}};}

/* reopen a parked offer as a live decision (funded from your current cash/loan) */
ACT_EXT.offerReview=v=>{const i=+v;const o=S.co.offers&&S.co.offers[i];if(!o)return;S.co.offers.splice(i,1);S.pending={id:'acquire',ctx:o.x};ui.modal=null;if(typeof nextModal==='function')nextModal();};
ACT_EXT.offerPass=v=>{const i=+v;const o=S.co.offers&&S.co.offers[i];if(!o)return;S.co.offers.splice(i,1);log('You dropped the offer for '+o.x.name+'.','info');};

/* the "Offers on the table" list, on the Market tab */
function offersSec(){

  for(let i=0;i<offs.length;i++){const o=offs[i],x=o.x;const need=Math.max(0,Math.round(x.price-S.co.cash));const left=Math.max(0,o.by-S.day);
    h+='<li class="item" style="flex-direction:column;align-items:stretch;gap:4px">'+
      '<div class="row" style="justify-content:space-between"><span><b>'+esc(x.name)+'</b> <span class="mut">'+gbp(x.mrr)+'/mo · '+x.cl.length+' clients</span></span><span class="r">'+gbp(x.price)+'</span></div>'+
      '<div class="row" style="justify-content:space-between;align-items:center"><span style="font-size:.8rem">'+(need>0?'<span class="wrn">'+gbp(need)+' short</span>':'<span class="pos">you can afford it</span>')+' <span class="mut">· '+left+' day'+(left===1?'':'s')+' left</span></span>'+
      '<span class="row" style="gap:6px"><button class="btn sm" data-act="offerPass" data-v="'+i+'">Drop</button><button class="btn sm primary" data-act="offerReview" data-v="'+i+'">Review</button></span></div></li>';}
  return h+'</ul></div>';
}

/* a reminder on the Money tab, where you go to raise the funds */
if(typeof paneMoney==='function'){const _pmn=paneMoney;paneMoney=function(){let h=_pmn.apply(this,arguments);const offs=(S.co&&S.co.offers)||[];
  if(offs.length){const o=offs[0],need=Math.max(0,Math.round(o.x.price-S.co.cash));
    h='<div class="sec"><p class="note'+(need>0?' warn':'')+'"><b>Offer on the table:</b> '+esc(o.x.name)+' for '+gbp(o.x.price)+(need>0?' — you’re '+gbp(need)+' short. Raise the funds, then ':' — you can afford it now. ')+'<button class="linkbtn" data-act="tab" data-v="market">review it on the Market tab</button>.</p></div>'+h;}
  return h;};}

/* ============ build 96: phase 2 — the takeover contest ============
   Going after a listed national is no longer a quiet accumulation. Once you cross
   the disclosure line the board fights back — buying back its own shares to shrink
   the float you can reach, and, if you close on control, adopting a poison pill
   that makes the last shares punishingly dear. A rival white knight may also bid,
   and if you don't take control before their deadline, they win the firm and buy
   you out. Move decisively or lose the prize. */

const KNIGHTS=['Castlegate Group','Northstar Capital','Albion Tech Partners','Meridian Managed Services','a private-equity buyer'];
function defInit(r){if(!r.def)r.def={bought:0,pill:false,knight:null,since:S.day};return r.def;}

/* monthly: the target defends while you're a threat but not yet in control */
function defenseMonthly(){
  if(typeof natFirms!=='function')return;
  for(const r of natFirms()){
    const f=ownFrac(r);
    if(f<DISCLOSE){if(r.def&&f<0.02)r.def=null;continue;}    // not a threat, or you've sold out — stand down
    if(f>=CONTROL)continue;                                   // you're effectively in control; defences pause
    const d=defInit(r);
    const cap=Math.max(0,floatOf(r)-0.34);                    // buy back to shrink the reachable float
    if(d.bought<cap)d.bought=Math.min(cap,d.bought+rnd(0.015,0.035));
    if(!d.pill&&f>=0.44&&Math.random()<0.6){d.pill=true;log('The board of '+r.name+' has adopted a poison pill — a block of new shares placed with friendly hands. Taking control just got a lot dearer.','bad');}
    if(!d.knight&&Math.random()<0.18){d.knight={name:pick(KNIGHTS),by:S.day+ri(25,50),price:Math.round(sharePx(r)*rnd(1.05,1.2)*100)/100};log(d.knight.name+' has launched a rival bid for '+r.name+' at about '+spx(d.knight.price)+' a share. Take control before '+dLabel(d.knight.by)+' or they’ll win it.','event');}
  }
}
/* a white knight that reaches its deadline before you take control wins the firm and buys you out */
function knightDaily(){
  if(typeof natFirms!=='function')return;
  for(const r of natFirms().slice()){const d=r.def;if(!d||!d.knight)continue;
    if(ownFrac(r)>=CONTROL)continue;                          // you're about to take it yourself
    if(S.day>=d.knight.by){
      const hd=S.co.shares&&S.co.shares[r.id];
      if(hd&&hd.units){const val=hd.units*d.knight.price;S.co.cash+=val;S.m.setup=(S.m.setup||0)+val;S.co.capYr=(S.co.capYr||0)+val;log(d.knight.name+' has won control of '+r.name+'. Your '+Math.round(ownFrac(r)*100)+'% was bought out at '+spx(d.knight.price)+' a share for '+gbp(val)+'. It’s off the market now.','event');delete S.co.shares[r.id];}
      else log(d.knight.name+' has acquired '+r.name+'. It’s off the market now.','info');
      if(S.mkt)S.mkt.r=S.mkt.r.filter(x=>x.id!==r.id);
    }
  }
}
if(typeof marketMonthly==='function'){const _mm=marketMonthly;marketMonthly=function(){_mm.apply(this,arguments);try{defenseMonthly();}catch(e){}};}
if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);try{knightDaily();}catch(e){}};}

/* the warning strip shown on the trading view when a firm is defending itself */
function defNote(r){const d=r&&r.def;if(!d)return '';const bits=[];
  if(d.bought>0.02)bits.push('buybacks have shrunk the tradeable float');
  if(d.pill)bits.push('a poison pill is in force');
  let h='';
  if(bits.length)h+='<div class="mkt-def warn">The board is defending — '+bits.join(', ')+'.</div>';
  if(d.knight){const left=Math.max(0,d.knight.by-S.day);h+='<div class="mkt-def bad"><b>'+esc(d.knight.name)+' has bid '+spx(d.knight.price)+'/share.</b> Take control within '+left+' day'+(left===1?'':'s')+' or they win '+esc(r.name)+'.</div>';}
  return h;}

/* ============ build 97: phase 3 — you become the target ============
   Once you're public and looking weak, a predator can come for the company you
   built. They take a position and buy toward control; cross 50% and it's theirs,
   and the run ends. You defend: buy back shares to lift your own stake and squeeze
   their headroom, trigger a poison pill to dilute them (at the cost of your price),
   or call in a white knight to see them off for a fee. */

function raidFrac(){const io=S.co&&S.co.ipo,raid=S.co&&S.co.raid;return (io&&raid)?raid.shares/io.shares:0;}

/* monthly: a raider may emerge, then buys toward control */
function raidStep(){
  if(typeof isPublic!=='function'||!isPublic()||S.over)return;const io=S.co.ipo;
  const floatFrac=(io.shares-io.yourShares)/io.shares;
  if(!S.co.raid){
    if(floatFrac<0.35)return;                                   // too little float to raid
    if(S.day-(io.floatDay||0)<DPM*6)return;                     // grace period after floating
    const rel=io.price/io.floatPrice;
    let p=0.02+(io.misses||0)*0.06+(rel<0.8?0.05:0)+(rel<0.55?0.08:0);
    if(floatFrac>0.55)p*=1.6;
    if(Math.random()<p){
      S.co.raid={name:pick(['Castlegate Group','Northstar Capital','Albion Tech Partners','a private-equity raider','Meridian Managed Services']),shares:Math.round(io.shares*rnd(0.06,0.12)),start:S.day,disclosed:false,price:Math.round(io.price*1.02)};
      log(S.co.raid.name+' has taken a '+Math.round(raidFrac()*100)+'% position in '+S.co.name+' and is buying. You’re in play — defend the company on the Strategy tab.','event');
    }
    return;
  }
  const raid=S.co.raid;
  const maxShares=io.shares-io.yourShares-Math.round(io.shares*0.05);
  raid.shares=Math.min(maxShares,raid.shares+Math.round(io.shares*rnd(0.03,0.07)));
  raid.price=Math.max(raid.price,Math.round(io.price*1.03));
  if(!raid.disclosed&&raidFrac()>=DISCLOSE){raid.disclosed=S.day;log(raid.name+' now holds '+Math.round(raidFrac()*100)+'% of '+S.co.name+' and has gone hostile. Defend it or lose the company.','bad');}
  if(raidFrac()>=CONTROL)raidWin();
}
function raidWin(){const io=S.co.ipo,raid=S.co.raid;if(!io||!raid)return;
  const E=(typeof exitNet==='function')?exitNet(Math.round(raid.price*io.yourShares)+Math.max(0,S.co.cash)-S.co.loan):{net:Math.round(raid.price*io.yourShares),cgt:0,gross:Math.round(raid.price*io.yourShares)};
  S.over={mi:monthOf(S.day),peak:Math.max(...S.hist.map(h=>h.mrr),mrr()),sold:{head:'Taken over',title:raid.name+' has taken control of '+S.co.name,body:raid.name+' crossed 50% on the open market and took control of the company you built. Your remaining shares were bought out at '+gbp(raid.price)+' each. It’s theirs to run now — you didn’t see them off in time.',net:E.net,cgt:E.cgt,gross:E.gross,home:(S.co.home||0)+(S.co.divs||0),offer:Math.round(raid.price*io.shares)}};
}
if(typeof monthEnd==='function'){const _me=monthEnd;monthEnd=function(){_me.apply(this,arguments);try{if(!S.over)raidStep();}catch(e){}};}

/* ---- defences ---- */
ACT_EXT.raidBuyback=()=>{const io=S.co.ipo,raid=S.co.raid;if(!io||!raid)return;
  const n=Math.round(io.shares*0.05),cost=Math.round(n*io.price*1.02);
  if(S.co.cash<cost){if(typeof toast==='function')toast('You need '+gbp(cost)+' in cash to buy back that block.');return;}
  S.co.cash-=cost;io.yourShares+=n;raid.shares=Math.max(0,raid.shares-Math.round(n*0.6));io.price=Math.round(io.price*1.02);
  log('You bought back '+pct(n/io.shares)+' of '+S.co.name+' for '+gbp(cost)+', lifting your stake and squeezing '+raid.name+'’s headroom.','good');
  if(raidFrac()<0.12){log(raid.name+' has given up and sold out of '+S.co.name+'.','good');S.co.raid=null;}};
ACT_EXT.raidPill=()=>{const io=S.co.ipo,raid=S.co.raid;if(!io||!raid)return;
  if(S.co.pillAt&&S.day-S.co.pillAt<DPM*6){if(typeof toast==='function')toast('You can only trigger a pill every few months.');return;}
  S.co.pillAt=S.day;const newShares=Math.round(io.shares*0.25);io.shares+=newShares;io.price=Math.round(io.price*0.92);S.co.rep=Math.max(0,(S.co.rep||50)-3);
  log('You’ve triggered a poison pill — new shares to friendly investors dilute '+raid.name+' down to '+Math.round(raidFrac()*100)+'%. Your share price took a knock, but the raider is on the back foot.','event');
  if(raidFrac()<0.2){log(raid.name+' has been diluted out and moved on.','good');S.co.raid=null;}};
ACT_EXT.raidKnight=()=>{const io=S.co.ipo,raid=S.co.raid;if(!io||!raid)return;
  const cost=Math.max(50000,Math.round(marketCap()*0.01));
  if(S.co.cash<cost){if(typeof toast==='function')toast('Advisers and a friendly placing would cost about '+gbp(cost)+'.');return;}
  S.co.cash-=cost;S.co.rep=Math.min(100,(S.co.rep||50)+1);
  log('A friendly investor took a blocking stake and saw '+raid.name+' off. It cost '+gbp(cost)+' in fees and favours, but '+S.co.name+' stays yours.','good');S.co.raid=null;};

/* ---- the "Under attack" section, at the top of the Strategy tab while public ---- */
function raidSec(){
  if(typeof isPublic!=='function'||!isPublic()||!S.co.raid)return '';const io=S.co.ipo,raid=S.co.raid,f=raidFrac();
  const bbCost=Math.round(Math.round(io.shares*0.05)*io.price*1.02);const pillReady=!(S.co.pillAt&&S.day-S.co.pillAt<DPM*6);
  return '<div class="sec" style="border:1px solid var(--bad);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--bad) 7%,transparent)">'+
    '<h3 style="color:var(--bad)">Under attack</h3><p class="lede"><b>'+esc(raid.name)+'</b> holds <b>'+Math.round(f*100)+'%</b> of '+esc(S.co.name)+' and is buying toward control. Cross 50% and they take the company and end your run. Defend it.</p>'+
    '<div class="mkt-bar" style="height:9px;margin:8px 0"><i style="width:'+Math.round((typeof clamp==='function'?clamp(f,0,1):f)*100)+'%;background:var(--bad)"></i><u style="left:'+Math.round(DISCLOSE*100)+'%"></u><u style="left:50%"></u></div>'+
    '<div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn sm primary" data-act="raidBuyback" '+(S.co.cash>=bbCost?'':'disabled')+'>Buy back 5% · '+gbp(bbCost)+'</button><button class="btn sm" data-act="raidPill" '+(pillReady?'':'disabled')+'>Poison pill</button><button class="btn sm" data-act="raidKnight">White knight · '+gbp(Math.max(50000,Math.round(marketCap()*0.01)))+'</button></div>'+
    '<p class="mut" style="font-size:.78rem;margin-top:6px">Buybacks lift your stake and squeeze their headroom. A pill dilutes them but knocks your share price. A white knight ends it for a fee.</p></div>';
}
/* raidSec relocated to the Ownership tab (see zzr.js) */

/* ============ build 98: phase 4 — shorting and activism ============
   Two ways to play the bear side. Short a national: borrow shares, sell them now,
   buy them back later — you profit if the price falls, lose if it rises, and a
   margin call closes you out if it runs 60% against you (plus a daily borrow fee).
   And agitate: on a disclosed stake, push the board for a special dividend or a
   sharpening-up that pops the shares. */

const SHORT_FEE=0.00015;   /* daily borrow fee on the position value */
function shortOf(rid){return S.co&&S.co.shorts&&S.co.shorts[rid];}

ACT_EXT.shortAsk=v=>{if(!rivalById(v))return;ui.amtMsg=null;ui.amtVal='';ui.modal={type:'amt',kind:'short',rid:v};};
/* the profit (or loss) of covering a short right now, spread included */
function shortPL(r,s){s=s||shortOf(r&&r.id);if(!r||!s)return 0;const px=sharePx(r);return Math.round(s.units*(s.openPx*(1-MKT_SPREAD)-px*(1+MKT_SPREAD)));}
ACT_EXT.shortOpen=v=>{const [rid,amt]=(v||'').split(':');const r=rivalById(rid);if(!r||r.tier<3)return;if(shortOf(rid)){if(typeof toast==='function')toast('You already hold a short on '+r.name+'.');return;}
  const px=sharePx(r);const a=+amt;if(!a||a<px){ui.amtMsg='That won’t short a single share ('+spx(px)+' each).';return;}
  let units=Math.floor(a/px);const maxBorrow=Math.floor(SHARES_OUT*floatOf(r)*0.4);units=Math.min(units,maxBorrow);if(units<1)return;
  const margin=Math.round(units*px*0.6);if(S.co.cash<margin){ui.amtMsg='You need '+gbp(margin)+' in cash set aside as margin to cover that short.';return;}
  /* no cash changes hands on opening — the proceeds are held against the shares you owe, so your spendable cash isn't inflated */
  S.co.shorts=S.co.shorts||{};S.co.shorts[rid]={units,openPx:px,opened:S.day};
  log('You opened a short on '+r.name+': '+units.toLocaleString()+' shares at '+spx(px)+'. No cash moves now — you bank the profit (or pay the loss) when you cover. A margin call closes you if it rises 60%.','info');
  ui.modal=null;ui.amtMsg=null;ui.amtVal=null;};
ACT_EXT.shortClose=v=>{const r=rivalById(v);const s=shortOf(v);if(!r||!s)return;const px=sharePx(r);const pl=shortPL(r,s);S.co.cash+=pl;if(pl>=0)S.m.setup=(S.m.setup||0)+pl;else S.m.other=(S.m.other||0)+(-pl);delete S.co.shorts[v];
  log('You covered your short on '+r.name+' at '+spx(px)+'. '+(pl>=0?'Profit '+gbp(pl)+'.':'Loss '+gbp(-pl)+'.'),pl>=0?'good':'bad');};

/* daily: borrow fee, margin calls, and firms that get taken over from under a short — settling only the P/L, never a gross buyback */
function shortsDaily(){
  if(!S.co||!S.co.shorts)return;
  for(const rid in S.co.shorts){const s=S.co.shorts[rid];const r=rivalById(rid);
    if(!r){const loss=Math.round(s.units*s.openPx*0.2);S.co.cash-=loss;S.m.other=(S.m.other||0)+loss;log('A firm you were shorting was taken over; the short closed at a loss of '+gbp(loss)+'.','bad');delete S.co.shorts[rid];continue;}
    const px=sharePx(r);const fee=Math.round(s.units*px*SHORT_FEE);if(fee>0){S.co.cash-=fee;S.m.other=(S.m.other||0)+fee;}
    if(px>s.openPx*1.6){const pl=shortPL(r,s);S.co.cash+=pl;S.m.other=(S.m.other||0)+Math.max(0,-pl);delete S.co.shorts[rid];log('Margin call — '+r.name+' has run 60% against your short. Force-closed at '+spx(px)+', a loss of '+gbp(-pl)+'.','bad');}
  }
}
if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);try{shortsDaily();}catch(e){}};}

/* the short-position strip on the trading view */
function shortNote(r){const s=shortOf(r&&r.id);if(!s)return '';const pl=shortPL(r,s);
  return '<div class="mkt-def '+(pl>=0?'warn':'bad')+'">Short '+s.units.toLocaleString()+' @ '+spx(s.openPx)+' · P/L if covered now <b>'+(pl>=0?'+':'')+gbp(pl)+'</b> · margin call at '+spx(s.openPx*1.6)+'</div>';}

/* ---- activism: push a firm you hold a disclosed stake in ---- */
ACT_EXT.activist=v=>{const r=rivalById(v);if(!r||ownFrac(r)<DISCLOSE)return;
  if(r.agitAt&&S.day-r.agitAt<DPM*3){if(typeof toast==='function')toast('Give it a few months between campaigns.');return;}
  r.agitAt=S.day;const roll=Math.random();const cl=v=>(typeof clamp==='function')?clamp(v,0.7,1.5):v;
  if(roll<0.4){const div=Math.round(ownUnits(r.id)*sharePx(r)*0.05);S.co.cash+=div;S.m.invest=(S.m.invest||0)+div;r.shareMood=cl((r.shareMood||1)*1.06);log('Your campaign at '+r.name+' forced a special dividend — your '+Math.round(ownFrac(r)*100)+'% took '+gbp(div)+', and the shares popped.','good');}
  else if(roll<0.7){r.shareMood=cl((r.shareMood||1)*1.04);log('Your campaign at '+r.name+' pushed the board to sharpen up. The shares firmed.','info');}
  else{S.co.rep=Math.max(0,(S.co.rep||50)-1);log('Your campaign at '+r.name+' went nowhere and made you look needlessly aggressive.','bad');}};

/* extend the short amount modal (reuses the amt dialog) */
if(typeof MODAL_EXT!=='undefined'&&MODAL_EXT.amt){const _amt=MODAL_EXT.amt;MODAL_EXT.amt=(M,x)=>{
  if(M&&M.kind==='short'){const r=rivalById(M.rid);if(!r)return null;const px=sharePx(r);
    return '<div class="dialog">'+x+'<p class="kick">Investments</p><h2>Short '+esc(r.name)+'</h2><p>Bet the price falls. No cash changes hands now — you set aside 60% of the position as margin, and you bank the profit or pay the loss when you cover. A margin call closes you out if it runs 60% against you, plus a small daily borrow fee.</p>'+
      '<p class="mut" style="font-size:.85rem;margin:0 0 8px">Price <b>'+spx(px)+'</b> · market cap <b>'+gbp(firmCap(r))+'</b> · cash <b>'+gbp(S.co.cash)+'</b></p>'+
      '<div class="mkt-chart">'+priceChartSVG(mktSeries(r))+'</div>'+
      '<div class="field"><label for="amtField">Amount to short (£)</label><input id="amtField" inputmode="numeric" autocomplete="off" placeholder="type any amount" value="'+esc(ui.amtVal||'')+'"></div>'+
      (ui.amtMsg?'<p class="note warn">'+esc(ui.amtMsg)+'</p>':'')+
      '<div class="foot2"><span class="grow"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="amtGo">Short it</button></div></div>';}
  return _amt(M,x);};}
/* route the amt dialog's confirm to shortOpen when it's a short */
if(ACT_EXT.amtGo){const _amtGo=ACT_EXT.amtGo;ACT_EXT.amtGo=()=>{const M=ui.modal;
  if(M&&M.type==='amt'&&M.kind==='short'){const el=(typeof $==='function')&&$('amtField');const raw=el?el.value:'';ui.amtVal=raw;const a=Math.floor(+(String(raw).replace(/[^0-9.]/g,''))||0);if(!a||a<=0){ui.amtMsg='Enter an amount.';return;}ACT_EXT.shortOpen(M.rid+':'+a);return;}
  return _amtGo();};}

/* short positions appear in the Investments-tab summary */
if(typeof paneInvestShares==='function'){const _pis=paneInvestShares;paneInvestShares=function(){let h=_pis.apply(this,arguments);
  const sh=(S.co&&S.co.shorts)||{};const rids=Object.keys(sh);if(!rids.length)return h;
  let rows='';for(const rid of rids){const r=rivalById(rid);if(!r)continue;const s=sh[rid];const px=sharePx(r);const pl=shortPL(r,s);
    rows+='<tr><td>'+esc(r.name)+'</td><td class="r">'+s.units.toLocaleString()+' sh</td><td class="r">'+spx(s.openPx)+'</td><td class="r">'+spx(px)+'</td><td class="r '+(pl>=0?'pos':'neg')+'">'+(pl>=0?'+':'')+gbp(pl)+'</td></tr>';}

/* warn if you sell out of your longs while a short is still open (selling shares doesn't close a short) */
if(ACT_EXT.shareSell){const _ss=ACT_EXT.shareSell;ACT_EXT.shareSell=v=>{_ss(v);
  const longs=(S.co&&S.co.shares)?Object.keys(S.co.shares).length:0;const shorts=(S.co&&S.co.shorts)?Object.keys(S.co.shorts).length:0;
  if(!longs&&shorts){if(typeof toast==='function')toast('You still have an open short — selling shares doesn’t close it.');log('Heads up: you still have '+shorts+' short position'+(shorts>1?'s':'')+' open. Selling shares doesn’t close a short — cover it in the Markets panel, or a margin call may catch you.','bad');}
};}

/* diagnostics: expose share holdings, short positions, and this month's market cash flows */
if(typeof diagReport==='function'){const _dg=diagReport;diagReport=function(){let t=_dg();
  const sh=(S.co&&S.co.shares)||{},shorts=(S.co&&S.co.shorts)||{},m=S.m||{};
  const holdings=Object.keys(sh).map(rid=>{const r=rivalById(rid);return {firm:r?r.name:rid,units:sh[rid].units,pct:Math.round(sh[rid].units/SHARES_OUT*100),paid:Math.round(sh[rid].paid),now:r?Math.round(sh[rid].units*sharePx(r)):null};});
  const shortPos=Object.keys(shorts).map(rid=>{const r=rivalById(rid);const s=shorts[rid];return {firm:r?r.name:rid,units:s.units,openPx:s.openPx,plIfCovered:r?shortPL(r,s):null};});
  return t+'\n'+JSON.stringify({shareHoldings:holdings,shortPositions:shortPos,monthSoFar:{shareSalesEtc:Math.round(m.setup||0),lossesFeesEtc:Math.round(m.other||0),dividendsInterest:Math.round(m.invest||0),branch:Math.round(m.branch||0)}});
};}

/* ============ build 102: back-fill the wider market into existing saves ============
   The market is generated once when a game starts and then lives in the save. A save
   made before the market was widened keeps its old, smaller field — genMarket only
   runs for a brand-new game. This tops an existing save up to the current target
   density, one time, and fully forms each new firm (region, name, history, stance)
   so it behaves and shows up in the market table and the share listings like any other. */
(function(){
  const TARGET=[20,16,9,6];   /* sole, small, mid, national — matches genMarket */
  function nameNewFirm(r,used){
    /* mid and national firms keep their pool names from mkRival; only the small end
       gets a region-appropriate name, the same touch nameToRegion gives a fresh game */
    if(r.tier>=2)return;
    const pl=(typeof REG_PLACES!=='undefined'&&REG_PLACES[r.region||'home'])||(typeof REG_PLACES!=='undefined'&&REG_PLACES.home);
    if(!pl)return;
    for(let i=0;i<25;i++){const n=pick(pl)+' '+pick(MKT_SUFFIX);if(!used.has(n)){r.name=n;used.add(n);return;}}
  }
  function topUp(){
    if(!S.mkt||!Array.isArray(S.mkt.r))return;
    if(S.mkt.expanded102)return;                 /* once only */
    const big=Math.max(1,active().length/300);
    const used=new Set(S.mkt.r.map(r=>r.name));
    let added=0;
    for(let t=0;t<4;t++){
      const have=S.mkt.r.filter(r=>r.tier===t).length;
      for(let i=have;i<TARGET[t];i++){
        const r=mkRival(t,t===3?big:1);
        used.add(r.name);
        r.region=(typeof spawnRegion==='function')?spawnRegion():'home';
        nameNewFirm(r,used);
        if(typeof backfill==='function')backfill(r);   /* client history for the spark line */
        if(typeof relInit==='function')relInit(r);      /* stance / trust / personality */
        S.mkt.r.push(r);
        added++;
      }
    }
    S.mkt.expanded102=true;
    if(added&&typeof log==='function')log('The local market has filled out: '+added+' more MSPs are now trading in your patch.','info');
  }
  if(typeof migrateSave==='function'){const _m=migrateSave;migrateSave=function(){_m.apply(this,arguments);try{topUp();}catch(e){}};}
})();

/* ============ build 104: life as a public company — board pay and real dividends ============
   Once you float, three things change:
   1. The board puts you on a market CEO salary that scales with the group, and pays a
      performance bonus after a good quarter. You no longer set your own pay by hand.
   2. The company declares a dividend each quarter, ~30% of the quarter's profit, and it is
      split across ALL shareholders. You receive only your stake's share; the rest genuinely
      leaves the company to the public float. (Previously you pocketed the entire pot.)
   3. The "pay yourself" panel becomes a board-package summary while public. */

/* market CEO salary, scaling with group size — roughly £150k to £700k a year */
function ceoPay(){if(!isPublic())return 0;const g=(typeof groupMRR==='function')?groupMRR():mrr();
  return clamp(Math.round((12000+g*0.03)/500)*500,12500,58000);}
function setCeoSalary(){if(!isPublic())return;const f=founderSt();if(f)f.salary=ceoPay();}

/* put the CEO straight onto the board package the moment the float completes */
if(ACT_EXT.ipoGo){const _go=ACT_EXT.ipoGo;ACT_EXT.ipoGo=v=>{_go(v);try{setCeoSalary();}catch(e){}};}
/* a save that is already public picks the package up on load */
if(typeof migrateSave==='function'){const _m=migrateSave;migrateSave=function(){_m.apply(this,arguments);try{if(isPublic()){const f=founderSt();if(f&&(f.salary||0)<ceoPay())f.salary=ceoPay();}}catch(e){}};}

/* each quarter: refresh salary, pay a bonus on a good quarter, and declare a split dividend */
if(typeof ipoQuarter==='function'){const _q=ipoQuarter;ipoQuarter=function(){
  const prev=S.co.ipo&&S.co.ipo.lastReport;
  _q.apply(this,arguments);
  const io=S.co.ipo;if(!io||S.over)return;
  const rep=io.lastReport;if(!rep||rep===prev)return;   // only when a fresh quarter has just reported
  setCeoSalary();
  const f=founderSt();
  const buffer=(typeof divBuffer==='function')?divBuffer():0;
  const oncost=(typeof ONCOST!=='undefined')?ONCOST:0.15;
  /* performance bonus — paid only after a profitable, non-declining quarter, and only if affordable */
  if(f&&rep.profitable&&(rep.delta||0)>=0){
    const gross=Math.round((f.salary||ceoPay())*(1+clamp((rep.delta||0)*4,0,2)));   // 1x to 3x monthly salary
    const withOncost=Math.round(gross*(1+oncost));
    if(gross>0&&S.co.cash-withOncost>buffer){
      const annSal=(f.salary||0)*12;
      const marg=(typeof incomeTaxNI==='function')?(incomeTaxNI(annSal+gross)-incomeTaxNI(annSal)):gross*0.45;
      const net=Math.max(0,Math.round(gross-marg));
      S.co.cash-=withOncost;S.m.sal=(S.m.sal||0)+withOncost;
      S.co.home=(S.co.home||0)+net;S.co.ceoBonus=(S.co.ceoBonus||0)+net;
      log('The board awarded you a '+gbp(gross)+' bonus for the quarter'+(net<gross?' ('+gbp(net)+' after tax)':'')+'.','good');
    }
  }
  /* quarterly dividend to ALL shareholders, ~30% of the quarter's profit, capped by a cash buffer */
  const qProfit=S.hist.slice(-3).reduce((a,h)=>a+(h.profit||0),0);
  let pot=Math.round(Math.max(0,qProfit)*0.30);
  pot=Math.min(pot,Math.max(0,Math.floor((S.co.cash-buffer)/100)*100));
  if(pot>=100){
    const stake=(typeof yourStakePct==='function')?yourStakePct():1;
    const yours=Math.round(pot*stake);const ext=pot-yours;
    const yoursNet=(typeof divNet==='function')?Math.round(divNet(yours)):yours;
    S.co.cash-=pot;S.co.divs=(S.co.divs||0)+yoursNet;
    (S.co.divLog=S.co.divLog||[]).push({d:S.day,v:yours});
    log('Quarterly dividend of '+gbp(pot)+' declared: '+gbp(yours)+' to your '+pct(stake)+' stake'+(yoursNet<yours?' ('+gbp(yoursNet)+' after tax)':'')+', '+gbp(ext)+' to the outside shareholders.','good');
  }
};}

/* manual dividends, if ever called while public, are split across shareholders too (no more pocketing the lot) */
if(ACT_EXT.dividend){const _div=ACT_EXT.dividend;ACT_EXT.dividend=v=>{
  if(!isPublic())return _div(v);
  v=+v;if(!(v>=100)||v>divRoom())return;
  const stake=(typeof yourStakePct==='function')?yourStakePct():1;
  const yours=Math.round(v*stake);const yoursNet=(typeof divNet==='function')?Math.round(divNet(yours)):yours;
  (S.co.divLog=S.co.divLog||[]).push({d:S.day,v:yours});
  S.co.cash-=v;S.co.divs=(S.co.divs||0)+yoursNet;
  const f=founderSt();if(f)f.morale=Math.min(100,f.morale+4);
  log('Dividend of '+gbp(v)+' declared: '+gbp(yours)+' to your '+pct(stake)+' stake, '+gbp(v-yours)+' to the outside shareholders.','good');
};}

/* while public, the "pay yourself" panel becomes a board-package summary */
if(typeof ownerSec==='function'){const _own=ownerSec;ownerSec=function(){
  if(!isPublic())return _own.apply(this,arguments);
  const home=(S.co.home||0)+(S.co.divs||0);const sal=ceoPay();const stake=(typeof yourStakePct==='function')?yourStakePct():1;
  let h='<div class="sec"><h3>Your board package</h3>';
  h+='<p class="lede">You’re a public-company CEO now, so the board sets your pay and the company declares dividends to every shareholder. Taken home so far: <b>'+gbp(home)+'</b>.</p>';
  h+='<div class="tiles">'+
    '<div class="tile"><span class="k">CEO salary</span><span class="v">'+gbp(sal)+'</span><small>a month · '+gbp(sal*12)+' a year, board-set</small></div>'+
    '<div class="tile"><span class="k">Bonuses paid</span><span class="v pos">'+gbp(S.co.ceoBonus||0)+'</span><small>after tax, on good quarters</small></div>'+
    '<div class="tile"><span class="k">Dividends to you</span><span class="v pos">'+gbp(S.co.divs||0)+'</span><small>your '+pct(stake)+' stake, after tax</small></div>'+
    '</div>';
  h+='<p class="mut" style="font-size:.82rem;margin-top:8px">Dividends are declared quarterly to all shareholders, about 30% of the quarter’s profit. You receive your stake’s share automatically; the rest goes to the public float. Sell down or exit from the Strategy tab.</p></div>';
  return h;
};}

/* ============ build 106: fixed-term deposits — lock cash for a better rate ============
   Instant-access savings you can pull any time. Fixed-term deposits pay more, but you
   promise not to touch the money until it matures. Interest is paid with the principal
   at the end, and counts as investment income (so it's taxed like the payout-mode
   instant-access interest). Deposit protection limits and bank failures are noted for
   a later build, not modelled yet. */
const BOND_TERMS=[{m:3,rate:SAVE_APR+0.007},{m:6,rate:SAVE_APR+0.014},{m:12,rate:SAVE_APR+0.022}];
function bondPayout(b){return Math.round(b.amount*(1+b.rate*b.term/12));}   // simple interest over the term
function bondInterest(b){return bondPayout(b)-b.amount;}
function bondsList(){return (S.co&&S.co.bonds)||[];}
function bondsLocked(){return bondsList().reduce((a,b)=>a+b.amount,0);}

ACT_EXT.bondAsk=term=>{const t=+term;if(!BOND_TERMS.some(x=>x.m===t))return;ui.amtMsg=null;ui.amtVal='';ui.modal={type:'amt',kind:'bond',term:t};};
ACT_EXT.bondOpen=v=>{const [term,amt]=(v||'').split(':');const t=+term;const a=Math.floor(+amt);const bt=BOND_TERMS.find(x=>x.m===t);
  if(!bt)return;
  if(!a||a<1000){ui.amtMsg='Fixed-term deposits start at £1,000.';return;}
  if(a>S.co.cash){ui.amtMsg='You only have '+gbp(S.co.cash)+' in cash.';return;}
  S.co.cash-=a;S.co.bonds=S.co.bonds||[];
  const b={amount:a,rate:bt.rate,term:t,start:S.day,matures:S.day+DPM*t};S.co.bonds.push(b);
  log('Locked '+gbp(a)+' away for '+t+' months at '+rpct(bt.rate)+'. It returns '+gbp(bondPayout(b))+' when it matures.','info');
  ui.modal=null;ui.amtMsg=null;ui.amtVal=null;};

/* each month, mature any deposits that have come due: principal plus interest back to cash */
function bondsMonthly(){if(!S.co||!S.co.bonds||!S.co.bonds.length)return;
  const keep=[];for(const b of S.co.bonds){
    if(S.day>=b.matures){const interest=bondInterest(b);S.co.cash+=b.amount+interest;S.m.invest=(S.m.invest||0)+interest;
      log('A '+b.term+'-month fixed-term deposit matured: '+gbp(b.amount)+' back plus '+gbp(interest)+' interest.','good');}
    else keep.push(b);}
  S.co.bonds=keep;}
if(typeof marketMonthly==='function'){const _mm=marketMonthly;marketMonthly=function(){_mm.apply(this,arguments);try{bondsMonthly();}catch(e){}};}

/* amount dialog for opening a fixed-term deposit */
if(typeof MODAL_EXT!=='undefined'&&MODAL_EXT.amt){const _amt=MODAL_EXT.amt;MODAL_EXT.amt=(M,x)=>{
  if(M&&M.kind==='bond'){const bt=BOND_TERMS.find(z=>z.m===M.term);if(!bt)return null;
    return '<div class="dialog">'+x+'<p class="kick">Investments</p><h2>Lock cash for '+M.term+' months</h2><p>Earns '+rpct(bt.rate)+' a year, better than instant access, but you can’t withdraw it until it matures. Interest is paid with the principal at the end. Only lock money you won’t need for '+M.term+' months.</p>'+
      '<p class="mut" style="font-size:.85rem;margin:0 0 8px">Cash available: <b>'+gbp(S.co.cash)+'</b></p>'+
      '<div class="field"><label for="amtField">Amount to lock (£)</label><input id="amtField" inputmode="numeric" autocomplete="off" placeholder="type any amount" value="'+esc(ui.amtVal||'')+'"></div>'+
      (ui.amtMsg?'<p class="note warn">'+esc(ui.amtMsg)+'</p>':'')+
      '<div class="foot2"><span class="grow"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="amtGo">Lock it away</button></div></div>';}
  return _amt(M,x);};}
if(ACT_EXT.amtGo){const _amtGo=ACT_EXT.amtGo;ACT_EXT.amtGo=()=>{const M=ui.modal;
  if(M&&M.type==='amt'&&M.kind==='bond'){const el=(typeof $==='function')&&$('amtField');const raw=el?el.value:'';ui.amtVal=raw;const a=Math.floor(+(String(raw).replace(/[^0-9.]/g,''))||0);if(!a||a<=0){ui.amtMsg='Enter an amount.';return;}ACT_EXT.bondOpen(M.term+':'+a);return;}
  return _amtGo();};}

/* fixed-term block on the savings section of the Invest tab */
if(typeof paneInvestSavings==='function'){const _pis=paneInvestSavings;paneInvestSavings=function(){let h=_pis.apply(this,arguments);
  const bonds=bondsList().slice().sort((a,b)=>a.matures-b.matures);
  let b='<div class="sec"><h3 style="font-size:.95rem">Fixed-term deposits</h3><p class="lede">Lock cash away for a set term and earn more than instant access, in return for a promise not to touch it until it matures.'+(bondsLocked()>0?' <b>'+gbp(bondsLocked())+'</b> locked away right now.':'')+'</p>';

function invShareTotals(){const sh=(S.co&&S.co.shares)||{};let val=0,paid=0,n=0,div=0;

  return {val,paid,n,div};}
function invSaveTotals(){const bal=(S.co&&S.co.savings)||0;const dep=(typeof bondsLocked==='function')?bondsLocked():0;return {bal,dep};}
function invShortTotals(){const so=(S.co&&S.co.shorts)||{};let pl=0,n=0;for(const rid in so){const r=rivalById(rid);if(!r)continue;pl+=shortPL(r,so[rid]);n++;}return {pl,n};}
function portValueNow(){const sh=invShareTotals();const st=(typeof investPerf==='function')?investPerf():{value:0};const sv=invSaveTotals();const so=invShortTotals();

/* ============ build 109: a live daily market for the firms you hold a stake in ============
   Public nationals already have a daily-walking share price with charts and timeframes.
   Minority stakes were valued in monthly steps off the firm's size. This gives each staked
   firm the same treatment: a daily sentiment walk around its fundamental value, a daily
   price series and monthly candles, a chart with timeframes, and a live value that selling
   and the portfolio both use. Buying is still at the fundamental (no way to move a private
   valuation by buying more of a fixed 20%). */

/* fundamental stake value, wobbled by a daily sentiment tick */
function stakeValLive(r){const base=(typeof stakePrice==='function')?stakePrice(r):0;return Math.max(500,Math.round(base*((r&&r.stakeTick)||1)/100)*100);}
function stakedFirms(){return (typeof rivals==='function')?rivals().filter(r=>r.stake):[];}

/* daily: walk each staked firm's sentiment, record the value, roll a monthly candle */
function stakesDaily(){
  for(const r of stakedFirms()){
    if(r.stakeTick==null){r.stakeTick=1;}
    let t=r.stakeTick;
    t+=(1-t)*0.04;                                                                   // mean-revert to fundamental
    t*=1+(typeof rnd==='function'?rnd(-0.025,0.025):(Math.random()*2-1)*0.025);      // daily noise
    if(Math.random()<0.03)t*=1+(Math.random()*2-1)*0.08;                             // the odd bigger move
    r.stakeTick=(typeof clamp==='function')?clamp(t,0.7,1.4):Math.max(0.7,Math.min(1.4,t));
    const v=stakeValLive(r);
    (r.stakeD=r.stakeD||[]).push(v);if(r.stakeD.length>280)r.stakeD.shift();
    if(S.day%DPM===0){const m=r.stakeD.slice(-DPM);if(m.length){(r.stakeMC=r.stakeMC||[]).push({o:m[0],h:Math.max.apply(null,m),l:Math.min.apply(null,m),c:m[m.length-1]});if(r.stakeMC.length>150)r.stakeMC.shift();}}
  }
}
if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);try{stakesDaily();}catch(e){}};}

function stakeSeries(r){const v=stakeValLive(r);const s=(r&&r.stakeD&&r.stakeD.length)?r.stakeD.slice():[v];if(s[s.length-1]!==v)s.push(v);return s;}
function stakeChartData(r){const tf=(typeof resolveTF==='function')?resolveTF():{src:'daily',days:126};
  if(tf.src==='monthly'){let mc=(r.stakeMC||[]).slice();if(tf.months)mc=mc.slice(-tf.months);if(mc.length>=2)return mc.map(c=>c.c);}
  const d=(r.stakeD||[]).slice(tf.days?-tf.days:0);return d.length?d:stakeSeries(r);}

/* seed a little history when a stake is bought, so the chart isn't blank */
function seedStakeHist(r){if(!r||!r.stake)return;r.stakeTick=1;const base=(typeof stakePrice==='function')?stakePrice(r):1000;let t=1+(typeof rnd==='function'?rnd(-0.06,0.06):0);const d=[];
  for(let i=0;i<28;i++){t+=(1-t)*0.05;t*=1+(typeof rnd==='function'?rnd(-0.02,0.02):0);d.push(Math.max(500,Math.round(base*t/100)*100));}
  d.push(stakeValLive(r));r.stakeD=d;}
if(typeof RACTS!=='undefined'&&RACTS.invest&&RACTS.invest.go){const _go=RACTS.invest.go;RACTS.invest.go=r=>{_go(r);try{seedStakeHist(r);}catch(e){}};}

/* the portfolio and the sale both use the live market value */
if(typeof holdings==='function'){const _h=holdings;holdings=function(){const o=_h();for(const x of o)if(x&&x.kind==='stake'){const r=rivalById(x.rid);if(r)x.value=stakeValLive(r);}return o;};}
if(typeof RACTS!=='undefined'&&RACTS.invest){RACTS.invest.end=r=>{const v=Math.round(stakeValLive(r));S.co.cash+=v;S.m.setup=(S.m.setup||0)+v;S.co.capYr=(S.co.capYr||0)+v;if(typeof remember==='function')remember(r,'You sold your stake back.');delete r.stake;log('You sold your stake in '+r.name+' for '+gbp(v)+'.','info');};}

ACT_EXT.stakeSel=v=>{if(S&&S.co)S.co.stakeSel=v;};

  const head='<div class="mkt-cap"><span style="flex:1;min-width:0"><b>'+esc(r.name)+'</b> <span class="mut">'+gbp(v)+'</span> <span class="'+(chg>=0?'pos':'neg')+'" style="font-size:.8rem">'+(chg>=0?'+':'')+Math.round(chg*100)+'%</span> <span class="mut" style="font-size:.76rem">· 20% stake · paid '+gbp(paid)+' · <span class="'+(gain>=0?'pos':'neg')+'">'+(gain>=0?'+':'')+gbp(gain)+'</span></span></span>'+

  const chart='<div class="mkt-chart">'+((typeof priceChartSVG==='function')?priceChartSVG(stakeChartData(r),r.stake?r.stake.p:0):'')+'</div>';
  const dividend=Math.round(rSeats(r)*45*0.1*0.2);

  return '<div class="mkt-body"><div id="mktMenu" class="mkt-menu">'+menu+'</div><div class="mkt-main">'+head+tfRow+chart+info+'<div style="margin-top:6px"><button class="btn sm" data-act="rivalCard" data-v="'+r.id+'">Their card</button></div></div></div>';
};

function sellPxOf(r){const imp=(typeof shareImpact==='function'?shareImpact(r):1)||1;return Math.max(0.01,Math.round(sharePx(r)/imp*(1-MKT_SPREAD)*100)/100);}
