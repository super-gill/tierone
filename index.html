/* rescale legacy saves: the old model split a firm into 1,000 shares, the new one into a million.
   Multiply old holdings and shorts by the factor (value is preserved, since price/share drops the
   same amount) and divide the stored per-share prices, so nothing jumps when an old save loads. */
(function(){
  const FACTOR=SHARES_OUT/1000;
  function rescaleLegacy(){
    if(!S||!S.co)return;
    if(S.co.shareScale!=null)return;                 // already on the new scale (or a new game)
    const sh=S.co.shares||{};for(const id in sh){if(sh[id])sh[id].units=Math.round((sh[id].units||0)*FACTOR);}
    const so=S.co.shorts||{};for(const id in so){if(so[id]){so[id].units=Math.round((so[id].units||0)*FACTOR);so[id].openPx=(so[id].openPx||0)/FACTOR;}}
    if(typeof rivals==='function')for(const r of rivals()){
      if(r.def&&r.def.knight&&r.def.knight.price)r.def.knight.price=r.def.knight.price/FACTOR;
      if(Array.isArray(r.pxDaily))r.pxDaily=r.pxDaily.map(x=>x/FACTOR);
      if(Array.isArray(r.pxMonthlyC))r.pxMonthlyC=r.pxMonthlyC.map(c=>({o:c.o/FACTOR,h:c.h/FACTOR,l:c.l/FACTOR,c:c.c/FACTOR}));
    }
    S.co.shareScale=SHARES_OUT;
  }
  if(typeof migrateSave==='function'){const _m=migrateSave;migrateSave=function(){_m.apply(this,arguments);try{rescaleLegacy();}catch(e){}};}
  if(typeof newState==='function'){const _n=newState;newState=function(){const r=_n.apply(this,arguments);try{if(S&&S.co)S.co.shareScale=SHARES_OUT;}catch(e){}return r;};}
})();

/* ============ build 112: an Opportunities tab in the markets window ============
   A glanceable, always-there view of what's in play: open tenders first, then the leads and
   cross-sells in the pipeline. Late on, account managers write and send most proposals, so the
   list can get long — a filter keeps it to what needs you (sign-offs), the big ones, or the
   likely ones, and the list is capped with a link through to the full Pipeline tab. It reads
   the same data as the Pipeline and Tenders tabs under Sales & market, which are unchanged. */

const OPP_CAP=10;                 // most proposals shown here before the "+N more" link
function dealVal(d){return d.kind==='project'?Math.round((d.proj&&d.proj.value||0)/12):Math.round(dealMRR(d,1));}
function dealWin(d){if(d.stage==='pitched')return d.win||0;try{const E=(typeof dealEstimate==='function')?dealEstimate(d,1):null;if(E&&E.pct!=null)return E.pct;}catch(e){}return (typeof winChance==='function')?winChance(d,1):0;}
function oppNeedsMe(d){return !!d.draft||!d.drafter;}   // ready to sign off, or nobody's writing it yet
ACT_EXT.oppFilter=v=>{if(S&&S.co)S.co.oppFilter=v;};

/* actionable-item alerts, for the notification dots on the Tenders / Opportunities tabs */
function oppTenderAlert(){const T=(typeof tenders==='function')?tenders():{open:[]};return (T.open||[]).some(x=>x.state==='open'&&!x.bid);}
function oppPipeAlert(){return (S.deals||[]).some(d=>d.stage==='open'&&oppNeedsMe(d));}

/* ---- Tenders: open public and framework tenders ---- */
function invTenders(){
  const T=(typeof tenders==='function')?tenders():{open:[]};
  const tOpen=(T.open||[]).filter(x=>x.state==='open').sort((a,b)=>(b.opened||0)-(a.opened||0));
  const tval=x=>Math.round((typeof tenderVal==='function'?tenderVal(x):(typeof tenderValue==='function'?tenderValue(x):0)));
  let h='<div class="sec" style="margin:0"><h3 style="font-size:.95rem">Tenders <button class="linkbtn" style="font-size:.76rem;font-weight:600" data-act="tab" data-v="tenders">Full tab →</button></h3><p class="lede">Public and framework tenders open to bid. Act here, or open the Tenders tab for the detail.</p>'+
    '<div class="tiles"><div class="tile"><span class="k">Open</span><span class="v">'+tOpen.length+'</span><small>to bid</small></div><div class="tile"><span class="k">Not yet bid</span><span class="v">'+tOpen.filter(x=>!x.bid).length+'</span><small>need a decision</small></div></div></div>';
  h+='<div class="sec" style="margin:10px 0 0">';
  if(tOpen.length){
    h+='<ul class="list">'+tOpen.map(x=>{
      const R=(typeof reqList==='function')?reqList(x):[];const miss=R.filter(r=>!r.ok).length;
      const rname=(typeof reg==='function'&&x.region)?reg(x.region).t:'';
      const tag=x.framework?(x.years+'yr framework'):x.callOff?'call-off':x.mega?'MAJOR':((typeof TENDER_SIZES!=='undefined'&&TENDER_SIZES[x.size])?TENDER_SIZES[x.size].t:'');
      return '<li class="item click" data-act="tender" data-v="'+x.id+'"><span><b>'+esc(x.name)+'</b> <span class="mut">'+(tag?tag+' · ':'')+x.seats+' users · '+x.term+'m'+(rname?' · '+rname:'')+'</span></span><span class="r">~'+gbp(tval(x))+'/mo</span><span class="sub">'+(x.bid?'<b class="pos">Bid in.</b> ':'')+'Closes '+dLabel(x.close)+' · '+(R.length?(miss?'<span class="neg">'+miss+' of '+R.length+' requirements to meet</span>':'<span class="pos">you meet every requirement</span>'):'no set requirements')+'</span></li>';
    }).join('')+'</ul>';
  } else h+='<p class="empty">No open tenders right now. New ones appear every few weeks.</p>';
  return h+'</div>';
}

/* ---- Opportunities: the leads and cross-sells in your pipeline ---- */
function invOpps(){
  const deals=(S.deals||[]);
  const open=deals.filter(d=>d.stage==='open');
  const sent=deals.filter(d=>d.stage==='pitched');
  const needs=open.filter(oppNeedsMe).length;

  let h='<div class="sec" style="margin:0"><h3 style="font-size:.95rem">Opportunities</h3><p class="lede">Leads and cross-sells in your pipeline. Sign off proposals here, or open the Pipeline tab for the detail.</p>'+
    '<div class="tiles"><div class="tile"><span class="k">To quote</span><span class="v">'+open.length+'</span><small>in the pipeline</small></div>'+
    '<div class="tile"><span class="k">Needs you</span><span class="v'+(needs?' neg':'')+'">'+needs+'</span><small>to sign off or start</small></div>'+
    '<div class="tile"><span class="k">Awaiting</span><span class="v">'+sent.length+'</span><small>proposals out</small></div></div></div>';

  /* ---- proposals, with a filter and a cap so the list stays manageable ---- */
  const filt=(S.co&&S.co.oppFilter)||'all';
  const pass=d=>filt==='signoff'?oppNeedsMe(d):filt==='value'?dealVal(d)>=750:filt==='likely'?dealWin(d)>=0.5:true;
  const filtered=open.filter(pass).sort((a,b)=>dealVal(b)-dealVal(a));
  const shown=filtered.slice(0,OPP_CAP),more=filtered.length-shown.length;
  const chips=[['all','All'],['signoff','Needs me'],['value','Big'],['likely','Likely']]
    .map(c=>'<button data-act="oppFilter" data-v="'+c[0]+'" aria-pressed="'+(filt===c[0])+'">'+c[1]+'</button>').join('');
  h+='<div class="sec" style="margin:10px 0 0"><h3 style="font-size:.92rem">Pipeline <button class="linkbtn" style="font-size:.76rem;font-weight:600" data-act="tab" data-v="sales">Pipeline →</button></h3>'+
    '<div class="seg" style="margin:0 0 8px">'+chips+'</div>';
  if(!open.length)h+='<p class="empty">Nothing in the pipeline. New leads and cross-sell chances turn up here.</p>';
  else if(!shown.length)h+='<p class="empty">Nothing matches this filter. Your account managers are handling the rest.</p>';
  else h+=(typeof dealRow==='function'?'<ul class="list">'+shown.map(dealRow).join('')+'</ul>':'')+
    (more>0?'<p class="mut" style="font-size:.8rem;margin:6px 0 0">and '+more+' more. <button class="linkbtn" data-act="tab" data-v="sales">See all in the Pipeline →</button></p>':'');
  h+='</div>';

  if(sent.length&&typeof dealRow==='function'){
    const sShown=sent.slice().sort((a,b)=>dealVal(b)-dealVal(a)).slice(0,6),sMore=sent.length-sShown.length;
    h+='<div class="sec" style="margin:10px 0 0"><h3 style="font-size:.92rem">Waiting to hear back</h3><ul class="list">'+sShown.map(dealRow).join('')+'</ul>'+
      (sMore>0?'<p class="mut" style="font-size:.8rem;margin:6px 0 0">and '+sMore+' more out with clients.</p>':'')+'</div>';
  }
  return h;
}

/* ============ build 115: market pricing research ============
   Pricing was set on the Stack tab with almost no view of what the market charges. This adds a
   commissioned market survey: pay for it and you see the going rate and a competitor price band
   for each service, and where your own list price sits. It's a snapshot — the market drifts as
   the price index rises and rivals shift, so it ages over about a year and wants refreshing.
   Sits on the Stack tab, right above your catalogue, so you research and price in one place. */

function commissionCost(){return Math.round(clamp(2500+(typeof mrr==='function'?mrr():0)*0.02,2500,12000)/100)*100;}
function resFresh(){const R=S.co&&S.co.res;if(!R)return 0;return clamp(1-(S.day-R.day)/(DPM*12),0,1);}
function resWord(){if(!(S.co&&S.co.res))return 'none';const f=resFresh();return f>0.66?'fresh':f>0.33?'aging':'stale';}
/* rival price ratios (1.0 = market) split into a low / typical / high band */
function rivalPricePctls(){const rs=(typeof rivals==='function')?rivals().map(r=>r.price).filter(x=>x>0).sort((a,b)=>a-b):[];
  if(rs.length<3)return {r25:0.85,r50:1,r75:1.15};
  const q=p=>rs[Math.min(rs.length-1,Math.floor(p*rs.length))];
  return {r25:q(0.25),r50:q(0.5),r75:q(0.75)};}
/* the market rate for a service as the survey snapshot saw it */
function resRef(k){const R=S.co&&S.co.res;const idx=R?R.idx:((S.mktIdx)||1);const base=(SVC[k].price||0)*(k==='m365'?(S.vend.dist.pm||1):1);return base*((k==='support'||k==='security')?idx:1);}
/* going rate = the market reference; the competitor band is the spread of rival prices around it */
function resBand(k){const R=S.co&&S.co.res;if(!R||!SVC[k]||!SVC[k].price)return null;const mid=resRef(k);return {lo:mid*R.r25,mid:mid,hi:mid*R.r75};}

ACT_EXT.commissionRes=()=>{const c=commissionCost();if((S.co.cash||0)<c){if(typeof toast==='function')toast('You can’t afford the '+gbp(c)+' survey right now.');return;}
  S.co.cash-=c;S.m.other=(S.m.other||0)+c;
  const P=rivalPricePctls();
  S.co.res={day:S.day,idx:S.mktIdx||1,r25:P.r25,r50:P.r50,r75:P.r75};
  log('You commissioned a market pricing survey for '+gbp(c)+'. The findings are on the Stack tab.','info');};

function marketPricingSec(){
  const R=S.co&&S.co.res;const cost=commissionCost();
  let h='<div class="sec"><h3>Market pricing</h3>';
  if(!R){
    h+='<p class="lede">Right now you set prices blind. A market survey shows the going rate and the spread of competitor prices for each service, and where your list price sits — so you can price to win volume or to hold margin on purpose, rather than guess.</p>'+
      '<div class="row"><button class="btn" data-act="commissionRes">Commission a market survey · '+gbp(cost)+'</button><span class="mut" style="font-size:.8rem">A one-off study. It ages as the market moves, so refresh it every year or so.</span></div></div>';
    return h;
  }
  const f=resFresh();const fw=resWord();const fcls=f>0.66?'pos':f>0.33?'wrn':'neg';
  h+='<p class="lede">Survey from '+((typeof dLabel==='function')?dLabel(R.day):'recently')+', <span class="'+fcls+'">'+fw+'</span>'+(f<=0.33?'. The market has moved on since — worth refreshing.':'.')+' The going rate, the competitor band, and where your list price sits.</p>';
  h+='<table><thead><tr><th>Service</th><th class="r">Competitor band</th><th class="r">Going rate</th><th class="r">You</th><th>Position</th></tr></thead><tbody>';
  for(const k of SVC_ORDER){const B=resBand(k);if(!B)continue;const you=S.price[k]||0;const ratio=B.mid?you/B.mid:1;const pos=(typeof priceWord==='function')?priceWord(ratio):'';
    const pcls=ratio<0.9?'pos':ratio>1.05?'neg':'';
    h+='<tr><td>'+SVC[k].name+'</td><td class="r mut">£'+B.lo.toFixed(2)+'–£'+B.hi.toFixed(2)+'</td><td class="r">£'+B.mid.toFixed(2)+'</td><td class="r"><b>£'+you.toFixed(2)+'</b></td><td class="'+pcls+'">'+pos+'</td></tr>';}
  h+='</tbody></table>';
  const above=SVC_ORDER.filter(k=>{const B=resBand(k);return B&&B.mid&&(S.price[k]||0)/B.mid>1.05;});
  const below=SVC_ORDER.filter(k=>{const B=resBand(k);return B&&B.mid&&(S.price[k]||0)/B.mid<0.9;});
  const parts=[];
  if(above.length)parts.push('above market on '+above.map(k=>SVC[k].short.toLowerCase()).join(', ')+' — fatter margin, but you’ll lose price-sensitive work');
  if(below.length)parts.push('keen on '+below.map(k=>SVC[k].short.toLowerCase()).join(', ')+' — you win more but leave margin on the table');
  h+='<p class="note'+(above.length?' warn':'')+'">'+(parts.length?'You’re '+parts.join('; ')+'.':'You’re priced about market across the board.')+' Adjust your list prices in the catalogue below.</p>';
  h+='<div class="row" style="margin-top:6px"><button class="btn sm" data-act="commissionRes">Refresh the survey · '+gbp(cost)+'</button></div></div>';
  return h;
}

/* drop the market-pricing panel in above the catalogue on the Stack tab */
if(typeof paneStack==='function'){const _ps=paneStack;paneStack=function(){let h=_ps.apply(this,arguments);
  const anchor='<div class="sec"><h3>Your catalogue</h3>';
  if(h.indexOf(anchor)>=0)h=h.replace(anchor,marketPricingSec()+anchor);else h+=marketPricingSec();
  return h;};}

/* ============ build 116: filters on the Operations > Clients list ============ */
ACT_EXT.clientFilter=v=>{if(S&&S.co)S.co.clientFilter=v;};

/* ============ build 119: portfolio health notes on the Investments overview ============
   The Investments overview showed the numbers but never said anything about them. This adds a
   short "Worth a look" section that flags weak or losing holdings and points to where you'd act:
   stakes in shrinking firms or down on cost, shares underwater, shorts running against you, and
   idle cash that would earn more on deposit. When nothing looks weak it says so, and names your
   strongest holding. Hints only, no automation. */

function invWeakNotes(){
  const notes=[];const push=(s,t)=>notes.push({s,t});
  const apr=(typeof SAVE_APR!=='undefined')?SAVE_APR:0.038;

  /* minority stakes */
  const P=(typeof investPerf==='function')?investPerf():{h:[]};
  for(const x of (P.h||[])){
    const r=rivalById(x.rid);if(!r)continue;
    const gain=x.value-x.paid,pctg=x.paid?gain/x.paid:0,yld=x.value?x.monthly*12/x.value:0;
    const shrinking=r.trend<0;
    if(shrinking&&gain<0)
      push(3,'<b>'+esc(r.name)+'</b> is losing clients and your stake is down '+gbp(-gain)+' ('+Math.round(-pctg*100)+'%). The dividend tends to follow. You can sell from its card on the Market tab.');
    else if(shrinking)
      push(2,'<b>'+esc(r.name)+'</b> is shrinking. The stake is still up, but its value and the '+gbp(x.monthly)+'/mo dividend usually slide with the client base. Worth watching, or selling into strength.');
    else if(pctg<=-0.12)
      push(2,'Your stake in <b>'+esc(r.name)+'</b> is down '+gbp(-gain)+' ('+Math.round(-pctg*100)+'%).');
    else if(yld>0&&yld<apr&&gain<=0)
      push(1,'<b>'+esc(r.name)+'</b> yields about '+Math.round(yld*100)+'% and is not growing, less than the '+rpct(apr)+' cash earns on deposit. The money may work harder elsewhere.');
  }

  /* public shares */
  const sh=(S.co&&S.co.shares)||{};
  for(const rid in sh){
    const r=rivalById(rid);if(!r)continue;const u=sh[rid].units;if(!u)continue;
    const val=Math.round(u*sharePx(r)),paid=sh[rid].paid,gain=val-paid,pctg=paid?gain/paid:0;
    const px=r.pxDaily||[];const dir=(px.length>=6)?(px[px.length-1]-px[px.length-6]):(r.trend||0);
    if(pctg<=-0.2)
      push(3,'You are down '+gbp(-gain)+' ('+Math.round(-pctg*100)+'%) on <b>'+esc(r.name)+'</b>'+(dir<0?', and it is still sliding':'')+'. You can trim or exit it in the Markets panel under Shares.');
    else if(pctg<=-0.08)
      push(1,'<b>'+esc(r.name)+'</b> is down '+Math.round(-pctg*100)+'% on what you paid'+(dir<0?' and still falling':'')+'.');
    else if(dir<0&&gain>0)
      push(1,'<b>'+esc(r.name)+'</b> has turned down lately. Still in profit, but you might lock some of it in.');
  }

  /* short positions */
  const so=(S.co&&S.co.shorts)||{};
  for(const id in so){
    const r=rivalById(id);if(!r)continue;const s=so[id];const px=sharePx(r);
    const adverse=s.openPx?px/s.openPx-1:0;const pl=(typeof shortPL==='function')?shortPL(r,s):0;
    if(adverse>=0.4)
      push(3,'Your short on <b>'+esc(r.name)+'</b> is '+Math.round(adverse*100)+'% against you (P/L '+gbp(pl)+'). A margin call closes it at +60%. Consider covering in the Markets panel.');
    else if(pl<0&&adverse>=0.2)
      push(2,'Your short on <b>'+esc(r.name)+'</b> is underwater ('+gbp(pl)+') and moving the wrong way.');
  }

  /* idle cash */
  const sv=(typeof invSaveTotals==='function')?invSaveTotals():{bal:0,dep:0};
  if(sv.bal>=25000&&sv.dep<=sv.bal*0.25)
    push(0,gbp(Math.round(sv.bal))+' is sitting in instant savings. If you will not need it for a few months, a fixed-term deposit pays a little more.');

  notes.sort((a,b)=>b.s-a.s);
  return notes;
}

/* the strongest holding, for the all-clear case */
function invStrongest(){
  let best=null;
  const P=(typeof investPerf==='function')?investPerf():{h:[]};
  for(const x of (P.h||[])){if(x.paid<=0)continue;const p=(x.value-x.paid)/x.paid;if(!best||p>best.p)best={name:x.name,p};}
  const sh=(S.co&&S.co.shares)||{};
  for(const rid in sh){const r=rivalById(rid);if(!r||!sh[rid].units)continue;const paid=sh[rid].paid;if(paid<=0)continue;const val=sh[rid].units*sharePx(r);const p=(val-paid)/paid;if(!best||p>best.p)best={name:r.name,p};}
  return best;
}

function invNotesSec(){
  const riskHolds=((S.co&&S.co.shares&&Object.keys(S.co.shares).some(k=>S.co.shares[k].units>0))||
    ((typeof investPerf==='function')&&(investPerf().h||[]).length>0)||
    (S.co&&S.co.shorts&&Object.keys(S.co.shorts).length>0));
  const notes=invWeakNotes();
  if(!notes.length){
    if(!riskHolds)return '';
    const b=invStrongest();
    return '<div class="sec"><h3 style="font-size:.95rem">Worth a look</h3><p class="mut" style="font-size:.84rem;margin:0">Nothing in the portfolio looks weak right now'+(b&&b.p>0.05?'. Your strongest is <b>'+esc(b.name)+'</b>, up '+Math.round(b.p*100)+'%':'')+'.</p></div>';
  }
  const cls=s=>s>=3?'neg':s>=2?'wrn':'mut';
  const rows=notes.slice(0,4).map(n=>'<li class="item" style="grid-template-columns:1fr"><span class="sub '+cls(n.s)+'" style="font-size:.84rem;line-height:1.4">'+n.t+'</span></li>').join('');
  return '<div class="sec"><h3 style="font-size:.95rem">Worth a look</h3><p class="lede" style="margin:0 0 6px">Holdings that are losing money, slipping, or working too hard for too little. Hints, not instructions.</p><ul class="list">'+rows+'</ul></div>';
}

/* append the notes as a sibling section under the portfolio overview */
if(typeof invOverview==='function'){const _io=invOverview;invOverview=function(){let h=_io.apply(this,arguments);try{h+=invNotesSec();}catch(e){}return h;};}

/* ============ build 121: save plays for at-risk clients ============
   Retention used to be one button ("10% off to stay") that only appeared after a client
   served notice. This adds a Save-this-account modal, available whenever a client is at risk
   (satisfaction under 55) or serving notice, with three levers that pull in different ways:
     - Retention visit: your time. Biggest, most durable lift (trust as well as satisfaction).
     - Service credit: a one-off cash goodwill payment. No permanent margin loss.
     - Price cut: 10% off for good. Blunt, immediate, and it costs you every month after.
   None is a guaranteed save: a deeply unhappy client needs more than one, or the underlying
   problem fixed. An "ending" notice (bought out, won by a rival, after an audit or breach) is
   structural and these cannot reverse it, which the modal says plainly. */

function saveAtRisk(c){return !!c&&(c.notice!=null||c.sat<55);}
function saveCreditAmt(c){return Math.max(200,Math.round(clientMRR(c)/10)*10);}
function saveDiplomat(){return S.staff.some(s=>s.role==='sdm'&&present(s)&&hasT(s,'diplomat'));}
/* withdraw an unhappy notice immediately if satisfaction has recovered enough */
function saveRecheck(c){if(c.notice!=null&&!c.ending){const th=saveDiplomat()?52:62;if(c.sat>=th){c.notice=null;log(c.name+' has withdrawn their notice.','good');return true;}}return false;}
function saveVisitCD(c){return Math.max(0,DPM-(S.day-(c.saveAt==null?-999:c.saveAt)));}
function saveCreditCD(c){return Math.max(0,DPM-(S.day-(c.creditAt==null?-999:c.creditAt)));}

ACT_EXT.savePlay=v=>{const id=v||(ui.modal&&ui.modal.id);if(C(id))ui.modal={type:'savePlay',id};};

ACT_EXT.retainVisit=v=>{const c=C(v||(ui.modal&&ui.modal.id));if(!c)return;
  if(diaryFull()){toast('Your diary is full. Try again in a day or two.');return;}
  if(saveVisitCD(c)>0){toast('You saw '+c.name+' recently. Give it a little time.');return;}
  S.co.busy=(S.co.busy||0)+6;c.saveAt=S.day;
  const dip=saveDiplomat()?1.15:1;const hostile=c.trust<20?0.85:1;
  const dsat=Math.round(14*dip*hostile),dtr=Math.round(12*hostile);
  c.sat=Math.min(100,c.sat+dsat);c.trust=Math.min(100,c.trust+dtr);
  const saved=saveRecheck(c);
  log('You spent a day with '+c.name+' rebuilding the relationship. Satisfaction +'+dsat+', trust +'+dtr+'.'+(saved?'':' '+(c.notice!=null?'Not enough on its own yet.':'')),'event');
  ui.modal={type:'client',id:c.id};};

ACT_EXT.serviceCredit=v=>{const c=C(v||(ui.modal&&ui.modal.id));if(!c)return;
  if(saveCreditCD(c)>0){toast('You already credited '+c.name+' recently.');return;}
  const amt=saveCreditAmt(c);
  if(S.co.cash-amt<-OD_LIMIT){toast('Not enough cash for a '+gbp(amt)+' credit right now.');return;}
  spend(amt);c.creditAt=S.day;
  c.sat=Math.min(100,c.sat+18);c.trust=Math.min(100,c.trust+5);
  const saved=saveRecheck(c);
  log('You credited '+c.name+' '+gbp(amt)+' as a goodwill gesture. Satisfaction +18.'+(saved?'':''),'event');
  ui.modal={type:'client',id:c.id};};

ACT_EXT.saveDiscount=v=>{const c=C(v||(ui.modal&&ui.modal.id));if(!c)return;
  for(const k in c.svc)c.svc[k].pm*=0.9;
  c.sat=Math.min(100,c.sat+22);c.trust=Math.min(100,c.trust+4);
  saveRecheck(c);
  log('You offered '+c.name+' 10% off, for good. Satisfaction +22.','event');
  ui.modal={type:'client',id:c.id};};

/* a late counter-offer to win back a client a rival poached */
function counterChance(c){return clamp(0.55+c.trust/250+c.sat/300,0.4,0.9);}
ACT_EXT.counterOffer=v=>{const c=C(v||(ui.modal&&ui.modal.id));if(!c||c.why!=='rival'||c.counterTried)return;
  c.counterTried=true;const cut=c.rivalCut||12;const by=c.rivalBy||'their new supplier';
  if(Math.random()<counterChance(c)){
    for(const k in c.svc)c.svc[k].pm*=1-cut/100;
    c.notice=null;c.ending=false;c.why=null;c.sat=Math.min(100,c.sat+5);c.trust=Math.min(100,c.trust+4);
    if(c.term>1)c.termEnd=Math.max(c.termEnd||0,S.day+c.term*DPM);
    log('You matched '+by+'’s price and won '+c.name+' back, at '+cut+'% less a month from now on.','good');
  }else{

/* ============ build 125: savings buffer + a grace window before the bank ends it ============
   Replaces the old one-click fire sale. Two changes:
   1. Instant savings now auto-cover the current account, so a buffer you keep on purpose is
      actually used before you ever hit the overdraft. Toggle in the savings section.
   2. When savings is gone and you are still over the limit, the bank gives you a grace window
      instead of folding you. The game pauses, and you sell whatever you like at full price
      through the normal Markets/Savings screens. The demand clears the moment you are back
      within the limit. An itemised "sell just enough" option is there as a fallback, and it
      logs every line so you always know what went. All your liquid assets count now:
      savings, fixed-term deposits, public shares, minority stakes and branches. */

const DEMAND_DAYS=14;
const survived=()=>S.co.cash>-OD_LIMIT;

/* everything you could turn into cash in a hurry, at rough forced-sale prices */
function liquidAssets(){
  const lines=[];let total=0;const add=(k,what,v)=>{if(v>0){lines.push({k,what,v});total+=v;}};
  add('savings','Instant savings',Math.round(S.co.savings||0));
  if(typeof bondsLocked==='function')add('deposits','Fixed-term deposits (broken early)',Math.round(bondsLocked()));
  if(S.co.shares)for(const rid in S.co.shares){const r=rivalById(rid);const hd=S.co.shares[rid];if(!r||!hd.units)continue;add('share:'+rid,'Shares in '+r.name,Math.round(hd.units*sharePx(r)*0.97));}
  if(typeof rivals==='function')for(const r of rivals())if(r.stake&&typeof stakePrice==='function')add('stake:'+r.id,'Stake in '+r.name,Math.round(stakePrice(r)*0.85));
  if(typeof branches==='function')for(const b of branches())add('branch:'+b.id,'The '+b.name,Math.round((typeof brValue==='function'?brValue(b):0)*0.8));
  return {total,lines};
}
function bankRescueAvailable(){const fs=liquidAssets().total;return fs>0&&(S.co.cash+fs)>-OD_LIMIT;}

/* sell just enough, best value first, at a distress discount; logs every line */
function autoLiquidate(target){
  target=target||0;const need=()=>target-S.co.cash;
  if(need()<=0)return;
  // 1) instant savings, at par
  if(S.co.savings>0&&need()>0){const d=Math.min(S.co.savings,need());S.co.savings-=d;S.co.cash+=d;log('Drew '+gbp(Math.round(d))+' from savings.','event');}
  // 2) break fixed-term deposits, principal back
  if(S.co.bonds&&S.co.bonds.length){for(const b of S.co.bonds.slice()){if(need()<=0)break;const amt=b.amount;S.co.cash+=amt;S.co.bonds.splice(S.co.bonds.indexOf(b),1);log('Broke a '+gbp(Math.round(amt))+' fixed-term deposit early (forfeited the interest).','event');}}
  // 3) public shares, ~97% of market, partial to the amount needed
  if(S.co.shares)for(const rid in S.co.shares){if(need()<=0)break;const r=rivalById(rid);const hd=S.co.shares[rid];if(!r||!hd.units)continue;const px=sharePx(r)*0.97;const want=Math.min(hd.units,Math.ceil(need()/px));const proceeds=Math.round(want*px);const back=Math.round(hd.paid*(want/hd.units));hd.units-=want;hd.paid=Math.max(0,hd.paid-back);S.co.cash+=proceeds;S.co.capYr=(S.co.capYr||0)+proceeds;if(hd.units<=0)delete S.co.shares[rid];log('Sold '+want.toLocaleString()+' shares in '+r.name+' for '+gbp(proceeds)+'.','event');}
  // 4) minority stakes, 85%
  if(typeof rivals==='function')for(const r of rivals().slice()){if(need()<=0)break;if(r.stake&&typeof stakePrice==='function'){const v=Math.round(stakePrice(r)*0.85);S.co.cash+=v;S.co.capYr=(S.co.capYr||0)+v;delete r.stake;log('Sold your stake in '+r.name+' for '+gbp(v)+'.','event');}}
  // 5) branches, 80%, smallest first
  if(typeof branches==='function'){const bs=branches().slice().sort((a,b)=>brValue(a)-brValue(b));for(const b of bs){if(need()<=0)break;const v=Math.round(brValue(b)*0.8);S.co.cash+=v;S.co.capYr=(S.co.capYr||0)+v;branches().splice(branches().indexOf(b),1);log('Sold the '+b.name+' for '+gbp(v)+'.','event');}}
}

function bankFold(){S.over={mi:monthOf(S.day),peak:Math.max.apply(null,S.hist.map(h=>h.mrr).concat([mrr()]))};}

/* enter the grace window: pause, and demand the overdraft is cleared within a fortnight */
function bankCallIn(){
  if(S.co.demand){if(survived()){S.co.demand=null;S.co.bankCalled=false;S.co.red=0;}return;}
  S.co.demand={at:S.day,due:S.day+DEMAND_DAYS};S.co.bankCalled=true;
  if(typeof V!=='undefined')V.speed=0;
  S.hq.push({id:'bankCall',ctx:{}});
  log('The bank is calling in the overdraft. Clear it within '+DEMAND_DAYS+' days or '+S.co.name+' goes into administration. Sell what you need to.','bad');
}

/* clears the demand the instant you are back within the limit; called from the render path */
function demandCheck(){if(S.co&&S.co.demand&&survived()){S.co.demand=null;S.co.bankCalled=false;S.co.red=0;log('You raised enough to get back within your limit. The bank stands down.','good');}}

/* daily: sweep savings to cover the current account, and enforce the demand deadline */
if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);
  try{
    if(S.co.savingsCover!==false&&(S.co.savings||0)>0&&S.co.cash<0){const d=Math.min(S.co.savings,-S.co.cash);S.co.savings-=d;S.co.cash+=d;S.co.sweptMo=(S.co.sweptMo||0)+d;}
    if(S.day%DPM===0&&(S.co.sweptMo||0)>0){log('Drew '+gbp(Math.round(S.co.sweptMo))+' from savings this month to keep the current account out of the overdraft.','info');S.co.sweptMo=0;}
    if(S.co.demand){if(survived()){demandCheck();}else if(S.day>=S.co.demand.due){bankFold();log('Time ran out. The bank has put '+S.co.name+' into administration.','bad');}}
  }catch(e){}
};}

/* rewrite the bank event into the grace-window demand */
if(typeof HUMAN!=='undefined'){
  HUMAN.bankCall={w:0,ok:()=>false,make:x=>{
    const la=liquidAssets();const over=Math.round(-S.co.cash-OD_LIMIT);const clear=Math.round(-S.co.cash);
    const canCover=(S.co.cash+la.total)>-OD_LIMIT;
    const tally=la.lines.slice(0,6).map(l=>l.what+' ~'+gbp(l.v)).join(', ');
    return {kicker:'The bank · final demand',title:'The bank is calling in the overdraft',
      body:'You’re '+gbp(over)+' past your '+gbp(OD_LIMIT)+' limit. The bank will put '+S.co.name+' into administration unless you get back within it, and they’ve given you '+DEMAND_DAYS+' days. '+
        (la.total>0?'You can raise about '+gbp(la.total)+' from what you hold'+(tally?' ('+tally+')':'')+'. '+(canCover?'That’s more than enough — sell what you like on the Markets and Savings screens (you’ll get full price), and this clears the moment you’re back within the limit.':'It may not be enough on its own, but it buys you room while you win work.'):'You’ve nothing much left to sell.'),
      choices:[
        {label:'Give me time to raise it',note:'The game stays paused. Sell assets yourself at full price; the demand lifts as soon as you clear the limit.',go(){log('You’ve bought some time. Clear the overdraft before the '+DEMAND_DAYS+' days are up.','event');}},
        {label:'Sell just enough now, automatically',note:'A quick forced sale at a discount, smallest hit first, only as much as it takes. Every line is logged.',go(){autoLiquidate(0);if(survived()){S.co.demand=null;S.co.bankCalled=false;S.co.red=0;log('The forced sale cleared it. '+S.co.name+' survives, lighter but standing.','good');}else{bankFold();log('Even selling everything liquid wasn’t enough. '+S.co.name+' goes into administration.','bad');}}},
        {label:'Let it fold',note:'Walk away. The company goes into administration.',go(){bankFold();log('You let '+S.co.name+' go into administration.','bad');}}
      ]};}};
}

/* re-open the demand from the banner */
ACT_EXT.demandOpen=()=>{if(S.co&&S.co.demand)S.hq.push({id:'bankCall',ctx:{}});};

/* a persistent red banner while a demand is live, on whatever tab you’re on */
if(typeof renderPane==='function'){const _rp=renderPane;renderPane=function(){

      const banner='<div class="sec" style="border:1px solid var(--bad);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--bad) 9%,transparent);margin-bottom:12px"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px"><b style="color:var(--bad)">The bank is calling in the overdraft</b><button class="btn sm" data-act="demandOpen">Options</button></div><p class="mut" style="font-size:.84rem;margin:6px 0 0">'+gbp(over)+' over the limit, about '+days+' day'+(days===1?'':'s')+' to clear it. Sell holdings on the Markets and Savings screens (full price), or take the quick forced sale. It lifts the moment you’re back within your limit.</p></div>';
      p.innerHTML=banner+p.innerHTML;}}
  }catch(e){}
};}

if(typeof paneInvestSavings==='function'){const _ps=paneInvestSavings;paneInvestSavings=function(){let h=_ps.apply(this,arguments);

/* ============ build 128: bulk 5% uplift + account-manager auto-uplift ============
   The per-client 5% rise got tedious at scale. Two additions, both respecting the same rules
   (once a year per client, capped 30% over list):
   1. A filter-scoped bulk "Raise 5%" on the Clients tab: applies to the clients matching your
      current filter, skipping anyone at risk or already near the cap.
   2. A policy toggle to let your account managers apply the yearly uplift across their books
      automatically, so managed clients keep pace hands-off. Your own book stays manual. */

/* the same eligibility the per-client button uses, plus skip anyone at risk */
function bulkUpliftOk(c){return (typeof upliftOk==='function')&&upliftOk(c)&&c.notice==null&&c.sat>=55;}

/* mirrors the Clients-tab filter predicate so the bulk action hits the same set you see */
function clientInFilter(c,filt){
  if(filt==='review')return (typeof reviewDue==='function')&&reviewDue(c);
  if(filt==='mine')return !amOf(c);
  if(filt==='risk')return c.notice!=null||c.sat<55;
  if(filt==='thin'){const p=clientPL(c);return !p.settling&&p.pct<0.15;}
  if(filt==='uplift')return (typeof upliftOk==='function')&&upliftOk(c);
  return true;
}

/* apply the 5% rise to one client; soft=true for the AM-run version (they smooth it over) */
function applyUplift(c,soft){
  const big=Object.values(c.svc).some(x=>x.pm>=1.15);
  for(const k in c.svc)c.svc[k].pm=Math.min(1.3,c.svc[k].pm*1.05);
  c.sat=Math.max(0,c.sat-(soft?(big?7:3):(big?9:4)));
  c.trust=Math.max(0,c.trust-(soft?(big?6:2):(big?8:3)));
  c.upAt=S.day;
}

ACT_EXT.upliftBulk=()=>{
  const filt=(S.co&&S.co.clientFilter)||'all';let n=0;
  for(const c of active()){if(!clientInFilter(c,filt)||!bulkUpliftOk(c))continue;applyUplift(c,false);n++;}
  log(n?('Raised prices 5% for '+n+' client'+(n>1?'s':'')+'.'+(filt!=='all'?' (matching your filter)':'')):'No eligible clients in this view. At-risk and near-cap clients are skipped.','event');
};
ACT_EXT.amUplift=v=>{S.co.amUplift=(v==='1');log(S.co.amUplift?'Account managers will now apply the yearly 5% uplift across their books, skipping anyone at risk.':'Account managers will leave price rises to you.','info');};

/* daily: account managers apply the yearly rise to their book, one client per anniversary */
if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);
  try{
    if(S.co.amUplift){for(const c of active()){const am=amOf(c);if(!am||!bulkUpliftOk(c))continue;applyUplift(c,true);S.co._amUpMo=(S.co._amUpMo||0)+1;}}
    if(S.day%DPM===0&&(S.co._amUpMo||0)>0){log('Account managers raised prices 5% for '+S.co._amUpMo+' client'+(S.co._amUpMo>1?'s':'')+' this month, as their year came round.','event');S.co._amUpMo=0;}
  }catch(e){}
};}

/* inject the bulk controls onto the Clients tab, under the annual 3% bar */
if(typeof paneClients==='function'){const _pc=paneClients;paneClients=function(){
  let h=_pc.apply(this,arguments);
  try{
    const filt=(S.co&&S.co.clientFilter)||'all';
    const elig=active().filter(c=>clientInFilter(c,filt)&&bulkUpliftOk(c)).length;
    const amOn=S.co.amUplift===true;const haveAms=(typeof ams==='function')&&ams().length>0;

        '<span class="lede" style="margin:0">Push the extra 5% (once a year per client, capped 30% over list). Applies to '+scope+' below, skipping anyone at risk or near the cap.</span>'+
        '<button class="btn sm" data-act="upliftBulk" '+(elig?'':'disabled')+'>Raise 5% · '+elig+' eligible</button></div>'+
      (haveAms?'<div class="row" style="justify-content:space-between;align-items:center;gap:8px;margin-top:8px"><span class="mut" style="font-size:.82rem">Let account managers apply the yearly uplift across their own books automatically</span><div class="seg" style="flex:0 0 auto;min-width:120px"><button data-act="amUplift" data-v="1" aria-pressed="'+amOn+'">On</button><button data-act="amUplift" data-v="0" aria-pressed="'+(!amOn)+'">Off</button></div></div>':'')+
      '</div>';
    h=h.replace('<div class="sec"><p class="lede">Telephony',bar+'<div class="sec"><p class="lede">Telephony');
  }catch(e){}

};}

/* ============ build 130: deeper SaaS + an active data centre ============
   SaaS is no longer a one-shot coin flip. A live product has a market-fit tier, a marketing
   spend and a price stance that drive it toward a ceiling, and a flop can be reworked for a
   fresh roll (better odds, never worse) or wound down. The data centre's private hosting is
   now a product you actually run: a sales-effort lever, capacity you expand for capex, and an
   option to wholesale idle racks. Balance is deliberately harsh: the DC's £15k/mo run means it
   loses money until you host well over a thousand users, so it only pays back at real scale or
   through its build synergies (own backup platform, cheap SaaS hosting). */

/* ---------------- SaaS ---------------- */
const SAAS_BASE=[2500,20000,70000];        // flop / steady / hit monthly-revenue ceiling
const SAAS_MKT=[0,6000,18000];             // marketing spend per month by level
const SAAS_MKT_LIFT=[1,1.15,1.3];          // and how much it lifts the ceiling
const SAAS_PRICE=[0.85,1,1.2];             // value / standard / premium revenue multiplier
function saasCeiling(sb){return Math.round(SAAS_BASE[sb.fit||0]*SAAS_MKT_LIFT[sb.mkt||0]*SAAS_PRICE[sb.price==null?1:sb.price]);}
function saasTick(sb,n){
  const mc=SAAS_MKT[sb.mkt||0];if(mc)spend(mc/DPM);
  /* rework progress, if the team is on a relaunch */
  if(sb.reworking){sb.reworking.done+=(n||0)/DPM;
    if(sb.reworking.done>=sb.reworking.need){const r=Math.random();const nf=r<0.15?0:r<0.55?1:2;sb.fit=Math.max(sb.fit||0,nf);sb.out=['flop','steady','hit'][sb.fit];sb.reworking=null;sb.rev=Math.max(sb.rev||0,[1500,7000,14000][sb.fit]);
      log('The SaaS relaunch is out. The market now takes it as '+['a niche tool','a steady earner','a real hit'][sb.fit]+'.',sb.fit?'good':'info');}}
  if(S.day%DPM===0){
    const ceil=saasCeiling(sb);const grow=[0.03,0.09,0.14][sb.mkt||0]*[1.15,1,0.85][sb.price==null?1:sb.price]*(n?1:0.8);
    if((sb.rev||0)<ceil)sb.rev=Math.min(ceil,(sb.rev||0)+(ceil-(sb.rev||0))*grow+ceil*0.01);
    else sb.rev=Math.max(ceil,sb.rev*0.99);
    if(!n)sb.rev*=0.94;                       // no DevOps team: it rots
    sb.rev=Math.max(0,Math.round(sb.rev));
  }
  if(sb.rev){const net=sb.rev*(betLive('dc')?0.95:0.8)/DPM;S.co.cash+=net;S.m.soft=(S.m.soft||0)+net;}
}
ACT_EXT.saasMkt=v=>{const sb=build('saas');if(sb)sb.mkt=Math.max(0,Math.min(2,Math.round(+v||0)));};
ACT_EXT.saasPrice=v=>{const sb=build('saas');if(sb)sb.price=Math.max(0,Math.min(2,Math.round(+v||0)));};
ACT_EXT.saasRework=()=>{const sb=build('saas');if(!sb||!sb.live||sb.reworking)return;if(!devTeam()){toast('You need a DevOps team to rework it.');return;}
  const cost=60000;if(S.co.cash-cost<-OD_LIMIT){toast('Not enough cash for the '+gbp(cost)+' rework.');return;}
  spend(cost);sb.reworking={need:BUILDS.saas.dm*0.5*rnd(1,1.4),done:0};
  log('DevOps are reworking the SaaS product for '+gbp(cost)+'. A relaunch re-rolls how the market takes it, and can only improve it.','event');};
ACT_EXT.saasWind=()=>{const sb=build('saas');if(!sb||!sb.live)return;const scrap=Math.round((sb.rev||0)*3);if(scrap){S.co.cash+=scrap;S.m.soft=(S.m.soft||0)+scrap;}delete S.builds.saas;
  log('You wound down the SaaS product'+(scrap?' and sold the IP for '+gbp(scrap):'')+'. DevOps can build a fresh one from scratch.','event');};

function saasProductSec(){
  const sb=build('saas');if(!sb||!sb.live)return '';
  const ceil=saasCeiling(sb);const mc=SAAS_MKT[sb.mkt||0];const net=Math.round(sb.rev*(betLive('dc')?0.95:0.8)-mc);
  let h='<div class="sec"><h3 style="font-size:.95rem">Your SaaS product</h3>'+
    '<div class="tiles"><div class="tile"><span class="k">Revenue</span><span class="v">'+gbp(Math.round(sb.rev))+'</span><small>a month, ceiling '+gbp(ceil)+'</small></div>'+
    '<div class="tile"><span class="k">Net to you</span><span class="v '+(net<0?'neg':'')+'">'+gbp(net)+'</span><small>after hosting'+(mc?' &amp; marketing':'')+'</small></div>'+
    '<div class="tile"><span class="k">Market fit</span><span class="v">'+['Niche','Steady','Hit'][sb.fit||0]+'</span><small>'+(betLive('dc')?'95% margin (own DC)':'80% margin')+'</small></div></div>';
  h+='<p class="lede" style="margin:10px 0 4px">Marketing</p><div class="seg">'+['Off','Modest','Heavy'].map((t,i)=>'<button data-act="saasMkt" data-v="'+i+'" aria-pressed="'+((sb.mkt||0)===i)+'">'+t+'<small>'+(SAAS_MKT[i]?gbp(SAAS_MKT[i])+'/mo':'no spend')+'</small></button>').join('')+'</div>';
  h+='<p class="lede" style="margin:10px 0 4px">Pricing</p><div class="seg">'+['Value','Standard','Premium'].map((t,i)=>'<button data-act="saasPrice" data-v="'+i+'" aria-pressed="'+((sb.price==null?1:sb.price)===i)+'">'+t+'<small>'+['grows fast, less per user','balanced','more per user, slower'][i]+'</small></button>').join('')+'</div>';
  if(sb.reworking){const pc=Math.round(sb.reworking.done/sb.reworking.need*100);h+='<p class="note">Relaunch under way: '+pc+'% of the rework done.</p>';}
  else h+='<div class="row" style="margin-top:10px"><button class="btn sm" data-act="saasRework">Rework for a relaunch · '+gbp(60000)+'</button><button class="btn sm danger" data-act="saasWind">Wind it down</button></div>'+
    '<p class="mut" style="font-size:.78rem;margin-top:6px">'+(sb.fit<2?'A rework re-rolls market fit with better odds and can only improve it. ':'')+'Marketing lifts the ceiling and speeds growth; premium pricing earns more per user but grows slower.</p>';
  return h+'</div>';
}

/* ---- retry a failed non-SaaS build: cheaper second run, better odds, never worse ---- */
ACT_EXT.buildRetry=k=>{const B=BUILDS[k];const b=build(k);if(!B||!b||!b.failed)return;if(!devTeam()){toast('You need a DevOps team to try again.');return;}
  const cost=Math.round(B.dm*1500);if(S.co.cash-cost<-OD_LIMIT){toast('Not enough cash to take another run at '+B.t.toLowerCase()+' ('+gbp(cost)+').');return;}
  spend(cost);
  S.builds[k]={need:B.dm*0.5*rnd(1,1.4),est:Math.round(B.dm*0.5),done:0,start:S.day,failMod:0.5,retry:true};
  log('DevOps are taking another run at '+B.t.toLowerCase()+' for '+gbp(cost)+', building on what went wrong. Roughly half the failure risk this time.','event');};

/* ---------------- Data centre hosting ---------------- */
const DC_PRICE=9;            // £/user/month retail private hosting
const DC_WHOLESALE=2;        // £/idle slot/month if you wholesale spare capacity
const DC_EXPAND=120000;      // capex per +3,000 slots
const DC_SLOTS=3000;
function dcCap(b){return b.cap||DC_SLOTS;}
function dcSell(b){return b.sell==null?1:b.sell;}
function dcCeiling(b){const eff=[0,0.35,0.6][dcSell(b)];return Math.min(dcCap(b),Math.round(supportSeats()*eff*(0.6+clamp(S.co.rep,0,100)/250)));}
function dcTick(b){
  if(S.day%DPM===0){const ceil=dcCeiling(b);const u=b.users||0;
    if(u<ceil)b.users=Math.min(ceil,u+(ceil-u)*0.15+supportSeats()*0.008);
    else b.users=Math.max(ceil,u*0.97);
    b.users=Math.max(0,Math.round(b.users));}
  const rev=(b.users||0)*DC_PRICE/DPM;S.co.cash+=rev;S.m.soft=(S.m.soft||0)+rev;
  if(b.wholesale){const spare=Math.max(0,dcCap(b)-(b.users||0));const wr=spare*DC_WHOLESALE/DPM;S.co.cash+=wr;S.m.soft=(S.m.soft||0)+wr;}
}
ACT_EXT.dcSell=v=>{const b=bet('dc');if(b)b.sell=Math.max(0,Math.min(2,Math.round(+v||0)));};
ACT_EXT.dcWholesale=v=>{const b=bet('dc');if(b)b.wholesale=(v==='1');};
ACT_EXT.dcExpand=()=>{const b=bet('dc');if(!b||!b.live)return;if(S.co.cash-DC_EXPAND<-OD_LIMIT){toast('Not enough cash to expand the data centre ('+gbp(DC_EXPAND)+').');return;}spend(DC_EXPAND);b.cap=dcCap(b)+DC_SLOTS;log('You expanded the data centre: +'+DC_SLOTS.toLocaleString()+' hosting slots for '+gbp(DC_EXPAND)+'.','event');};

function dcHostingSec(){
  const b=bet('dc');if(!b||!b.live)return '';
  const cap=dcCap(b),u=Math.round(b.users||0),ceil=dcCeiling(b);
  const rev=Math.round(u*DC_PRICE);const spare=Math.max(0,cap-u);const wrev=b.wholesale?Math.round(spare*DC_WHOLESALE):0;
  const net=rev+wrev-15000;
  let h='<div class="sec"><h3 style="font-size:.95rem">Private hosting</h3>'+
    '<div class="tiles"><div class="tile"><span class="k">Hosted users</span><span class="v">'+u.toLocaleString()+'</span><small>of '+cap.toLocaleString()+' slots</small></div>'+
    '<div class="tile"><span class="k">Hosting revenue</span><span class="v">'+gbp(rev+wrev)+'</span><small>'+gbp(rev)+' retail'+(wrev?' · '+gbp(wrev)+' wholesale':'')+'/mo</small></div>'+
    '<div class="tile"><span class="k">After the '+gbp(15000)+' run</span><span class="v '+(net<0?'neg':'pos')+'">'+gbp(net)+'</span><small>a month</small></div></div>';
  h+='<p class="lede" style="margin:10px 0 4px">Sales effort · '+DC_PRICE+' a user a month</p><div class="seg">'+['Off','Standard','Push'].map((t,i)=>'<button data-act="dcSell" data-v="'+i+'" aria-pressed="'+(dcSell(b)===i)+'">'+t+'<small>'+['let it drift','steady take-up','win hosting hard'][i]+'</small></button>').join('')+'</div>';
  if(u>=ceil&&ceil>=cap)h+='<p class="note warn">You’re at capacity. Expand to host more.</p>';
  h+='<div class="row" style="margin-top:10px"><button class="btn sm" data-act="dcExpand">Expand · +'+DC_SLOTS.toLocaleString()+' slots · '+gbp(DC_EXPAND)+'</button>'+
    '<button class="btn sm" data-act="dcWholesale" data-v="'+(b.wholesale?'0':'1')+'" aria-pressed="'+!!b.wholesale+'">'+(b.wholesale?'Wholesaling spare':'Wholesale spare racks')+'</button></div>'+
    '<p class="mut" style="font-size:.78rem;margin-top:6px">Idle racks can be wholesaled to other MSPs at '+gbp(DC_WHOLESALE)+' a slot, a thin margin that just softens the run cost. Hosting only clears the '+gbp(15000)+'/mo run above about '+Math.ceil(15000/DC_PRICE).toLocaleString()+' users.</p>';
  return h+'</div>';
}

/* ---- attach the controls next to their sections on the Strategy tab ---- */
if(typeof devSec==='function'){const _ds=devSec;devSec=function(){let h=_ds.apply(this,arguments);try{h+=saasProductSec();}catch(e){}return h;};}
if(typeof betsList==='function'){const _bl=betsList;betsList=function(keys,title,lede){let h=_bl(keys,title,lede);try{if(keys&&keys.indexOf('dc')>=0&&betLive('dc'))h+=dcHostingSec();}catch(e){}return h;};}

/* ---- migrate older saves ---- */
if(typeof migrateSave==='function'){const _m=migrateSave;migrateSave=function(){_m.apply(this,arguments);try{
  const sb=S.builds&&S.builds.saas;if(sb&&sb.live&&sb.fit==null){sb.fit=sb.out==='hit'?2:sb.out==='steady'?1:0;if(sb.mkt==null)sb.mkt=0;if(sb.price==null)sb.price=1;}
  const dc=S.bets&&S.bets.dc;if(dc&&dc.live){if(dc.cap==null)dc.cap=Math.max(DC_SLOTS,Math.round((dc.users||0)*1.3/DC_SLOTS)*DC_SLOTS||DC_SLOTS);if(dc.sell==null)dc.sell=1;}
}catch(e){}};}

/* ============ build 133: branch value maturation + cost scaling ============
   Branches were frozen at their acquisition per-client value while HQ clients grew, so a big
   branch looked like a rounding error next to headquarters. Now a branch's revenue per seat
   matures over time toward a fraction of your own HQ per-seat value (simulating its managers
   cross-selling), gated by how well it's run. To keep that honest, a richer service mix also
   raises the branch's cost of sales and its staffing need, so a maturing branch grows bigger
   AND costs more to run, landing at a realistic net margin rather than free money. */

function brSupportRef(){return (typeof refPrice==='function'?refPrice('support'):45);}
function brPerSeat(b){return (b.perClient||0)/(b.seatsPer||BR_SEATS);}
function brSvcMix(b){return clamp(brPerSeat(b)/brSupportRef(),0.6,4.5);}   // ~1.9 at acquisition, in units of a support seat
function hqPerSeat(){const cl=(typeof active==='function')?active():[];if(!cl.length)return brSupportRef()*1.9;let s=0;for(const c of cl)s+=(c.seats||BR_SEATS);return s?mrr()/s:brSupportRef()*1.9;}
/* how much of your HQ per-seat value a well-run branch captures over time */
function brFrac(b){return clamp(0.50+0.06*((b.mgr&&b.mgr.skill)||3)+(b.invest?0.06:0)+brOversightQ()*0.6,0.50,0.90);}
function brTargetPer(b){return Math.max(b.perClient||0,Math.round(hqPerSeat()*brFrac(b)*(b.seatsPer||BR_SEATS)));}

/* richer service mix means more products to support: more staff needed. Normalised so a
   just-acquired branch (mix ~1.0, roughly support + one product) matches the old need. */
function brNeed(b){const svc=brSvcMix(b);const load=0.7+0.3*svc;return Math.max(1,Math.round(brSeats(b)*load/(BR_TECH_PER*(0.85+0.06*((b.mgr&&b.mgr.skill)||3)))));}
/* and higher cost of sales (the extra services carry vendor cost), before HQ synergy */
function brResold(b){const svc=brSvcMix(b);const base=clamp(0.34*Math.pow(svc,0.55),0.30,0.6);return base*(1-brSynergy());}

/* each month a well-run branch cross-sells its clients up toward the target value */
function matureBranch(b){const tgt=brTargetPer(b);const cur=b.perClient||0;if(cur>=tgt)return;
  const q=(typeof brQuality==='function')?brQuality(b):0.7;
  const rate=0.02*(1+(b.invest?0.7:0)+(((b.grow||1)>1)?0.5:0))*(0.5+q*0.5);
  b.perClient=Math.min(tgt,cur+(tgt-cur)*rate);}
if(typeof branchesMonthly==='function'){const _bm=branchesMonthly;branchesMonthly=function(){_bm.apply(this,arguments);try{for(const b of branches())matureBranch(b);}catch(e){}};}

/* ============ build 134: fuller exec delegation + per-exec toggle + monthly digest ============
   Late game, a heavy group runs at 256x and a forced-choice modal was firing every couple of
   seconds. The C-suite already auto-handled the core domain events (breach, poach, rival...),
   but a long tail still stopped the clock: lawsuits, licensing audits, data requests, tool
   leaks, client downturns, staff awards. Those now route to the owning exec too. Each exec
   gets a "Handle it / Ask me first" switch (default: Handle it), so you can pull any domain
   back onto your own desk when you want the call. And once a month your execs report what they
   took care of, so delegation isn't a black box. Nothing here delegates a decision that is
   yours alone: M&A, going public, the board, the bank calling in the overdraft, a partner
   walking, a scandal or a conviction all still stop and ask you. */

/* extend the routing table (defined in zm.js) with the noisy long tail */
if(typeof EVENT_EXEC==='object'&&EVENT_EXEC){
  Object.assign(EVENT_EXEC,{
    suit:'cfo', licAudit:'cfo',        // legal cost and licensing sit with finance
    dsar:'cto', toolLeak:'cto',        // data requests and product security sit with technology
    downturn:'coo', award:'coo'        // client relationships and people sit with operations
  });
}

/* per-exec delegation switch: default on (Handle it). Ask me first pulls that exec's
   domain events back to blocking modals so you make the call yourself. */
function execDelegOn(r){return !(S&&S.co&&S.co.execDeleg&&S.co.execDeleg[r]===false);}
ACT_EXT.execDeleg=v=>{const [r,on]=v.split(':');if(!EXEC_ROLE[r])return;S.co.execDeleg=S.co.execDeleg||{};S.co.execDeleg[r]=(on==='1');
  const R=EXEC_ROLE[r];log('Your '+R.t+' will '+(on==='1'?'handle their domain events for you.':'bring their domain decisions to you.'),'info');};

/* smarter default picks for the newly-delegated events (others fall through to zm's execChoiceIdx,
   whose default of choice 0 already lands on the sensible option: settle, pay, handle properly,
   report and switch, scale the client down). */
if(typeof execChoiceIdx==='function'){
  const _eci=execChoiceIdx;
  execChoiceIdx=function(id,e,ctx){
    const n=(e&&e.choices)?e.choices.length:1;
    if(id==='suit'){const i=(ctx&&ctx.w>=0.62&&S.co.cash>0)?1:0;return Math.max(0,Math.min(n-1,i));}   // fight only when the odds are good
    if(id==='award'){const i=S.co.cash>8000?0:1;return Math.max(0,Math.min(n-1,i));}                    // make a proper fuss if the cash is there
    return _eci(id,e,ctx);
  };
}

/* redefine the resolver (zm.js version) to honour the toggle and tally the month's work.
   This declaration loads after zm.js, so it wins; the nextModal wrapper calls it by name. */
function execResolvePending(){
  if(!S||V._execBusy)return;let guard=0;
  while(S.pending&&EVENT_EXEC[S.pending.id]&&typeof exec==='function'&&exec(EVENT_EXEC[S.pending.id])&&execDelegOn(EVENT_EXEC[S.pending.id])&&guard++<8){
    const id=S.pending.id,ctx=S.pending.ctx,role=EVENT_EXEC[id];
    V._execBusy=true;
    let e=null;try{e=pendingEvent();}catch(_){e=null;}
    if(!e||!e.choices||!e.choices.length){V._execBusy=false;break;}
    const idx=execChoiceIdx(id,e,ctx);
    S.pending=null;
    try{e.choices[idx].go();}catch(_){}
    const R=EXEC_ROLE[role],nm=(exec(role)||{}).name||R.t;
    log(nm+' ('+R.t+') handled it — '+e.title+': '+e.choices[idx].label+'.','info');
    S.execMonth=S.execMonth||{};S.execMonth[role]=(S.execMonth[role]||0)+1;
    V._execBusy=false;
  }
}

/* monthly digest: a single line summarising what the C-suite took off your desk */
if(typeof monthEnd==='function'){
  const _me=monthEnd;
  monthEnd=function(){_me.apply(this,arguments);try{execDigest();}catch(e){}};
}
function execDigest(){
  const m=S.execMonth;if(!m)return;
  const parts=[];let total=0;
  for(const r of EXEC_ORDER){const n=m[r]||0;if(n){total+=n;const e=exec(r);parts.push(n+' by '+(e?e.name.split(' ')[0]:EXEC_ROLE[r].t)+' ('+EXEC_ROLE[r].t+')');}}
  S.execMonth=null;
  if(!total)return;
  log('Your execs handled '+total+' thing'+(total>1?'s':'')+' this month without troubling you: '+parts.join(', ')+'.','info');
}

/* the Handle it / Ask me first switch on each hired exec's card (leadershipSec lives in zc.js).
   Injected just before the "Let them go" row, per exec, by matching the fire button. */
if(typeof leadershipSec==='function'){
  const _ls=leadershipSec;
  const EDOM={cto:'breaches, incidents, data requests, tool leaks, stack and cert calls',
              cfo:'price rises, lawsuits, licensing audits, buy-out offers',
              coo:'manager asks, poaching, rivals, client downturns, staff awards'};
  function execDelegSeg(r){const on=execDelegOn(r);
    return '<div class="seg" style="margin-top:8px"><button data-act="execDeleg" data-v="'+r+':1" aria-pressed="'+on+'">Handle it<small>resolves their events</small></button>'+
      '<button data-act="execDeleg" data-v="'+r+':0" aria-pressed="'+(!on)+'">Ask me first<small>brings them to you</small></button></div>'+
      '<span class="mut" style="display:block;font-size:.76rem;margin-top:4px">'+(on?'Handles '+(EDOM[r]||'their domain')+' for you.':'Brings '+(EDOM[r]||'their domain')+' to you.')+'</span>';
  }
  leadershipSec=function(){
    let h=_ls.apply(this,arguments);
    h=h.replace(/<span class="row" style="margin-top:4px"><button class="btn sm danger" data-act="execFire" data-v="([a-z]+)">/g,
      (m,r)=>execDelegSeg(r)+m);
    return h;
  };
}

/* ============ modals ============ */
function nextModal(){
  if(!S)return;
  if(S.intro){ui.modal={type:'intro'};return;}
  if(S.over){ui.modal={type:'over'};return;}
  if(ui.modal)return;

  if(S.pending){ui.modal={type:'event'};return;}
  if(S.mq&&S.mq.length){ui.modal={type:'mq'};return;}
}
function closeModal(){ui.modal=null;ui.confirm=false;nextModal();render();}
function renderModal(){
  const m=$('modal');const M=ui.modal;
  if(!M){m.hidden=true;m.innerHTML='';return;}
  try{
  let h='';
  const x='<button class="x" data-act="close" aria-label="Close">×</button>';
  if(M.type==='intro'){
    h='<div class="dialog"><p class="kick">A managed services sim</p><h2>Tier One</h2><p>You’ve left your job with two telephony clients and a laptop. Build them into a proper MSP: take on support, hire a desk, sell projects, keep the stack lean and the clients happy. Time runs on its own; pause whenever you like.</p>'+

function negOdds(k){const v=VEND[k];let vol=v.svc?v.svc.reduce((a,x)=>a+svcUsers(x),0):svcUsers('support')+staffOn().length*5;return clamp(0.25+vol/800,0.25,0.6);}

/* ============ actions ============ */
function act(a,v,el){
  switch(a){
    case 'speed':{const fr=dayFrac();V.speed=+v;V.lastFrac=fr;V.acc=V.speed>0?fr*cycleMs():0;renderTop();return;}
    case 'tab':ui.tab=v;ui.subtab=ui.subtab||{};ui.subtab[groupOf(v).k]=v;renderTabs();renderPane();$('pane').scrollTop=0;return;
    case 'group':{const g=GROUPS.find(x=>x.k===v);if(g){ui.tab=(ui.subtab&&ui.subtab[v])||g.tabs[0];renderTabs();renderPane();$('pane').scrollTop=0;}return;}
    case 'mode':S.co.mode=v;log('You switch to '+MODES[v].t.toLowerCase()+'.','info');break;
    case 'close':if(ui.modal&&ui.modal.type==='report')S.report=null;closeModal();save();return;
    case 'reportMoney':S.report=null;ui.tab='money';closeModal();return;
    case 'start':{const n=($('fName').value||'You').trim().slice(0,24)||'You',co=($('fCo').value||'Northbridge IT').trim().slice(0,28)||'Northbridge IT';newState(n,co);S.diff=ui.diff||'normal';S.co.cash=DIFF[S.diff].cash;S.guide={on:S.diff!=='hard',done:{}};S.build=BUILD;S.office.slots=[];ui.modal=null;setLayout();V.speed=16;break;}
    case 'newgame':try{localStorage.removeItem(SAVE_KEY);}catch(e){}newState('Jason','Northbridge IT');S.intro=true;S.office.slots=[];setLayout();ui.modal=null;ui.confirm=false;nextModal();break;
    case 'reset':ui.modal={type:'reset'};break;
    case 'choose':{const before=ui.modal;const e=pendingEvent();if(e){const ch=e.choices[+v];S.pending=null;ch.go();}if(ui.modal===before)ui.modal=null;nextModal();break;}
    case 'deal':{const d=S.deals.find(z=>z.id===v);ui.modal={type:'deal',id:v,pm:d&&d.draft?d.draft.pm:1};break;}
    case 'reviewNow':{const c=C(v);if(c&&reviewDue(c)){if(diaryFull()){log('Your diary is full. Reviews free up as you work through the ones already booked.','bad');toast('Your diary is full. Try again in a day or two.');}else doReview(c,null);}break;}
    case 'pm':ui.modal.pm=+v;break;
    case 'send':{const d=S.deals.find(z=>z.id===ui.modal.id);if(d&&!blockers(d).length){if(d.draft)d.by=d.draft.by;sendDeal(d,ui.modal.pm||1);log('Proposal sent to '+dealName(d)+'.','info');}ui.modal=null;nextModal();break;}
    case 'walk':{S.deals=S.deals.filter(z=>z.id!==ui.modal.id);ui.modal=null;nextModal();break;}
    case 'hire':if(!ROLES[v]||!ROLES[v].sal)break;ui.modal={type:'hire',role:v,src:'board'};break;
    case 'src':ui.modal.src=v;break;
    case 'hireC':{const cs=cands(ui.modal.role);const c=cs[ui.modal.src].find(z=>z.id===v);if(c)hire(c);break;}
    case 'staff':ui.modal={type:'staff',id:v};ui.confirm=false;break;
    case 'focus':{const s=ST(ui.modal.id);if(s)s.focus=v;break;}
    case 'raise':{const s=ST(ui.modal.id);if(s&&(s.raise||-999)+60<=S.day){s.salary=Math.round(s.salary*1.08/10)*10;s.morale=Math.min(100,s.morale+18);s.raise=S.day;log(s.name+' gets a pay rise.','good');}break;}
    case 'train':{const s=ST(ui.modal.id);if(s&&s.skill<5&&(s.trained||-999)+60<=S.day&&present(s)){const cost=trainCostOf(s);spend(cost);s.away=S.day+3;s.course=s.away;s.trained=S.day;s.xp=(s.xp||0)+(hasT(s,'quick')?0.7:0.5);s.morale=Math.min(100,s.morale+6);let up='';if(s.xp>=1){s.xp-=1;s.skill++;s.skillAt=S.day;up=' They come back a level '+s.skill+'.';}log(s.name+' is off on a training course for three days.'+(up||' Another course or two and they’ll step up a level.'),'info');}break;}
    case 'interview':{const cs=cands(ui.modal.role);const c=(cs[ui.modal.src||'board']||[]).find(z=>z.id===v);if(c)interviewCand(c);break;}
    case 'fireAsk':ui.modal={type:'letgo',id:ui.modal.id};break;
    case 'fire':{const s=ST(ui.modal.id);if(s){spend(s.salary);s.left=true;unassign(s.id);S.staff=S.staff.filter(z=>z!==s);for(const o of S.staff)o.morale=Math.max(0,o.morale-6);log('You let '+s.name+' go.','bad');}ui.modal=null;ui.confirm=false;break;}
    case 'client':ui.modal={type:'client',id:v};break;
    case 'review':{const c=C(ui.modal.id);if(c&&!diaryFull())doReview(c,null);break;}
    case 'assign':{const c=C(ui.modal.id);if(c){c.am=v||null;if(v)log(c.name+' is now in '+ST(v).name+'’s book.','info');}break;}
    case 'fillBook':{const s=ST(ui.modal.id);if(s){const un=active().filter(c=>!c.am).sort((a,b)=>clientMRR(b)-clientMRR(a));let n=0;for(const c of un){if(amLoad(s)>=amCap(s))break;c.am=s.id;n++;}log(s.name+' takes on '+n+' client'+(n===1?'':'s')+'.','info');}break;}
    case 'autoSend':{const s=ST(ui.modal.id);if(s)s.auto=v==='1';break;}
    case 'uplift':{const c=C(ui.modal.id);if(c&&upliftOk(c)){c.upAt=S.day;const big=Object.values(c.svc).some(x=>x.pm>=1.15);for(const k in c.svc)c.svc[k].pm=Math.min(1.3,c.svc[k].pm*1.05);c.sat-=big?9:4;c.trust=Math.max(0,c.trust-(big?8:3));log('Prices up 5% for '+c.name+'.'+(big?' They were already paying well over list, and they’ve noticed.':''),'event');}break;}
    case 'rescue':{const c=C(ui.modal.id);if(c){for(const k in c.svc)c.svc[k].pm*=0.9;c.sat=Math.min(100,c.sat+22);log('You offered '+c.name+' 10% off to stay.','event');}break;}
    case 'room':ui.modal={type:'room',j:+v};break;
    case 'fit':{const j=ui.modal.j;const r=ROOMS[v];spend(r.cost);S.office.slots=S.office.slots||[];S.office.slots[j]=v;S.office.rooms[v]=true;log('The '+r.t.toLowerCase()+' is finished.','good');ui.modal=null;break;}
    case 'move':{const t=+v;if(!TIERS[t]||t===S.office.tier)break;ui.modal={type:'moveAsk',t};break;}
    case 'moveGo':{const t=+v;const T=TIERS[t];ui.modal=null;if(t===S.office.tier||staffOn().length>T.cap)break;spend(T.move);S.office.tier=t;const slots=(S.office.slots||[]).filter(Boolean).slice(0,T.slots);S.office.slots=slots;S.office.rooms={};slots.forEach(k=>S.office.rooms[k]=true);reassignDesks();setLayout();log('You have moved into '+T.name.toLowerCase()+': '+T.addr+'.','good');break;}
    case 'add':{S.vend[v].on=true;log('Added '+VEND[v].name+' to the stack.','info');break;}
    case 'drop':{const s=S.vend[v];if(s.lock>S.day){ui.flash='';log('You are locked into '+VEND[v].name+' for another '+daysLeft(s.lock)+'.','bad');break;}
      const used=VEND[v].svc?VEND[v].svc.filter(x=>svcUsers(x)>0):[];
      if(used.length){log('You can’t drop '+VEND[v].name+': clients are using '+used.map(x=>SVC[x].short.toLowerCase()).join(' and ')+'.','bad');ui.tab='news';break;}
      s.on=false;s.disc=0;log('Dropped '+VEND[v].name+' from the stack.','info');break;}
    case 'neg':ui.modal={type:'neg',k:v};break;
    case 'negGo':{const k=ui.modal.k,s=S.vend[k];s.neg=S.day;let msg;
      if(v==='ask'){if(Math.random()<0.65){s.disc=Math.min(0.25,s.disc+0.03);msg=VEND[k].name+' found you another 3%.';}else msg=VEND[k].name+' says that’s already their best price.';}
      else if(v==='commit'){s.disc=Math.min(0.25,s.disc+0.07);s.lock=S.day+DPM*12;msg='Signed a 12-month commitment with '+VEND[k].name+' for 7% off.';}
      else{if(Math.random()<negOdds(k)){s.disc=Math.min(0.25,s.disc+0.14);msg=VEND[k].name+' blinked. 14% off.';}else msg=VEND[k].name+' called your bluff. No change.';}
      log(msg,'event');ui.modal=null;break;}
    case 'borrow':if(S.co.loan+5000<=loanLimit()){S.co.loan+=5000;S.co.cash+=5000;log('Borrowed £5,000 from the bank.','info');}else{const m=bankNervous()?'The bank won’t lend any more until you post a profitable month.':'You’re at the bank’s limit for your recurring revenue.';log(m,'bad');toast(m);}break;
    case 'repay':if(S.co.loan>=5000&&S.co.cash>=5000){S.co.loan-=5000;S.co.cash-=5000;log('Repaid £5,000.','info');}break;
    default:if(ACT_EXT[a])ACT_EXT[a](v);
  }
  if(ui.keepModal){ui.keepModal=false;save();return;}
  render();save();
}

/* ============ loop ============ */
function dayTick(){
  const r=step();
  scheduleDay(r);
  nextModal();
  renderTop();renderTabs();
  // The pane render is the heaviest DOM work (a big client list can take tens of ms).
  // Running it on every simulated day starves the UI at high speed, so throttle it by
  // real time while fast-forwarding. Interaction still renders immediately via act(),
  // and a pause or a modal forces a full render so nothing looks stale.
  const now=(typeof performance!=='undefined'?performance.now():Date.now());
  const fast=V.speed>1&&!ui.modal;
  if(!ui.hold&&(!fast||now-(V._paneAt||0)>140)){renderPane();V._paneAt=now;}
  renderModal();
  // Saving serialises the whole game to storage; throttle it too while fast-forwarding.
  if(!fast||now-(V._saveAt||0)>2000){save();V._saveAt=now;}
}
function frame(now){
  const dt=Math.min(0.05,(now-(V.last||now))/1000);V.last=now;
  if(V.needPlan&&S&&!S.intro&&V.L){V.needPlan=false;scheduleDay({W:[],made:[]});V.acc=0;}
  if(S&&!S.intro&&!ui.modal&&(S.report||S.pending)&&!deferModal()){nextModal();if(ui.modal)render();}
  if(running()){V.rt+=dt*1000;V.acc+=dt*1000;if(V.acc>=cycleMs()){V.acc=0;V.lastFrac=0;dayTick();}else runPlan();}
  else if(S&&!S.intro&&V.speed&&V.acc===0){}
  for(let i=V.sched.length-1;i>=0;i--){if(V.sched[i].at<=now){const f=V.sched[i].fn;V.sched.splice(i,1);try{f(now);}catch(err){}}}
  if(S&&V.L){
    syncActors();
    if(!V.reduced){for(const id in V.actors)stepActor(V.actors[id],dt,now);for(const v of V.visitors)stepActor(v,dt,now);V.visitors=V.visitors.filter(v=>!v.dead);}
    // idle ambience when paused-free: occasional bubble
    draw(now);
  }
  requestAnimationFrame(frame);
}
function save(){if(!S||S.intro)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;const s=JSON.parse(raw);if(s&&s.v===1&&s.co&&s.staff)return s;}catch(e){}return null;}

/* ============ boot ============ */
readColors();
const saved=load();
if(saved){S=saved;S.office.slots=S.office.slots||[];migrateSave();S.flags=S.flags||{};if((S.build||0)<19)ui.modal={type:'oldSave',from:S.build||0};else S.build=BUILD;}else{newState('Jason','Northbridge IT');S.intro=true;S.office.slots=[];}
setLayout();
nextModal();
render();
if('ResizeObserver' in window)new ResizeObserver(()=>{sizeCanvas();}).observe($('stage'));else window.addEventListener('resize',sizeCanvas);
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();render();});
new MutationObserver(()=>{readColors();render();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
requestAnimationFrame(frame);
})();
</script>
