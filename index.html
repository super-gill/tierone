/* ============ build 42: going public ============ */
/* The endgame for a battlecruiser MSP: float on AIM, raise capital, and live
   with a share price that moves every quarter on whether you beat the market's
   expectations. New win condition (build a big enough public company and ring
   the bell) and new ways to lose (two bad quarters and the board removes you).
   Incidents that were once a nuisance now hit your share price. */
const PUB_MULT=1.6;                 // public markets pay a premium over a trade sale
const PUB_TARGET_FLOOR=50000000;    // the "tier one" bar
const IPO_SHARES=1000000;
const OUST_STRIKES=4;                // bad quarters (share price under 45% of float) before the board removes you
function isPublic(){return !!(S.co&&S.co.ipo);}
function lastQProfit(){const h=S.hist.slice(-3);if(h.length<3)return false;return h.reduce((a,x)=>a+x.profit,0)>0;}
function ipoElig(){return !isPublic()&&!S.over&&groupMRR()>=150000&&lastQProfit();}
function ipoValue(){return Math.round((typeof valuation==='function'?valuation():mrr()*24)*PUB_MULT/10000)*10000;}
function marketCap(){const io=S.co.ipo;return io?Math.round(io.price*io.shares):0;}
function yourStake(){const io=S.co.ipo;return io?Math.round(io.price*io.yourShares):0;}
function yourStakePct(){const io=S.co.ipo;return io?io.yourShares/io.shares:0;}
function ipoLocked(){const io=S.co.ipo;return io&&S.day-io.floatDay<DPM*12;}

ACT_EXT.ipoGo=v=>{const f=+v/100;if(!ipoElig()||!(f>0.05&&f<0.6))return;
  const mc=ipoValue();const price=Math.round(mc/IPO_SHARES*100)/100;
  const gross=Math.round(mc*f);const fees=Math.round(gross*0.06);const net=gross-fees;
  const peq=(typeof partner==='function'&&partner())?partner().equity:0;
  const yourFrac=(1-peq)*(1-f);
  S.co.ipo={floatDay:S.day,floatMonth:monthOf(S.day),price,floatPrice:price,shares:IPO_SHARES,
    yourShares:Math.round(IPO_SHARES*yourFrac),floatPct:f,priceHist:[price],
    expMRR:Math.round(groupMRR()*1.03),misses:0,raised:net,incSnap:0,lastQ:monthOf(S.day),
    target:Math.max(PUB_TARGET_FLOOR,Math.round(mc*3/1000000)*1000000)};
  S.co.cash+=net;S.m.setup=(S.m.setup||0)+net;S.co.capYr=(S.co.capYr||0)+net;
  log(S.co.name+' has floated on AIM at '+spx(price)+' a share, valuing it at '+gbp(mc)+'. You sold '+pct(f)+' and raised '+gbp(net)+' net of fees. You’re a public company now, and the market is watching every quarter.','event');
  if(typeof x19==='function')x19('ipo');ui.modal=null;};

function incidentsSince(io){const x=S.x19||{};const cur=(x.breach||0)+(x.suit||0)+(x.scandal||0)+(x.toolLeak||0)+(x.bespokeOutage||0);const d=Math.max(0,cur-(io.incSnap||0));io.incSnap=cur;return d;}
function ipoRecentGrowth(){const h=S.hist.slice(-4);if(h.length<4)return 0.03;return h[h.length-1].mrr/Math.max(1,h[0].mrr)-1;}
function ipoQuarter(){const io=S.co.ipo;if(!io)return;const mo=monthOf(S.day);
  if(mo%3!==0||mo<=io.lastQ)return;io.lastQ=mo;
  const prevPrice=io.price;
  const cur=groupMRR();const exp=io.expMRR||cur;const growthPerf=exp>0?cur/exp-1:0;
  const P=companyPL();const profPerf=P.op>0?0.06:-0.14;
  const inc=incidentsSince(io);
  let delta=clamp(growthPerf*2.2+profPerf-inc*0.07+rnd(-0.04,0.04),-0.45,0.5);
  io.price=Math.max(0.05,Math.round(io.price*(1+delta)*100)/100);
  io.priceHist.push(io.price);if(io.priceHist.length>32)io.priceHist.shift();
  io.expMRR=Math.round(cur*(1+clamp(ipoRecentGrowth(),0,0.12)));
  io.misses=(io.price<io.floatPrice*0.45)?(io.misses||0)+1:0;
  io.lastReport={mo,cur,exp,growthPerf,profitable:P.op>0,op:Math.round(P.op),inc,prevPrice,price:io.price,delta,cap:marketCap(),target:io.target,misses:io.misses,floatPrice:io.floatPrice,hitTargetNew:false,hitTarget:!!io.hitTarget};
  log('Quarterly results: shares '+(delta>=0?'up':'down')+' '+pct(Math.abs(delta))+' to '+spx(io.price)+', '+(growthPerf>=0?'beating':'missing')+' the market’s growth expectations'+(inc?' (and knocked by the quarter’s incidents)':'')+'. Market cap '+gbp(marketCap())+'.',delta>=0?'good':'bad');
  if(io.misses>=OUST_STRIKES){ipoOust();return;}
  if(marketCap()>=io.target&&!io.hitTarget){io.hitTarget=true;io.lastReport.hitTarget=true;io.lastReport.hitTargetNew=true;log('Your market cap has passed '+gbp(io.target)+'. You’ve built a genuine tier-one MSP. Ring the bell on the Strategy tab whenever you’re ready to call it.','good');}
  io.reportDue=true;   // the board wants to see you: a report modal opens once the queue is clear
}
function ipoOust(){const io=S.co.ipo;const E=exitNet(Math.round(io.price*io.yourShares*0.9)+Math.max(0,S.co.cash)-S.co.loan);
  S.over={mi:monthOf(S.day),peak:Math.max(...S.hist.map(h=>h.mrr),mrr()),sold:{head:'Ousted',title:'The board has removed you',body:'After two bad quarters running, the board lost patience and voted you out as CEO of '+S.co.name+'. You keep your shares, sold down at '+spx(io.price)+', but the company is someone else’s to run now.',net:E.net,cgt:E.cgt,gross:E.gross,home:(S.co.home||0)+(S.co.divs||0),offer:marketCap()}};
  log('The board has removed you as CEO after two bad quarters.','bad');}
ACT_EXT.ipoWin=()=>{const io=S.co.ipo;if(!io||!io.hitTarget||S.over)return;
  const E=exitNet(Math.round(io.price*io.yourShares)+Math.max(0,S.co.cash)-S.co.loan);
  S.over={mi:monthOf(S.day),peak:Math.max(...S.hist.map(h=>h.mrr),mrr()),sold:{head:'Tier One',title:'You built a tier-one MSP',body:'You rang the bell on a '+gbp(marketCap())+' public company. From two telephony clients and a laptop in the spare room to this. Your '+pct(yourStakePct())+' stake is worth '+gbp(Math.round(io.price*io.yourShares))+'.',net:E.net,cgt:E.cgt,gross:E.gross,home:(S.co.home||0)+(S.co.divs||0),offer:marketCap()}};
  log('You rang the bell. From a spare room to a '+gbp(marketCap())+' public company.','good');ui.modal=null;};
ACT_EXT.ipoRaise=()=>{const io=S.co.ipo;if(!io||S.over)return;if(io.price<io.floatPrice*0.6){if(typeof toast==='function')toast('The market won’t take a placing while the share price is this weak.');return;}
  if(io.lastRaise!=null&&S.day-io.lastRaise<DPM*12){if(typeof toast==='function')toast('The market won’t stomach another placing so soon, roughly once a year.');return;}
  io.lastRaise=S.day;const newShares=Math.round(io.shares*0.15);const gross=Math.round(newShares*io.price);const fees=Math.round(gross*0.04);
  io.shares+=newShares;S.co.cash+=gross-fees;S.m.setup=(S.m.setup||0)+gross-fees;S.co.capYr=(S.co.capYr||0)+(gross-fees);
  io.price=Math.round(io.price*0.97*100)/100;   // placings price at a discount and dilute the price
  log('Secondary placing: raised '+gbp(gross-fees)+' net by issuing 15% new shares at a discount. Everyone’s stake, including yours, is diluted, and the price softened a little.','event');};
ACT_EXT.ipoSell=v=>{const io=S.co.ipo;if(!io||S.over)return;if(ipoLocked()){if(typeof toast==='function')toast('Your shares are locked up for the first year after floating.');return;}
  const frac=+v;if(!(frac>0&&frac<=1))return;const sell=Math.round(io.yourShares*frac);const gross=Math.round(sell*io.price);const E=exitNet(gross);
  io.yourShares-=sell;S.co.home=(S.co.home||0)+E.net;
  log('You sold '+pct(frac)+' of your holding for '+gbp(gross)+(E.cgt?', '+gbp(E.net)+' after capital gains tax':'')+', banked personally.','good');
  if(io.yourShares<=0){const F=exitNet(Math.max(0,S.co.cash)-S.co.loan);S.over={mi:monthOf(S.day),peak:Math.max(...S.hist.map(h=>h.mrr),mrr()),sold:{head:'Cashed out',title:'You sold the last of your shares',body:'You’ve sold your entire stake in '+S.co.name+' and walked away. It trades on without you.',net:F.net,cgt:F.cgt,gross:F.gross,home:S.co.home||0,offer:marketCap()}};}
};

/* quarterly results at month end */
const _monthEnd_ipo=monthEnd;monthEnd=function(){_monthEnd_ipo();if(!S.over)ipoQuarter();};

/* the Public markets section on the Strategy tab */
function pubSec(){
  if(!isPublic()){
    if(!ipoElig()){const need=[];if(groupMRR()<150000)need.push('£150k MRR (you’re at '+gbp(groupMRR())+')');if(!lastQProfit())need.push('a profitable last quarter');
      return '<div class="sec"><h3>Going public</h3><p class="lede">Float the company on AIM to raise capital and put a public value on what you’ve built. It opens a whole new game of quarterly expectations and a share price, and a bigger prize than any trade sale.</p><p class="mut" style="font-size:.84rem">Needs '+need.join(' and ')+'.</p></div>';}
    const mc=ipoValue();
    return '<div class="sec"><h3>Going public</h3><p class="lede">You’re big enough to float on AIM. Sell a slice of the company to the market for cash, at a public-market valuation of about '+gbp(mc)+'. You keep control, but from then on the market judges you every quarter, and a bad run can cost you the top job.</p><div class="row">'+[15,25,35].map(f=>'<button class="btn'+(f===25?' primary':'')+'" data-act="ipoGo" data-v="'+f+'">Float '+f+'% · raise ~'+gbp(Math.round(mc*f/100*0.94))+'</button>').join('')+'</div><p class="mut" style="font-size:.76rem;margin-top:6px">Fees take about 6% of the raise. Your shares are locked up for the first year.</p></div>';
  }
  const io=S.co.ipo;const rel=io.price/io.floatPrice;const relCls=rel>=1.15?'pos':rel>=0.7?'wrn':'neg';
  const nextQ=3-(monthOf(S.day)%3);
  let h='<div class="sec"><h3>Public markets</h3><div class="tiles"><div class="tile"><span class="k">Share price</span><span class="v '+relCls+'">'+spx(io.price)+'</span><small>floated at '+spx(io.floatPrice)+' ('+pctd(rel)+')</small></div><div class="tile"><span class="k">Market cap</span><span class="v">'+gbp(marketCap())+'</span><small>target '+gbp(io.target)+'</small></div><div class="tile"><span class="k">Your stake</span><span class="v">'+gbp(yourStake())+'</span><small>'+pct(yourStakePct())+' of the company</small></div></div>';
  h+='<p class="lede" style="margin-top:8px">Next results in '+(nextQ===0?'this month':nextQ+' month'+(nextQ>1?'s':''))+'. The market expects about '+gbp(io.expMRR)+' MRR (you’re at '+gbp(groupMRR())+') and a profit. Beat it and the price rises; miss it, or take a breach or a lawsuit, and it falls. '+OUST_STRIKES+' bad quarters under '+gbp(io.floatPrice*0.45)+' and the board removes you'+(io.misses?' — you’ve had '+io.misses+' already':'')+'.</p>';
  h+='<div class="row">'+(io.hitTarget?'<button class="btn primary" data-act="ipoWin">Ring the bell (call it a win)</button>':'')+
    '<button class="btn" data-act="ipoRaise" '+(io.price<io.floatPrice*0.6?'disabled title="Share price too weak"':'')+'>Secondary raise (+15% shares)</button>'+
    (ipoLocked()?'<button class="btn" disabled title="Locked up for the first year">Sell shares</button>':'<button class="btn" data-act="ipoSell" data-v="0.25">Sell 25% of your shares</button><button class="btn" data-act="ipoSell" data-v="1">Sell all &amp; exit</button>')+
    '</div>';
  if(io.priceHist.length>2)h+='<p class="mut" style="font-size:.78rem;margin-top:8px">Price history: '+io.priceHist.slice(-10).map(p=>gbp(p)).join(' → ')+'</p>';

/* ============ build 43: rival relations, phase 3 ============ */
/* Deeper ties between firms: formal alliances, illegal price-fixing cartels,
   betrayal with a reputation that follows you, and a mole for ongoing spying.
   Fictional firms, and the design point stands: the dirtiest moves pay now and
   cost later. */
function ally(r){return !!(r&&r.deals&&r.deals.alliance);}
function allies(){return rivals().filter(ally);}
function cartel(){return S.co.cartel;}
function cartelIds(){const c=cartel();return c&&c.members?c.members:[];}
function inCartel(r){return r&&cartelIds().includes(r.id);}
function cartelSize(){return cartelIds().length;}
function cartelPow(){return clamp(cartelSize()/3,0,1);}
function betrayer(){return S.co.betrayer>S.day;}
function moleOn(r){return r&&S.co.moles&&S.co.moles[r.id];}

/* willingness by character: honourable firms won't fix prices or betray */
function willCartel(r){return r.pers!=='honourable'&&(r.stance>=20||inCartel(r))&&r.tier>=Math.max(1,sizeTier()-1);}
function willAlly(r){const need=r.pers==='predatory'?70:r.pers==='opportunist'?58:50;return r.stance>=need&&r.trust>=(r.pers==='predatory'?70:60)&&!betrayer();}

/* ---------- alliance: a deep, above-board partnership ---------- */
RACTS.alliance={t:'Propose a formal alliance',kind:'fair',d:'A deep partnership: you refer to each other, cover overflow, don’t poach, share intel and warn each other of predators. It unlocks going after big contracts together. Betraying it is remembered across the whole market.',
  ok:r=>ally(r)?'Allied.':r.tier===0?'Too small to be a real partner.':!willAlly(r)?(betrayer()?'Your reputation for betrayal precedes you.':'They need to be Allied and trust you first (keep meeting and dealing straight).'):'',
  go:r=>{r.deals.alliance=S.day;r.deals.refer=S.day;r.deals.overflow=S.day;r.deals.nopoach=S.day;shift(r,12,12);r.allyFloor=1;remember(r,'You formed a formal alliance.');log('You and '+r.name+' are formal allies now. You’ll refer to each other, cover overflow, leave each other’s staff alone, and can go after big contracts together.','good');},
  end:r=>{delete r.deals.alliance;delete r.deals.refer;delete r.deals.overflow;delete r.deals.nopoach;r.allyFloor=0;shift(r,-15,-12);remember(r,'The alliance ended amicably.');log('Your alliance with '+r.name+' has ended. No hard feelings, but no more favours.','event');}};

/* ---------- betrayal: turn on an ally for a quick win ---------- */
RACTS.betray={t:'Betray them',kind:'hard',d:'Use an ally’s trust against them: take a run of their clients and staff at once. A big grab now, but they turn hostile, and every other firm hears you can’t be trusted.',
  ok:r=>!ally(r)&&!inCartel(r)?'Only worth it against an ally or cartel partner.':'',
  go:r=>{const took=Math.min(8,Math.max(3,Math.round(r.clients*0.14)));r.clients=Math.max(1,r.clients-took);
    for(let i=0;i<took;i++){const d=addProspect({note:'A '+r.name+' client, brought over when the alliance broke.'});if(d){d.from=r.id;d.warm=1;d.bidders=[];}}
    if(r.tier>=1&&freeDesk()>=0){const c=genCand(Math.random()<0.5?'eng':'am','rec');c.skill=Math.max(4,c.skill);c.from=r.id;cands(c.role);S.cands[c.role].rec.unshift(c);}
    delete r.deals.alliance;delete r.deals.refer;delete r.deals.overflow;delete r.deals.nopoach;
    if(inCartel(r))S.co.cartel.members=cartelIds().filter(x=>x!==r.id);
    r.stance=-70;r.trust=0;r.target=S.day+DPM*ri(3,5);r.allyFloor=0;
    // word gets around: every other firm trusts you less, and alliances close to you for a while
    for(const o of rivals())if(o!==r){shift(o,-6,-12);}
    S.co.betrayer=S.day+YEAR;S.co.rep=Math.max(5,S.co.rep-6);
    remember(r,'You betrayed the alliance and raided them.');
    log('You turned on '+r.name+': '+took+' of their clients are coming to you. They’re out for blood, and the market has noticed you’ll betray a partner.','event');}};

/* ---------- cartel: illegal price-fixing ---------- */
ACT_EXT.cartelInvite=id=>{const r=rivalById(id);if(!r||inCartel(r))return;
  if(!willCartel(r)){toast&&toast(r.pers==='honourable'?r.name+' won’t touch price-fixing.':r.name+' isn’t interested right now.');shift(r,-2,0);return;}
  S.co.cartel=S.co.cartel||{since:S.day,members:[]};if(!S.co.cartel.members.includes(id))S.co.cartel.members.push(id);
  shift(r,5,3);remember(r,'They joined your pricing arrangement.');addHeat(6,'Price-fixing arrangement with '+r.name,1);
  log(r.name+' has joined a quiet understanding not to undercut each other. Prices hold up, margins improve, and it is very much illegal.','event');};
ACT_EXT.cartelDrop=id=>{const r=rivalById(id);if(!inCartel(r))return;S.co.cartel.members=cartelIds().filter(x=>x!==id);
  shift(r,-4,-2);remember(r,'You dropped them from the arrangement.');if(!cartelSize())S.co.cartel=null;log('You dropped '+r.name+' from the pricing arrangement.','info');};
ACT_EXT.cartelLeave=()=>{if(!cartel())return;for(const id of cartelIds()){const r=rivalById(id);if(r){shift(r,-3,-2);}}S.co.cartel=null;log('You wound up the pricing arrangement. Back to competing on price.','info');};

/* ---------- mole: an ongoing inside source ---------- */
ACT_EXT.moleStart=id=>{const r=rivalById(id);if(!r||moleOn(r))return;if(r.tier<1){toast&&toast('Too small to bother planting a source.');return;}
  const fee=Math.round(rnd(1500,3000)/100)*100;S.co.moles=S.co.moles||{};S.co.moles[r.id]={since:S.day,fee};
  r.intel=3;r.leaked=S.day+YEAR*3;markKnows(insider());addHeat(10,'Planted a source inside '+r.name,1);
  log('You’ve a source inside '+r.name+' now. £'+fee+' a month keeps their pricing and plans on your desk. Bribery and data theft, if it ever comes out.','event');};
ACT_EXT.moleStop=id=>{const r=rivalById(id);if(!moleOn(r))return;delete S.co.moles[r.id];log('You’ve cut your source inside '+(r?r.name:'that firm')+' loose.','info');};

/* ---------- effects ---------- */
/* cartel: members don't undercut you, so high prices lose fewer deals */
const _wc_ze=winChance;winChance=function(d,pm){let p=_wc_ze(d,pm);
  if(cartelSize()>=1){const cr=(typeof catRatio==='function')?catRatio(d):1;if(cr>1)p+=Math.min(0.14,(cr-1)*0.6)*cartelPow();}
  return clamp(p,0.03,0.95);};
/* joint reach: an ally a size up lets you land the occasional big client together */
function jointDaily(){if(S.day%DPM!==11)return;const big=allies().filter(a=>a.tier>=sizeTier()+1||a.tier>=2);if(!big.length)return;
  if(Math.random()<0.5){const a=pick(big);const d=addProspect({note:'A larger contract '+a.name+' brought you in on together.'});if(d){d.warm=1;d.joint=a.id;d.bidders=[];d.seats=Math.round((d.seats||20)*rnd(1.4,2.2));shift(a,3,2);log('You and '+a.name+' are bidding together on a larger contract than either of you could take alone.','good');}}}

/* monthly upkeep: cartel heat and exposure, defections, mole cost and discovery */
function tiesDaily(){
  // mole retainers
  if(S.co.moles)for(const id in S.co.moles){const r=rivalById(id);if(!r){delete S.co.moles[id];continue;}spend((S.co.moles[id].fee||2000)/DPM);r.leaked=S.day+YEAR;}
  if(S.day%DPM!==19)return;
  // cartel: it leaves a trail, and grows harder to hide the bigger it is
  if(cartelSize()){addHeat(2+cartelSize(),'Running a price-fixing cartel',1);
    // a member may defect: opportunists and predators, especially when you're weak
    for(const id of cartelIds().slice()){const r=rivalById(id);if(!r){S.co.cartel.members=cartelIds().filter(x=>x!==id);continue;}
      const pd=(r.pers==='predatory'?0.05:r.pers==='opportunist'?0.03:0.01)*(S.co.rep<40?1.6:1);
      if(Math.random()<pd){S.co.cartel.members=cartelIds().filter(x=>x!==id);r.stance=clamp(r.stance-20,-100,100);r.target=S.day+DPM*ri(2,4);remember(r,'They broke ranks and undercut you.');
        if(Math.random()<0.5){addHeat(14,r.name+' blew the whistle on the cartel',1);log(r.name+' has broken the pricing arrangement and gone to the regulator. This could get very expensive.','bad');}
        else log(r.name+' has broken ranks and is undercutting everyone again.','bad');}}
    if(!cartelSize())S.co.cartel=null;
  }
  // mole discovery risk
  if(S.co.moles)for(const id in S.co.moles){const r=rivalById(id);if(!r)continue;if(Math.random()<(r.pers==='predatory'?0.05:0.03)){delete S.co.moles[id];r.stance=clamp(r.stance-25,-100,100);addHeat(16,'Source inside '+r.name+' was exposed',1);log(r.name+' found your source and has gone to the authorities. They know exactly what you did.','bad');}}
}
const _peopleDaily_ze=peopleDaily;peopleDaily=function(W){_peopleDaily_ze(W);if(S.mkt){jointDaily();tiesDaily();}};

/* ---------- the card: a "Deeper ties" section ---------- */
const _rivalModal_ze=MODAL_EXT.rival;
MODAL_EXT.rival=(M,x)=>{let h=_rivalModal_ze(M,x);if(h===null)return null;const r=rivalById(M.id);if(!r)return h;
  let g='<h3 style="font-size:.95rem;margin:14px 0 4px">Deeper ties</h3>';

  if(ally(r)||inCartel(r))g+='<li class="item"><span><b>'+RACTS.betray.t+'</b> <span class="neg" style="font-size:.76rem">— burns your reputation</span></span><span class="r"><button class="btn sm" data-act="rAct" data-v="'+r.id+':betray">Do it</button></span><span class="sub">'+RACTS.betray.d+'</span></li>';
  // cartel

  // mole
  const mg=moleOn(r);
  g+='<li class="item"><span><b>Plant a source (mole)</b> <span class="neg" style="font-size:.76rem">— illegal</span></span><span class="r">'+(mg?'<button class="btn sm" data-act="moleStop" data-v="'+r.id+'">Cut them loose</button>':'<button class="btn sm" data-act="moleStart" data-v="'+r.id+'">Plant one</button>')+'</span><span class="sub">'+(mg?'Costing you '+gbp(mg.fee)+'/mo. Their pricing and plans stay on your desk.':'An inside source for a monthly retainer: their pricing and plans, ongoing. Bribery and data theft if exposed.')+'</span></li>';
  g+='</ul>';
  if(cartelSize())g+='<p class="mut" style="font-size:.8rem">Your cartel: '+cartelIds().map(id=>{const x=rivalById(id);return x?esc(x.name):'a firm';}).join(', ')+'. <button class="linkbtn" data-act="cartelLeave">Wind it up</button></p>';
  if(betrayer())g+='<p class="neg" style="font-size:.8rem">Your reputation for betrayal is still fresh, alliances are hard to form for now.</p>';
  // insert before the "come in later builds" note if present, else before history/end
  if(h.indexOf('Greyer tactics, alliances and worse come in later builds.')>=0)h=h.replace(/<p class="mut"[^>]*>Greyer tactics, alliances and worse come in later builds\.<\/p>/,g);
  else h=h.replace(/<\/div>$/,g+'</div>');
  return h;};

/* ============ build 46: the Market, its own tab and a proper command centre ============ */
/* Everything about the competition in one place: where you sit, who's friend or
   threat, rich detail per firm, alliances and cartels, and the tender board. */
function mktSortKey(){return ui.mktSort||'clients';}
function mktFilter(){return ui.mktFilter||'all';}
ACT_EXT.mktSort=v=>{ui.mktSort=v;};
ACT_EXT.mktFilter=v=>{ui.mktFilter=v;};
function relKnown(r){return (r.intel||0)>=1||r.metAt;}
function rivalChips(r){const c=[];
  if(typeof ally==='function'&&ally(r))c.push(['pos','Ally']);
  else{if(agreed(r,'refer'))c.push(['','Referrals']);if(agreed(r,'overflow'))c.push(['','Overflow']);if(agreed(r,'nopoach'))c.push(['','No-poach']);}
  if(typeof inCartel==='function'&&inCartel(r))c.push(['wrn','Cartel']);
  if(r.stake)c.push(['','20% stake']);
  if(S.co&&S.co.moles&&S.co.moles[r.id])c.push(['wrn','Mole']);
  if(r.target>S.day)c.push(['neg','Targeting you']);
  return c;}
function priceVsYou(r){const my=myPriceRatio();return r.price<my-0.03?['pos','cheaper than you']:r.price>my+0.03?['neg','dearer than you']:['mut','priced like you'];}
function mktStars(v){const n=Math.max(1,Math.round(v/20));return '★'.repeat(n)+'☆'.repeat(5-n);}

function paneMarket(){
  if(!S.mkt)return '<div class="sec"><p class="empty">Your market opens up once you’re trading. Win a client or two first.</p></div>';
  const me={clients:active().length};

  const cartelN=(typeof cartelSize==='function')?cartelSize():0;
  let h='<div class="sec"><h3>Your market</h3><p class="lede">The MSPs you compete with for clients. You’re number '+rank+' of '+ranked.length+' by clients. Small deals draw cheap sole traders; big ones draw firms with scale and certificates.</p>'+
    '<div class="tiles"><div class="tile"><span class="k">Your rank</span><span class="v">#'+rank+'</span><small>of '+ranked.length+' by clients</small></div>'+
    '<div class="tile"><span class="k">Allies</span><span class="v '+(alliesN?'pos':'')+'">'+alliesN+'</span><small>'+(cartelN?cartelN+' in your cartel':'formal partnerships')+'</small></div>'+
    '<div class="tile"><span class="k">Threats</span><span class="v '+(threatsN?'neg':'')+'">'+threatsN+'</span><small>'+(threatsN?'going after your clients':'nobody’s circling')+'</small></div></div>';
  // industry event
  if(typeof RACTS!=='undefined'&&RACTS.event){const why=RACTS.event.ok();h+='<p class="mut" style="font-size:.82rem;margin-top:6px">'+(why?'Industry event: '+why:'<button class="linkbtn" data-act="rAct" data-v=":event">Go to an industry event</button> (£1,500, a day out) to learn about several firms at once.')+'</p>';}
  h+='</div>';
  // cartel status
  if(cartelN){h+='<div class="sec"><h3>Your cartel <span class="neg" style="font-weight:400;font-size:.8rem">— illegal</span></h3><p class="lede">Firms holding prices with you: '+cartelIds().map(id=>{const x=rivalById(id);return x?esc(x.name):'a firm';}).join(', ')+'. Margins hold up while it lasts, and the heat builds. <button class="linkbtn" data-act="cartelLeave">Wind it up</button></p></div>';}
  // filter + sort controls
  const F=mktFilter(),SK=mktSortKey();
  h+='<div class="sec"><div class="row" style="gap:6px;flex-wrap:wrap"><span class="seg" style="flex-wrap:wrap">'+
    [['all','All'],['allies','Allies'],['threats','Threats'],['cartel','Cartel'],['friendly','Friendly'],['big','Big fish']].map(([k,l])=>'<button data-act="mktFilter" data-v="'+k+'" aria-pressed="'+(F===k)+'">'+l+'</button>').join('')+'</span></div>'+
    '<div class="row" style="gap:6px;margin-top:6px"><span class="mut" style="font-size:.8rem;align-self:center">Sort:</span><span class="seg">'+
    [['clients','Size'],['price','Price'],['rel','Relationship'],['threat','Threat']].map(([k,l])=>'<button data-act="mktSort" data-v="'+k+'" aria-pressed="'+(SK===k)+'">'+l+'</button>').join('')+'</span></div>';
  // build the list
  let list=all.slice();
  if(F==='allies')list=list.filter(r=>typeof ally==='function'&&ally(r));
  else if(F==='threats')list=list.filter(r=>r.target>S.day);
  else if(F==='cartel')list=list.filter(r=>typeof inCartel==='function'&&inCartel(r));
  else if(F==='friendly')list=list.filter(r=>(r.stance||0)>=15);
  else if(F==='big')list=list.filter(r=>r.tier>=2);
  const my=myPriceRatio();
  list.sort((a,b)=>{if(SK==='price')return a.price-b.price;if(SK==='rel')return (b.stance||0)-(a.stance||0);if(SK==='threat')return ((b.target>S.day?1:0)+hostility(b))-((a.target>S.day?1:0)+hostility(a));return b.clients-a.clients;});
  if(!list.length)h+='<p class="empty">No firms match that filter.</p>';

      (relKnown(r)?' · <b>'+stanceWord(r.stance||0)+'</b>'+((r.intel||0)>=1?', '+trustWord(r.trust||50):''):' · not met')+
      (chips.length?'<span class="chips" style="display:block;margin-top:4px">'+chips.map(c=>'<span class="chip'+(c[0]?' '+c[0]:'')+'">'+c[1]+'</span>').join(' ')+'</span>':'')+
      '</span></li>';}).join('')+'</ul>';

  h+='<div class="sec"><p class="mut" style="font-size:.85rem">Formal contracts out to bid live on the <button class="linkbtn" data-act="tab" data-v="tenders">Tenders tab</button> now, with value-adds, consortium bids, reference clients and frameworks.</p></div>';
  return h;
}

/* ============ build 48: deeper regions — local reputation ============ */
/* Your reputation is no longer one national number for expansion: you're known
   at home and a nobody the moment you cross a border. A new branch has to build
   its name locally before work comes easily, which is why greenfield is a slow
   grind and buying a local firm (inheriting their standing) leaps you ahead.
   Local standing drives how hard deals are to win in each region. */
function regRep(k){S.co.regRep=S.co.regRep||{};if(S.co.regRep[k]==null){
    S.co.regRep[k]=(k===regionOf())?(S.co.rep||45):clamp((S.co.rep||45)*0.12+ri(2,10),4,22);}
  return S.co.regRep[k];}
function repWord(v){return v<18?'Unknown':v<38?'Barely known':v<58?'Getting known':v<78?'Well known':'Dominant';}
function regRepMonthly(){S.co.regRep=S.co.regRep||{};
  for(const k of REG_ORDER){const cur=regRep(k);const present=myPresence(k).length;let target;
    if(present){const share=myShare(k);target=clamp(38+share*260+((typeof slaPct==='function'?slaPct():0.9)-0.9)*120,18,96);}
    else{target=clamp((S.co.rep||45)*0.12+ri(0,6),3,24);}
    S.co.regRep[k]=clamp(cur+(target-cur)*0.16,0,100);}
  // a national campaign lifts your name everywhere
  if(typeof betLive==='function'&&betLive('campaign'))for(const k of REG_ORDER)S.co.regRep[k]=clamp(S.co.regRep[k]+1.6,0,100);
}
const _monthEnd_reg=monthEnd;monthEnd=function(){_monthEnd_reg();if(!S.over)regRepMonthly();};

/* local standing makes deals in a region easier or harder to win */

/* ============ build 52: personal tax (income, dividends, capital gains) ============ */
/* UK owner-manager tax, simplified to current bands. The point is the tension: salary
   is taxed hardest (income tax + employee NI), dividends less, and a capital gain on
   exit least of all, thanks to Business Asset Disposal Relief at 10% on the first £1m.
   Building value for the sale beats stripping cash out along the way. */
const TAX={pa:12570,br:50270,hr:125140};
function incomeTaxNI(a){a=Math.max(0,a);let t=0,ti=Math.max(0,a-TAX.pa);
  t+=Math.min(ti,TAX.br-TAX.pa)*0.20;ti-=Math.min(ti,TAX.br-TAX.pa);
  if(ti>0){t+=Math.min(ti,TAX.hr-TAX.br)*0.40;ti-=Math.min(ti,TAX.hr-TAX.br);}
  if(ti>0)t+=ti*0.45;
  let ni=Math.min(Math.max(0,a-TAX.pa),TAX.br-TAX.pa)*0.08;if(a>TAX.br)ni+=(a-TAX.br)*0.02;
  return t+ni;}
function salaryNet(a){return Math.max(0,a-incomeTaxNI(a));}
/* marginal dividend tax, stacked on the salary and dividends already drawn this year */
function divTaxOn(gross){const f=founderSt();const sal=(f&&f.salary||0)*12;
  const prior=(S.co.divLog||[]).filter(x=>S.day-x.d<YEAR).reduce((a,x)=>a+x.v,0);
  const allow=Math.max(0,500-prior);let g=Math.max(0,gross-allow),pos=Math.max(sal,TAX.pa)+prior,tax=0;
  const seg=(top,r)=>{if(g<=0)return;const room=Math.max(0,top-pos);const amt=Math.min(g,room);tax+=amt*r;g-=amt;pos+=amt;};
  seg(TAX.br,0.0875);seg(TAX.hr,0.3375);seg(Infinity,0.3935);return tax;}
function divNet(g){return Math.max(0,g-divTaxOn(g));}
/* capital gains with Business Asset Disposal Relief: 10% to £1m lifetime, then 20% */
function cgtOn(gain){gain=Math.max(0,gain);const used=S.co.cgtUsed||0;const badr=Math.max(0,1e6-used);
  const a=Math.min(gain,badr);return a*0.10+(gain-a)*0.20;}
/* net a capital disposal and record the relief used */
function exitNet(p){p=Math.max(0,Math.round(p));const tax=Math.round(cgtOn(p));S.co.cgtUsed=(S.co.cgtUsed||0)+p;return {net:p-tax,cgt:tax,gross:p};}

/* ============ build 55: in-game feedback button ============ */
/* A small "Feedback" control that opens the claude.ai comment composer anchored to
   itself, so anyone playing the published game can leave notes that land in the
   artifact's comment threads. Uses the composer-only `comments` capability, which
   keeps the game publicly shareable and asks for no consent. Absent in the local
   harness (no window.claude) — the button simply stays hidden there. */
(function(){
  function make(){
    if(document.getElementById('fbBtn'))return;
    var btn=document.createElement('button');
    btn.id='fbBtn';btn.type='button';btn.textContent='Feedback';
    btn.setAttribute('aria-label','Send feedback about the game');
    btn.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9000;display:none;'+
      'font:600 12px/1 ui-sans-serif,system-ui,sans-serif;padding:8px 12px;border-radius:999px;'+
      'border:1px solid rgba(0,0,0,.12);background:var(--p,#2f6feb);color:#fff;cursor:pointer;'+
      'box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:.9';
    btn.onmouseenter=function(){btn.style.opacity='1';};
    btn.onmouseleave=function(){btn.style.opacity='.9';};
    var ns=null,dead=false;
    btn.addEventListener('click',function(){
      if(dead||!ns)return;
      try{
        var r=ns.openComposer({element:btn});
        if(r&&r.then)r.then(function(res){/* res.opened false = soft refusal, nothing to do */},
          function(e){var code=e&&e.code;if(code==='unavailable'||code==='forbidden'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){dead=true;btn.style.display='none';}});
      }catch(e){}
    });
    document.body.appendChild(btn);
    // resolve the capability after load; show the button only if this view can comment
    try{
      if(window.claude&&typeof claude.use==='function'){
        claude.use('comments').then(function(c){if(c){ns=c;btn.style.display='block';}},function(){});
      }
    }catch(e){}
  }
  if(document.body)make();
  else document.addEventListener('DOMContentLoaded',make);
})();

/* ============ build 61: realistic regional SME model (installed base / in-play flow / share ceiling) ============ */
/* A region isn't a tank you drain. It's a large installed base of SMEs. Only a slice is winnable
   each year (contracts renew, or a trigger puts an account in play), and your growth plateaus as
   you approach a sustainable SHARE of the base that your reputation and capacity can hold, not
   because the region empties. Rivals hold real slices of the same base and grow the same way.
   Numbers are ONS-shaped and scaled so a strong local MSP tops out near ~100-130 home clients. */
const REG_BASE={home:2200,se:8000,north:5000,scot:1900,east:2600,sw:2000,wales:2800};
const SWITCH_RATE=0.18;                                   // share of the base that comes into play each year
function regBase(k){return REG_BASE[k]||2000;}
function regInPlay(k){return Math.round(regBase(k)*SWITCH_RATE);}                       // contestable accounts a year
function rivFootprint(r){return r.tier===3?Math.round((r.clients||0)*0.22):(r.clients||0);} // a national is spread across regions
function regRivalsHeld(k){let n=0;for(const r of regRivals(k))n+=rivFootprint(r);return Math.round(n);}
function regServed(k){return regClients(k)+regRivalsHeld(k);}
function regServedFrac(k){const b=regBase(k);return b?clamp(regServed(k)/b,0,1):0;}
/* the share your reputation lets you hold, scaled by difficulty */
function regShareCap(k){const rr=(typeof regRep==='function')?regRep(k):(S.co.rep||50);const d=S.diff==='hard'?0.85:S.diff==='easy'?1.12:1;return clamp((0.02+rr/100*0.035)*d,0.02,0.065);}
function regCeiling(k){return Math.round(regShareCap(k)*regBase(k));}
function regHeadroom(k){const cap=regCeiling(k);return cap?clamp(1-regClients(k)/cap,0,1):0;}
function regYoursShare(k){const b=regBase(k);return b?regClients(k)/b:0;}
function regRivalsShare(k){const b=regBase(k);return b?regRivalsHeld(k)/b:0;}
/* how full you are relative to your sustainable ceiling: 0 while there's room, ramping to 1 near it.
   The 0.55 knee keeps flow full through the mid-game cash crunch. */
function regFullness(k){const cap=regCeiling(k);const pen=cap?regClients(k)/cap:1;return clamp((pen-0.55)/0.45,0,1);}

/* your new-logo flow: full until you near your sustainable share of the region, then a trickle */
marketRoom=function(){const k=(typeof regionOf==='function')?regionOf():'home';return clamp(Math.pow(1-regFullness(k),1.8),0.006,1);};
/* how "full" you are here, for the deal-size taper, cross-sell taper and the coach */
function homeSaturation(){return regFullness((typeof regionOf==='function')?regionOf():'home');}
/* cross-sell room: a client only wants so many services, and a filling region slows attach too, so
   MRR plateaus with the client count instead of every client marching to the full catalogue */
function attachRoom(c){const n=Object.keys(c.svc||{}).length;return clamp(1-(n-1)/3,0,1)*(1-0.6*homeSaturation());} // attach effectively caps a client around ~4 services, so MRR plateaus with the client count

/* keep the pivot coach visible for a spell, not one day */
if(typeof COACH_EVENT!=='undefined')COACH_EVENT.saturated=1;
/* coach: point at the plays once you near your ceiling (region maturity, not an MRR floor) */
if(typeof coachDaily==='function'){const _cd_reg=coachDaily;coachDaily=function(){_cd_reg();
  if(S.staff.length>1&&homeSaturation()>0.72&&(S.salesH||0)>0&&active().length>=25)
    coach('saturated','You’re near the ceiling of what you can realistically hold in your home region: you already serve a strong share of the businesses that come into play here, so winning more locally is slow going. Real growth now comes from elsewhere.','Open the map on the Strategy tab: expand into a new region, buy a local firm to inherit its share, or bid for a big tender.');};}

   Its own tab, richer bids (value-adds, consortium, reference clients, pre-bid

/* ---------- value-adds you can put on a bid ---------- */
const VADD={
  onboard:{t:'Free onboarding',d:'Waive the setup fees. Buyers notice.',q:0.05,cost:x=>Math.round(tenderVal(x)*0.5)},
  transition:{t:'Transition cover',d:'Run their old provider in parallel for a month, on you.',q:0.06,cost:x=>Math.round(tenderVal(x)*0.9)},

  lead:{t:'Dedicated account lead',d:'A named senior contact for them.',q:0.04,cost:x=>0,needAm:true}
};

function tenderVal(x){return (typeof tenderValue==='function')?tenderValue(x):x.svc.reduce((a,k)=>a+refPrice(k)*(SVC[k].unit==='site'?Math.max(1,Math.ceil(x.seats/30)):x.seats),0);}

/* eligible reference clients: happy, in-sector, not already leaving */
function refCands(x){return active().filter(c=>c.sector===x.sector&&c.sat>=72&&c.notice==null).sort((a,b)=>b.sat-a.sat).slice(0,6);}
/* an ally big/able enough to bid with */
function consortiumCands(x){if(typeof allies!=='function')return [];return allies().filter(r=>r.tier>=1);}

/* quality the player's bid earns, before the field is normalised */
function bidQuality(x,b){
  b=b||x.bid||{};
  let q=S.co.rep/100*0.6+(S.co.iso?0.1:0)+sizeTier()*0.05
    +(S.co.iso9001?0.03:0)+(S.co.iso20000?0.04:0)+(S.co.iso22301?0.03:0)+(S.co.iso14001?0.02:0)
    +Math.min(0.15,active().filter(c=>c.sector===x.sector).length*0.03)
    +(slaPct()>0.95?0.05:0)+(b.writer?0.06:0);
  // value-adds
  for(const k of (b.vadd||[]))if(VADD[k])q+=VADD[k].q;
  // reference clients (diminishing)
  const nref=(b.refs||[]).length;q+=Math.min(0.12,nref*0.045);
  // pre-bid meeting
  if(b.preBid)q+=0.045;
  // a consortium partner lifts credibility with their size and certs
  const p=b.partner&&(typeof rivalById==='function')&&rivalById(b.partner);
  if(p)q+=0.05+p.tier*0.03+(p.iso?0.04:0);
  return q;
}

function bidMeetsReqs(x,b){
  const R=(typeof reqList==='function')?reqList(x):[];

}

      if(S.day>=f.callNext&&T.open.filter(z=>z.callOff===f.id&&z.state==='open').length<2){
        const c=genCallOff(f);T.open.push(c);f.callNext=S.day+ri(14,30);
        if(Math.random()<0.6)log('Call-off from the '+f.name+': '+c.name+', '+c.seats+' users.','event');}
    }
  };
}

/* ---------- scoring: levers, consortium, frameworks, feedback ---------- */
if(typeof decideTender==='function'){
  decideTender=function(x){const T=tenders();T.open=T.open.filter(z=>z!==x);
    const reqs=x.reqs||[];const rg=x.region||'home';const bidders=[];
    const streak=S.co.tStreak||0; // the more you win on the trot, the harder rivals come at you
    // who among the rivals competes
    let pool;
    if(x.callOff){const f=frameworks().find(z=>z.id===x.callOff);pool=(f&&f.rivals?f.rivals:[]).map(id=>rivalById(id)).filter(Boolean);}
    else pool=rivals().filter(r=>(r.region||'home')===rg||((x.size>=2)&&r.tier>=2));
    for(const r of pool){if(!reqs.every(([k,n])=>TREQ[k].r(r,n)))continue;
      const keen=(x.mega?0.6:x.framework?0.72:x.callOff?0.72:(0.5+0.2*r.aggr))+Math.min(0.3,streak*0.05);
      if(Math.random()<keen)bidders.push({r,name:r.name,price:r.price*rnd(0.9,1.02),q:r.rep/100*0.62+(r.iso?0.1:0)+r.tier*0.07+(r.tier>=2?0.05:0)+rnd(0,0.12)});}
    if(x.bid){const lowball=Math.max(0,0.8-x.bid.ratio);
      const myb={me:true,name:S.co.name,price:Math.max(0.8,x.bid.ratio),q:Math.max(0.05,bidQuality(x)+rnd(0,0.1)-lowball*2.5)};
      bidders.push(myb);
      // a credible competitor turns up so wins are earned, more so on bigger, more contested work and after a winning run
      const pInject=clamp(0.4+0.12*(x.size||0)+(x.mega?0.2:0)+(x.framework?0.12:0)+Math.min(0.4,streak*0.07),0,0.95);
      const best=bidders.reduce((m,b)=>b.me?m:Math.max(m,b.q),0);
      // a solid competitor at a fixed baseline (stiffened by winning runs), so investing in the bid genuinely helps you beat it
      const compQ=clamp(0.52+(x.mega?0.16:x.size>=2?0.08:0)+Math.min(0.22,streak*0.03)+rnd(0,0.16),0.4,1.06);
      if(best<compQ&&Math.random()<pInject)bidders.push({name:pick(['Northbridge IT','Kestrel Managed','Aldgate Technology','Pennine Systems','Marlow & Vale IT','Cindermill Digital','Foxfield Networks']),price:myb.price*rnd(0.92,1.04),q:compQ});}
    if(!bidders.length){x.state='void';x.winner=null;T.done.unshift(x);T.done=T.done.slice(0,8);log('Nobody qualified for the '+x.name+'. It will be re-run.','info');return;}
    const low=Math.min(...bidders.map(b=>b.price)),topQ=Math.max(...bidders.map(b=>b.q));
    for(const b of bidders)b.score=x.wPrice*(low/b.price)+(1-x.wPrice)*(b.q/topQ);
    bidders.sort((a,b)=>b.score-a.score);
    x.field=bidders.length;x.state='done';
    const mine=bidders.find(b=>b.me);
    if(mine){x.myRank=bidders.indexOf(mine)+1;x.myScore=Math.round(mine.score*100);
      x.myPrice=mine.price;x.myQ=mine.q;}

    // frameworks: the top few qualifiers all get a place
    if(x.framework){
      const places=Math.min(bidders.length,3);const winners=bidders.slice(0,places);
      x.winner=winners.map(b=>b.name).join(', ');
      const f={id:x.id,name:x.name,sector:x.sector,svc:x.svc.slice(),region:x.region,years:x.years||3,until:S.day+DPM*12*(x.years||3),member:!!(mine&&winners.includes(mine)),rivals:winners.filter(b=>!b.me&&b.r).map(b=>b.r.id),callNext:S.day+ri(10,20)};
      frameworks().push(f);
      T.done.unshift(x);T.done=T.done.slice(0,8);
      if(f.member){x.won=true;S.co.tStreak=(S.co.tStreak||0)+1;log('You’re on the '+x.name+' for '+f.years+' years. Call-offs will come to you.','good');if(typeof x19==='function')x19('tenderWon');}
      else {if(mine)S.co.tStreak=0;log(x.name+' places went to '+x.winner+'. You didn’t make the cut'+(mine?' ('+ordinal(x.myRank)+' of '+bidders.length+')':'')+'.','bad');}
      applyBidCosts(x,false);
      return;
    }

    const w=bidders[0];x.winner=w.name;
    T.done.unshift(x);T.done=T.done.slice(0,8);
    if(x.bid)S.co.tStreak=w.me?(S.co.tStreak||0)+1:0;
    if(w.me){
      const b=x.bid;const share=b.partner?0.6:1;const seats=Math.max(1,Math.round(x.seats*share));
      const d={id:uid(),kind:'new',name:x.name,sector:x.sector,seats,svc:x.svc.slice(),created:S.day,exp:S.day,stage:'pitched',pm:b.pm,term:x.term,win:1,big:true,note:'',kit:genKit(x.svc)};
      resolveDeal(d);x.won=true;
      // consortium partner takes the rest
      if(b.partner){const p=rivalById(b.partner);if(p){p.clients++;shift(p,6,4);log(x.name+' won with '+p.name+': you take ~'+pct(share)+', they take the rest.','good');}}
      else log('You won the '+x.name+': '+seats+' users on a '+x.term+'-month contract.','good');
      if(x.mega)log('That is a major contract. Watch your onboarding and desk capacity over the next few months.','event');
      applyBidCosts(x,true);
      if(typeof x19==='function')x19('tenderWon');
    }else{
      if(w.r){w.r.clients++;w.r.beatMe=(w.r.beatMe||0)+(x.bid?1:0);}
      if(mine){const gap=w.price<mine.price-0.02?'on price':(w.q>mine.q?'on quality':'on price');x.lossReason=gap;
        log(w.name+' won the '+x.name+' '+gap+'. You came '+ordinal(x.myRank)+' of '+bidders.length+'.','bad');}
      applyBidCosts(x,false);
    }
  };
}
/* value-add costs land when you win; the bid-writer/pre-bid time was already spent */
function applyBidCosts(x,won){const b=x.bid;if(!b)return;
  if(won){let c=0;for(const k of (b.vadd||[]))if(VADD[k])c+=(VADD[k].cost?VADD[k].cost(x):0);
    if(c){S.co.cash-=c;S.m.other=(S.m.other||0)+c;log('Bid commitments on '+x.name+' cost '+gbp(c)+' up front.','info');}
    if((b.vadd||[]).includes('sla'))x.slaGuarantee=true;}
}

/* ============ build 73: managers and C-suite that actually take over ============
   - Projects Manager: schedules projects to a policy you set, and runs onboarding
     (auto-plans, keeps jobs on time, sees them live) so nothing waits on you.
   - Technical Manager: real engineering leadership — faster second line, fewer
     reopens, mentoring that grows engineers, tighter project delivery.
   - C-suite: each executive makes the final call in their domain, replacing you
     for the decisions they own once they're hired. */

/* ---------- Projects Manager ---------- */
function pmOn(){return (typeof hasPM==='function')&&hasPM();}
function projPolicy(){return S.co.projPolicy||'deadline';}
function onbPolicy(){return S.co.onbPolicy||'recommended';}
const PROJ_POL={
  deadline:{t:'Hit every deadline',d:'Work the projects closest to their due date first.'},
  margin:{t:'Protect margin',d:'Work the most profitable projects first.'},
  risk:{t:'Rescue clients',d:'Put the least happy clients’ work first.'}
};
const ONB_POL={
  recommended:{t:'Recommended',d:'Align kit where it pays back, keep the rest.'},
  align:{t:'Align to my stack',d:'Move every client onto your standard tools.'},
  asis:{t:'Keep their kit',d:'Support what they already run; cheapest to start.'}
};
/* project work order: default is by deadline; a PM applies your policy */
function projOrder(a,b){
  if(!pmOn())return a.due-b.due;
  const pol=projPolicy();
  if(pol==='margin')return (b.value-(b.cost||0))-(a.value-(a.cost||0));
  if(pol==='risk'){const ca=C(a.cid),cb=C(b.cid);return (ca?ca.sat:100)-(cb?cb.sat:100);}
  return a.due-b.due;
}
/* a PM (or a COO, if there's no PM) plans onboarding the moment discovery ends,
   so it never sits waiting for your decision */
if(typeof discoveryDone==='function'){
  const _dd=discoveryDone;
  discoveryDone=function(o){_dd(o);
    if(o&&o.stage==='plan'&&o.plan&&(pmOn()||(typeof exec==='function'&&exec('coo')))){
      const c=C(o.cid);const pol=onbPolicy();
      for(const cat in o.plan){
        if(pol==='align'){const E=(typeof kitEconomics==='function')?kitEconomics(c,cat):{};o.plan[cat]=E.locked?'renewal':(E.bl?'asis':'align');}
        else if(pol==='asis'){const E=(typeof kitEconomics==='function')?kitEconomics(c,cat):{};o.plan[cat]=E.locked?'renewal':'asis';}
        // 'recommended' keeps what recommend() already chose
      }
      confirmPlan(o);
      log((pmOn()?'Your projects manager':'Your COO')+' set '+(c?c.name:'the')+'’s onboarding plan and started delivery.','info');
    }
  };
}

/* ---------- Technical Manager: engineering leadership ---------- */
function theTM(){return S.staff.find(s=>s.role==='tm'&&present(s));}
function tmPow(){const m=theTM();return m?clamp(0.5+0.1*(m.skill||2),0.5,1):0;}
/* faster second line and project work under a technical manager */

const EVENT_EXEC={
  ransomware:'cto',carrier:'cto',hike:'cto',cyberEss:'cto',breach:'cto',incident:'cto',
  msft:'cfo',acquired:'cfo',
  poach:'coo',burnout:'coo',resign:'coo',rival:'coo',mgrAsk:'coo'
};
function execChoiceIdx(id,e,ctx){
  const n=e.choices.length;let i=0;
  switch(id){
    case 'ransomware':i=S.co.cash>20000?1:0;break;   // recover free when you can afford to
    case 'carrier':i=0;break;                          // ring every client, halve the damage
    case 'hike':i=1;break;                             // push back on the vendor
    case 'cyberEss':i=0;break;                         // get certified
    case 'breach':i=0;break;                           // disclose; never bury it
    case 'incident':i=0;break;                         // report it properly
    case 'msft':i=0;break;                             // pass the rise on, protect margin
    case 'acquired':i=1;break;                         // hand over gracefully
    case 'poach':i=S.co.cash>15000?0:n-1;break;        // match if affordable, else let go
    case 'burnout':i=0;break;                          // give them time off
    case 'resign':i=S.co.cash>15000?0:1;break;         // counter, or talk it through
    case 'rival':i=0;break;                            // match the price to keep them
    case 'mgrAsk':i=(ctx&&ctx.need>=0.4)?0:n-1;break;  // approve reasonable asks
    default:i=0;
  }
  return Math.max(0,Math.min(n-1,i));
}
function execResolvePending(){
  if(!S||V._execBusy)return;let guard=0;
  while(S.pending&&EVENT_EXEC[S.pending.id]&&typeof exec==='function'&&exec(EVENT_EXEC[S.pending.id])&&guard++<6){
    const id=S.pending.id,ctx=S.pending.ctx,role=EVENT_EXEC[id];
    V._execBusy=true;
    let e=null;try{e=pendingEvent();}catch(_){e=null;}
    if(!e||!e.choices||!e.choices.length){V._execBusy=false;break;}
    const idx=execChoiceIdx(id,e,ctx);
    S.pending=null;
    try{e.choices[idx].go();}catch(_){}
    const R=EXEC_ROLE[role],nm=(exec(role)||{}).name||R.t;
    log(nm+' ('+R.t+') handled it — '+e.title+': '+e.choices[idx].label+'.','info');
    V._execBusy=false;
  }
}

function orgChartHTML(){
  const P=(typeof exec==='function');
  const present=r=>P&&!!exec(r);

  const placed={};
  // one node per manager role (first of each); collect extras as leftovers

  for(const s of staffOn()){
    if(ORG_MGR_ROLES.includes(s.role)){if(!mgrByRole[s.role]){mgrByRole[s.role]=s;placed[s.id]=1;}else extraStaff.push(s);}

/* ============ build 75: training for every manager ============
   Each manager who has staff can train them, within a quarterly budget you set,
   toward either stack gaps or skill level (or both). Replaces the HDM-only
   training routines with one system that covers HDM→desk, TM→engineers,
   SM→account managers, BM→billing clerks. */

const MGR_TRAINS={hdm:'desk',tm:'eng',sm:'am',bm:'bill'};
const TRAIN_PLURAL={desk:'analysts',eng:'engineers',am:'account managers',bill:'billing clerks'};
const canStackTrain=icRole=>icRole==='desk'||icRole==='eng';

function trainBudget(m){return m.trainB!=null?m.trainB:((m.lim&&m.lim.train!=null)?m.lim.train:1000);}
function trainFoc(m){const ic=MGR_TRAINS[m.role];const cs=canStackTrain(ic);return m.trainFoc||(cs?'both':'skill');}

/* the monthly training run for every manager with reports */
function mgrTrainRun(){
  if(S.day%DPM!==5)return;
  const core=(typeof coreProds==='function')?coreProds():[];
  for(const role in MGR_TRAINS){
    const m=S.staff.find(s=>s.role===role&&present(s));if(!m)continue;
    const q=Math.floor(monthOf(S.day)/3);if(m.trQ!==q){m.spent=0;m.trQ=q;}
    const budget=trainBudget(m);if(budget<=0)continue;
    const ic=MGR_TRAINS[role],cs=canStackTrain(ic);
    let foc=trainFoc(m);if(!cs)foc='skill';
    const reports=()=>S.staff.filter(s=>s.role===ic&&present(s));
    let booked=0;
    while(booked<2&&(m.spent||0)<budget){
      let did=false;
      if((foc==='stack'||foc==='both')&&cs&&core.length){
        let best=null;for(const s of reports())for(const p of core){const f=fam(s,p);if(f<0.6&&(!best||f<best.f))best={s,p,f};}
        if(best){const cost=courseCost(best.p);if((m.spent||0)+cost<=budget){spend(cost);m.spent=(m.spent||0)+cost;best.s.away=S.day+1;best.s.course=best.s.away;best.s.fam[best.p]=Math.max(fam(best.s,best.p),0.85);log(m.name+' booked '+best.s.name+' on '+aN(PRODS[best.p].name)+' course.','info');did=true;booked++;continue;}}
      }
      if(foc==='skill'||foc==='both'){
        const s=reports().filter(x=>x.skill<5&&(x.trained||-999)+DPM<=S.day).sort((a,b)=>a.skill-b.skill)[0];
        if(s){const cost=(typeof trainCostOf==='function')?trainCostOf(s):1000;if((m.spent||0)+cost<=budget){spend(cost);m.spent=(m.spent||0)+cost;s.away=S.day+3;s.course=s.away;s.trained=S.day;s.xp=(s.xp||0)+(hasT(s,'quick')?0.7:0.5);s.morale=Math.min(100,s.morale+6);let up='';if(s.xp>=1){s.xp-=1;s.skill++;s.skillAt=S.day;up=' They come back a level '+s.skill+'.';}log(m.name+' sent '+s.name+' on a skills course.'+up,'info');did=true;booked++;continue;}}
      }
      if(!did)break;
    }
  }
}

    if(co.cover)h+='<li class="item"><span><b class="wrn">A breach you didn’t disclose</b></span><span class="r wrn">exposure</span><span class="sub">'+(co.cover.ids?co.cover.ids.length+' clients affected. ':'')+'Could surface by around '+dLabel(co.cover.d)+', which would be far worse than owning it now.</span></li>';
    h+='</ul>';}
  h+='</div>';

  // compliance & cover, with actions
  const row=(name,status,cls,desc,actBtn)=>'<li class="item"><span><b>'+name+'</b></span><span class="r '+(cls||'')+'">'+status+'</span><span class="sub">'+desc+(actBtn?'<span class="row" style="margin-top:6px">'+actBtn+'</span>':'')+'</span></li>';
  h+='<div class="sec"><h3 style="font-size:.98rem">Certifications &amp; cover</h3><ul class="list">';
  h+=row('Cyber Essentials Plus',co.ce?'Certified':gbp(2400),co.ce?'pos':'',
    'The UK baseline security certificate. Most tenders ask for it; small reputation lift.',

  h+=row('ISO 27001 (information security)',co.iso?'Certified':co.isoAt?'In progress':gbp(15000),co.iso?'pos':co.isoAt?'wrn':'',
    'The information security standard. Wins bigger tenders and eases audits.'+(co.isoAt&&!co.iso?' <b>About '+isoHoursLeft()+' engineer hours of work left.</b>':''),
    (co.iso||co.isoAt)?'':'<button class="btn sm" data-act="iso">Start certification · '+gbp(15000)+'</button>');
  if(typeof ISO_CERTS!=='undefined')for(const k of ['iso9001','iso20000','iso22301','iso14001']){const IC=ISO_CERTS[k];if(!IC)continue;
    h+=row(IC.t,co[k]?'Certified':co[k+'At']?'In progress':gbp(IC.cost),co[k]?'pos':co[k+'At']?'wrn':'',
      IC.desc+(co[k+'At']&&!co[k]?' <b>Due around '+dLabel(co[k+'Done'])+'.</b>':''),
      (co[k]||co[k+'At'])?'':'<button class="btn sm" data-act="isoCert" data-v="'+k+'">Start certification · '+gbp(IC.cost)+'</button>');}
  h+=row('Professional indemnity',co.pi?gbp(piPrem())+'/mo':'None',co.pi?'pos':'',
    'Covers damages and legal fees above a £25,000 excess when a client sues over a breach or the service. Claims pay only once the policy is three months old'+(co.pi&&S.day-(co.piAt||0)<DPM*3?'. <b class="wrn">Still too new to claim on.</b>':(co.pi?' (active).':'.'))+(co.piMult>1?' Premium loaded ×'+(co.piMult).toFixed(2)+' after claims.':''),
    '<button class="btn sm" data-act="piToggle">'+(co.pi?'Cancel cover':'Take out cover')+'</button>');
  h+=row('In-house legal counsel',co.counsel?'Engaged':'None',co.counsel?'pos':'',
    'Halves your legal fees and improves your odds in a dispute.',
    '<button class="btn sm" data-act="counselToggle">'+(co.counsel?'Let them go':'Appoint counsel')+'</button>');
  h+=row('Compliance consultant',co.compl?'Engaged':'None',co.compl?'pos':'',

  if(co.aud)h+='<p class="note'+(passChance()<0.6?' warn':'')+'">'+(co.reg?'You’re a regulated MSP: significant client incidents must be reported within 24 hours, and failing the annual regulator audit means a fine as well as lost clients.':'Your bigger clients audit you every year; failing means some of them leave.')+' Next audit around '+mLabel(monthOf(co.auditAt))+'. Pass chance on the past year of process: about '+pct(passChance())+'.'+(co.auditFails?' <b class="neg">'+co.auditFails+' recent failure'+(co.auditFails>1?'s':'')+'.</b>':'')+'</p>';

/* ============ build 78: a fire sale before the bank ends it ============
   When the overdraft is called in, the player gets one last chance to sell
   assets (investment stakes and branches) at distress prices to clear it and
   keep the company, rather than folding instantly. */

function fireSaleValue(){
  let t=0;
  if(typeof branches==='function')for(const b of branches())t+=Math.round((typeof brValue==='function'?brValue(b):0)*0.8);
  if(typeof rivals==='function')for(const r of rivals())if(r.stake&&typeof stakePrice==='function')t+=Math.round(stakePrice(r)*0.85);
  return t;
}
function bankRescueAvailable(){const fs=fireSaleValue();return fs>0&&(S.co.cash+fs)>-OD_LIMIT;}
/* sell stakes first, then the smallest branches, at distress prices, until clear */
function fireSaleRun(target){
  if(typeof rivals==='function')for(const r of rivals().slice()){if(S.co.cash>=target)break;if(r.stake&&typeof stakePrice==='function'){const v=Math.round(stakePrice(r)*0.85);S.co.cash+=v;delete r.stake;log('Fire sale: sold your stake in '+r.name+' for '+gbp(v)+'.','event');}}
  if(typeof branches==='function'){const bs=branches().slice().sort((a,b)=>brValue(a)-brValue(b));
    for(const b of bs){if(S.co.cash>=target)break;const v=Math.round(brValue(b)*0.8);S.co.cash+=v;branches().splice(branches().indexOf(b),1);log('Fire sale: sold the '+b.name+' for '+gbp(v)+'.','event');}}
}

if(typeof HUMAN!=='undefined'){
  HUMAN.bankCall={w:0,ok:()=>false,make:x=>{
    const short=Math.round(-S.co.cash);const fs=fireSaleValue();
    const assets=[];
    if(typeof branches==='function')for(const b of branches())assets.push('the '+b.name+' (~'+gbp(Math.round(brValue(b)*0.8))+')');
    if(typeof rivals==='function')for(const r of rivals())if(r.stake)assets.push('your stake in '+r.name+' (~'+gbp(Math.round(stakePrice(r)*0.85))+')');
    const end=()=>{S.over={mi:monthOf(S.day),peak:Math.max(...S.hist.map(h=>h.mrr).concat([mrr()]))};};
    return {kicker:'The bank · final notice',title:'The bank is calling in the overdraft',
      body:'You’re '+gbp(short)+' overdrawn and out of time. The bank will put '+S.co.name+' into administration unless you clear it now. You could hold a fire sale — '+(assets.length?assets.join(', '):'nothing much left to sell')+' — though forced sales fetch less than the assets are worth. It would raise about '+gbp(fs)+'.',
      choices:[
        {label:'Hold a fire sale to survive',note:'Sell assets at a discount to clear the overdraft and keep the company.',go(){fireSaleRun(0);
          if(S.co.cash>-OD_LIMIT){S.co.red=0;S.co.bankCalled=false;log('You cleared the overdraft with a fire sale. '+S.co.name+' survives, smaller but standing.','good');}
          else{end();log('Even the fire sale wasn’t enough. '+S.co.name+' goes into administration.','bad');}}},
        {label:'Let it go into administration',note:'The company folds.',go(){end();log('You let '+S.co.name+' go into administration.','bad');}}
      ]};}};
}

/* ============ build 79: more ISO certifications + investment options ============
   - The other ISO standards as buyable certifications (9001, 20000, 22301, 14001),
     alongside the existing ISO 27001, wired into tender requirements and bids.
   - Investment: tradable public shares in the national MSPs, and a business
     savings account. Both live on the Invest tab. */

/* ---------- the new certifications ---------- */
const ISO_CERTS={
  iso9001:{t:'ISO 9001 (quality management)',cost:8000,days:45,rep:2,desc:'The quality-management standard. Steadies your processes and reassures buyers on bigger tenders.'},
  iso20000:{t:'ISO 20000 (IT service management)',cost:10000,days:52,rep:3,desc:'The service-management standard, built on ITIL. Wins service-led tenders and helps you pass audits.'},
  iso22301:{t:'ISO 22301 (business continuity)',cost:9000,days:50,rep:2,desc:'The continuity standard. Softens the hit from incidents, and counts on resilience-minded tenders.'},
  iso14001:{t:'ISO 14001 (environmental)',cost:5000,days:40,rep:1,desc:'The environmental standard. Public-sector and large corporate tenders increasingly ask for it.'}
};

/* rename the existing standard clearly, and register the new ones as tender requirements */
if(typeof TREQ!=='undefined'){
  if(TREQ.iso)TREQ.iso.t='ISO 27001 (information security)';
  TREQ.iso9001={t:'ISO 9001 (quality management)',me:()=>!!S.co.iso9001,r:r=>r.tier>=2||r.iso};
  TREQ.iso20000={t:'ISO 20000 (IT service management)',me:()=>!!S.co.iso20000,r:r=>r.tier>=2||r.iso};
  TREQ.iso22301={t:'ISO 22301 (business continuity)',me:()=>!!S.co.iso22301,r:r=>r.tier>=2};
  TREQ.iso14001={t:'ISO 14001 (environmental)',me:()=>!!S.co.iso14001,r:r=>r.tier>=3||(r.tier>=2&&r.iso)};
}

ACT_EXT.isoCert=v=>{const C=ISO_CERTS[v];if(!C||S.co[v]||S.co[v+'At'])return;
  if(S.co.cash<C.cost){if(typeof toast==='function')toast('Not enough cash for '+C.t+'.');return;}
  spend(C.cost);S.co[v+'At']=S.day;S.co[v+'Done']=S.day+C.days;
  log(C.t+' certification under way. It should complete in about '+Math.max(1,Math.round(C.days/DPM))+' month'+(Math.round(C.days/DPM)>1?'s':'')+'.','event');};

function isoDaily(){for(const k in ISO_CERTS){if(S.co[k+'At']&&!S.co[k]&&S.day>=(S.co[k+'Done']||0)){
  S.co[k]=true;S.co.rep=Math.min(100,(S.co.rep||0)+ISO_CERTS[k].rep);log(ISO_CERTS[k].t+' certified.','good');}}}

/* certs help process/audits and incident resilience, modestly */
if(typeof procScore==='function'){const _ps=procScore;procScore=function(avg){return _ps(avg)+(S.co.iso9001?0.15:0)+(S.co.iso20000?0.15:0);};}
if(typeof secDef==='function'){const _sd=secDef;secDef=function(){return clamp(_sd.apply(this,arguments)+(S.co.iso22301?0.05:0),0,0.9);};}

/* ---------- investments: public shares in the nationals + a savings account ---------- */
const SAVE_APR=0.038;
/* interest rates shown to one decimal, so 4.5% doesn't round to a misleading "5%" (5.0% still shows as "5%") */
function rpct(v){return (Math.round(v*1000)/10).toString().replace(/\.0$/,'')+'%';}
function natFirms(){return (typeof rivals==='function'?rivals():[]).filter(r=>r.tier>=3);}
/* a share is 0.1% of the firm; price tracks its size and a slow market mood */
function shareBase(r){const N=(typeof SHARES_OUT!=='undefined'?SHARES_OUT:1000000);return Math.max(0.01,Math.round(rSeats(r)*45*12*0.9/N*100)/100);}
function sharePx(r){return Math.max(0.01,Math.round(shareBase(r)*(r.shareMood||1)*100)/100);}

ACT_EXT.shareBuy=v=>{const [rid,amt]=(v||'').split(':');const r=rivalById(rid);if(!r||r.tier<3)return;
  const px=sharePx(r);const a=+amt;if(!a||S.co.cash<a||a<px)return;const u=Math.floor(a/px);if(u<1)return;const cost=u*px;
  S.co.cash-=cost;S.co.shares=S.co.shares||{};const hd=S.co.shares[rid]||{units:0,paid:0};hd.units+=u;hd.paid+=cost;S.co.shares[rid]=hd;
  log('Bought '+u.toLocaleString()+' shares in '+r.name+' for '+gbp(cost)+'.','info');};
ACT_EXT.shareSell=v=>{const r=rivalById(v);const hd=S.co.shares&&S.co.shares[v];if(!r||!hd)return;
  const val=hd.units*sharePx(r);S.co.cash+=val;S.m.setup=(S.m.setup||0)+val;delete S.co.shares[v];
  log('Sold your shares in '+r.name+' for '+gbp(val)+'.','info');};
ACT_EXT.saveDep=v=>{const a=+v;if(!a||a<=0||S.co.cash<a)return;S.co.cash-=a;S.co.savings=(S.co.savings||0)+a;log('Moved '+gbp(a)+' into the business savings account.','info');};
ACT_EXT.saveWith=v=>{const bal=S.co.savings||0;const a=v==='all'?bal:Math.min(+v||0,bal);if(a<=0)return;S.co.savings=bal-a;S.co.cash+=a;log('Withdrew '+gbp(a)+' from savings.','info');};
ACT_EXT.saveMode=v=>{S.co.savingsCompound=(v==='compound');log('Savings interest will now '+(S.co.savingsCompound?'compound in the account':'be paid out to cash each month')+'.','info');};
ACT_EXT.saveSweep=v=>{S.co.saveSweep=Math.max(0,Math.min(0.9,+v||0));log(S.co.saveSweep>0?'Auto-save on: '+pct(S.co.saveSweep)+' of each month’s profit will move into savings.':'Auto-save from profit turned off.','info');};

/* ---------- free-amount modal for shares and savings (any number, not just presets) ---------- */
function amtMax(M){if(!M)return 0;if(M.kind==='saveWith')return S.co.savings||0;return S.co.cash||0;}
ACT_EXT.shareBuyAsk=rid=>{if(!rivalById(rid))return;ui.amtMsg=null;ui.amtVal='';ui.modal={type:'amt',kind:'shareBuy',rid};};
ACT_EXT.saveDepAsk=()=>{ui.amtMsg=null;ui.amtVal='';ui.modal={type:'amt',kind:'saveDep'};};
ACT_EXT.saveWithAsk=()=>{ui.amtMsg=null;ui.amtVal='';ui.modal={type:'amt',kind:'saveWith'};};
ACT_EXT.amtPreset=v=>{const M=ui.modal;if(!M||M.type!=='amt')return;const a=v==='max'?amtMax(M):Math.floor(+v||0);const el=(typeof $==='function')&&$('amtField');if(el){el.value=String(a);ui.keepModal=true;}ui.amtVal=String(a);};
ACT_EXT.amtGo=()=>{const M=ui.modal;if(!M||M.type!=='amt')return;const el=(typeof $==='function')&&$('amtField');const raw=el?el.value:'';ui.amtVal=raw;
  const a=Math.floor(+(String(raw).replace(/[^0-9.]/g,''))||0);
  if(!a||a<=0){ui.amtMsg='Enter an amount.';return;}
  if(M.kind==='shareBuy'){const r=rivalById(M.rid);if(!r){ui.modal=null;return;}const px=sharePx(r);
    if(a<px){ui.amtMsg='That won’t buy a single share ('+spx(px)+' each).';return;}
    if(a>S.co.cash){ui.amtMsg='You only have '+gbp(S.co.cash)+' in cash.';return;}
    ACT_EXT.shareBuy(M.rid+':'+a);}
  else if(M.kind==='saveDep'){if(a>S.co.cash){ui.amtMsg='You only have '+gbp(S.co.cash)+' in cash.';return;}ACT_EXT.saveDep(String(a));}
  else {const bal=S.co.savings||0;if(a>bal){ui.amtMsg='You only have '+gbp(bal)+' on deposit.';return;}ACT_EXT.saveWith(String(a));}
  ui.modal=null;ui.amtMsg=null;ui.amtVal=null;};
if(typeof MODAL_EXT!=='undefined')MODAL_EXT.amt=(M,x)=>{
  let title,lede,ctx,presets,confirmLabel;const maxV=amtMax(M);
  if(M.kind==='shareBuy'){const r=rivalById(M.rid);if(!r)return null;const px=sharePx(r);
    title='Buy shares in '+esc(r.name);lede=spx(px)+' a share. Buy any amount you can afford — it’s rounded down to whole shares. No control, just the price and a token dividend.';
    ctx='Cash available: <b>'+gbp(S.co.cash)+'</b>';presets=[25000,100000,250000];confirmLabel='Buy';}

    ctx='Cash available: <b>'+gbp(S.co.cash)+'</b>';presets=[50000,250000,1000000];confirmLabel='Deposit';}
  else {title='Withdraw from savings';lede='Move money back into your current account.';
    ctx='On deposit: <b>'+gbp(S.co.savings||0)+'</b>';presets=[50000,250000];confirmLabel='Withdraw';}
  const chips=presets.filter(p=>p<=maxV).map(p=>'<button class="btn sm" data-act="amtPreset" data-v="'+p+'">'+gbp(p)+'</button>').join('')+(maxV>0?'<button class="btn sm" data-act="amtPreset" data-v="max">Max · '+gbp(maxV)+'</button>':'');
  return '<div class="dialog">'+x+'<p class="kick">Investments</p><h2>'+title+'</h2><p>'+lede+'</p>'+
    '<p class="mut" style="font-size:.85rem;margin:0 0 8px">'+ctx+'</p>'+
    '<div class="field"><label for="amtField">Amount (£)</label><input id="amtField" inputmode="numeric" autocomplete="off" placeholder="type any amount" value="'+esc(ui.amtVal||'')+'"></div>'+
    (chips?'<div class="row" style="gap:6px;flex-wrap:wrap;margin:6px 0 2px">'+chips+'</div>':'')+
    (ui.amtMsg?'<p class="note warn">'+esc(ui.amtMsg)+'</p>':'')+
    '<div class="foot2"><span class="grow"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="amtGo">'+confirmLabel+'</button></div></div>';
};

function investMonthly(){
  if((S.co.savings||0)>0){const int=Math.round(S.co.savings*SAVE_APR/12);if(int>0){if(S.co.savingsCompound){S.co.savings+=int;}else{S.co.cash+=int;S.m.invest=(S.m.invest||0)+int;}}}
  /* auto-save: sweep a set share of the month's profit into savings, only from cash spare after
     a month of wages, resold services, rent and tools, so it never starves the business */
  if(S.co.saveSweep>0){const prof=(S.last&&S.last.profit)||0;
    if(prof>0){const buffer=(typeof divBuffer==='function')?divBuffer():0;
      const avail=Math.max(0,Math.floor((S.co.cash-buffer)/100)*100);
      const amt=Math.min(Math.round(prof*S.co.saveSweep),avail);
      if(amt>=100){S.co.cash-=amt;S.co.savings=(S.co.savings||0)+amt;log('Auto-saved '+gbp(amt)+' ('+pct(S.co.saveSweep)+' of the month’s profit) into the savings account.','info');}}}
  const sh=S.co.shares||{};
  for(const rid in sh){const r=rivalById(rid);
    if(!r){const back=Math.round((sh[rid].last||sh[rid].paid)*0.9);S.co.cash+=back;S.m.setup=(S.m.setup||0)+back;S.co.capYr=(S.co.capYr||0)+back;log('A firm you held shares in is no longer listed; your holding returned '+gbp(back)+'.','info');delete sh[rid];continue;}
    const px=sharePx(r);sh[rid].last=sh[rid].units*px;
    const div=Math.round(sh[rid].units*px*0.0022);if(div>0){S.co.cash+=div;S.m.invest=(S.m.invest||0)+div;}}
  for(const r of natFirms())r.shareMood=clamp((r.shareMood||1)*rnd(0.95,1.06)+(r.trend>0?0.015:r.trend<0?-0.02:0),0.7,1.45);
}

/* daily/monthly hooks */
if(typeof peopleDaily==='function'){const _pd=peopleDaily;peopleDaily=function(W){_pd.apply(this,arguments);isoDaily();};}
if(typeof marketMonthly==='function'){const _mm=marketMonthly;marketMonthly=function(){_mm.apply(this,arguments);investMonthly();};}

/* ---------- Invest tab: shares + savings sections ---------- */
function paneInvestShares(){
  const nats=natFirms();const sh=S.co.shares||{};
  let held=0,val=0,paid=0;for(const rid in sh){const r=rivalById(rid);if(!r)continue;val+=sh[rid].units*sharePx(r);paid+=sh[rid].paid;held++;}
  let h='<div class="sec"><h3 style="font-size:.95rem">Public shares in the nationals</h3><p class="lede">The big national MSPs are listed. Buy shares to ride their growth, or sell when they slow. Prices move with the firm’s size and the market’s mood. No control and only a token dividend, just the share price.</p>';
  if(held)h+='<div class="tiles"><div class="tile"><span class="k">Shares value</span><span class="v">'+gbp(val)+'</span><small class="'+(val-paid>=0?'pos':'neg')+'">'+(val-paid>=0?'+':'')+gbp(val-paid)+' vs '+gbp(paid)+' in</small></div><div class="tile"><span class="k">Listings held</span><span class="v">'+held+'</span><small>firm'+(held===1?'':'s')+'</small></div></div>';
  if(!nats.length)return h+'<p class="empty">No national-scale firms are listed right now.</p></div>';
  h+='<ul class="list">';
  for(const r of nats){const px=sharePx(r);const hd=sh[r.id];const mine=hd?hd.units*px:0;const gain=hd?mine-hd.paid:0;
